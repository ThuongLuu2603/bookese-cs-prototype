function processPlan(o,r,v){
  const k=r.kind;
  const amountKeys=['newCash','fee','keepCash','cost','charge','base','usedCoins','usedVoucher','pendingReward','oldValue','airlineFee','difference','processingFee','newTicketPrice','oldRefund','net','markup','nameTransfer','transferCoins','transferVoucher','transferReward'];
  if(!validAmounts(v,amountKeys))return error('Số tiền và xu phải là số nguyên không âm.');
  if(v.sourceStatus!=='approved'){
    r.stage=v.sourceStatus==='waiting'?'supplier':'rejected';r.result=v.sourceStatus==='waiting'?'Đang chờ nguồn / cần bổ sung: '+v.basis:'NCC từ chối: '+v.basis+'. Giữ điều kiện hiện tại; nguồn không phục vụ thì chuyển xử lý sự cố.';
    policyLog(o,r.result);close();return;
  }
  const q={...v};amountKeys.forEach(k=>q[k]=numeric(v[k]));q.exception=v.exception==='yes';q.refund=0;q.transfer=0;q.charge=q.charge||0;q.expires=new Date(v.expires).getTime();
  if(!Number.isFinite(q.expires)||q.expires<=Date.now())return error('Báo giá đã hết hạn. Kiểm lại khả dụng và giá.');
  if(!needText(q.basis))return error('Cần xác nhận nguồn trước khi báo phương án.');
  if(q.exception&&!needText(q.exceptionReason))return error('Lưu lý do, mức phí trước–sau và căn cứ chấp thuận ngoại lệ.');
  if(k==='change'&&q.exception&&(q.hotel!==o.title||q.roomType!==o.roomType))return error('Ngoại lệ đổi ngày giữ khách sạn / hạng phòng. Nâng hạng miễn phí làm việc trực tiếp với KS; thay khách sạn do sự cố dùng Relocation.');
  if(customer()&&k==='cancel'&&(!o.free||q.fee!==0))return error('Hủy có phí phải gửi yêu cầu CS.');
  if(replacementKinds.includes(k)||k==='additional'){
    q.rooms=numeric(v.rooms);const nights=Math.round((new Date(v.end)-new Date(v.start))/86400000);
    if(!Number.isInteger(q.rooms)||q.rooms<1||!Number.isInteger(nights)||nights<1)return error('Kiểm tra số phòng và ngày nhận / trả phòng.');
    if(replacementKinds.includes(k)){
      if(o.amendCount>=3)return error('Booking đã đạt 3 lần amend.');
      if(k==='reduce'){
        if(v.hotel!==o.title||v.start<o.start||v.end>o.end||q.rooms>o.rooms||(q.rooms===o.rooms&&nights===o.nights))return error('Giảm chỉ áp dụng cùng KS, trong giai đoạn cũ và ít phòng / đêm hơn. Đổi ngày sang giai đoạn khác dùng Chuyển booking.');
        const grossB=o.nightlyPrices.filter(p=>p.date>=v.start&&p.date<v.end).reduce((sum,p)=>sum+p.unit*q.rooms,0);
        q.newCash=Math.max(0,Math.round(grossB-o.voucher-o.coins));q.keepCash=0;q.roomType=o.roomType;q.rights=o.rights;q.terms=o.terms;
      }
      const available=cashAvailable(o),net=available-q.fee-q.keepCash;
      if(net<0)return error('Phí và tiền giữ cho dịch vụ còn lại vượt số tiền A có thể sử dụng.');
      q.transfer=Math.min(net,q.newCash);q.charge=Math.max(0,q.newCash-net);q.refund=Math.max(0,net-q.newCash);
      if(q.keepCash>0){q.keepRooms=numeric(v.keepRooms);if(!needText(v.keepDetail)||!Number.isInteger(q.keepRooms)||q.keepRooms<1||q.keepRooms>=o.rooms)return error('Ghi rõ số phòng và dịch vụ còn giữ trên A khi thay một phần.');}
      q.description=`${k==='reduce'?'Giảm còn':'B:'} ${q.rooms} phòng · ${q.hotel} · ${q.start} → ${q.end}. ${k==='reduce'?'Giữ hạng, quyền lợi, điều kiện và giá từng đêm cũ. ':''}Giá khách trả B: ${money(q.newCash)}; phí A: ${money(q.fee)}.`;
    } else q.description='Booking bổ sung: '+q.rooms+' phòng · '+q.start+' → '+q.end+'. '+q.roomArrangement;
  } else if(cancellationKinds.includes(k)){
    if(q.base>cashAvailable(o)||q.fee>q.base)return error('Phần thực trả / phí vượt số tiền còn được xử lý.');
    const left=loyaltyLeft(o);
    if(q.usedCoins>left.coins||q.usedVoucher>left.voucher||q.pendingReward>o.rewardPending)return error('Quyền lợi phân bổ vượt phần còn lại trên đơn.');
    if(k==='void'&&new Date(q.deadline).getTime()<=Date.now())return error('Quá hạn void. Kiểm tra hoàn theo điều kiện.');
    q.refund=q.base-q.fee;q.charge=0;q.description=(o.type==='flight'?currentPassenger(o,{...r,passengerId:v.passengerId}).name+' · '+v.segment:'Phòng / đêm trên đơn')+' · '+(q.scope==='part'?'một phần':'toàn bộ')+'; thực trả '+money(q.base)+'; phí '+money(q.fee);
  } else if(k==='surcharge'){
    q.serviceAmount=q.collector==='free'?0:q.charge;q.charge=q.collector==='bookese'?q.charge:0;q.description=q.detail+' · '+(q.collector==='hotel'?'KS thu trực tiếp':q.collector==='free'?'Miễn phí':'Bookese thu');
  } else if(k==='services'){q.charge=q.net+q.markup;q.description=q.detail+' · '+v.segment;}
  else if(['exchange','reroute'].includes(k)){
    if(k==='exchange'&&(q.airline!==o.airline||q.itinerary!==o.title))return error('Khác hãng hoặc khác chặng phải gửi CS xử lý qua HNH.');
    q.charge=q.airlineFee+q.difference+q.processingFee;
    if(k==='reroute'&&q.exchangeMode==='new'){
      if(!q.newTicketPrice||q.oldRefund>q.oldValue||q.oldValue>cashAvailable(o))return error('Kiểm tra giá vé mới, giá trị vé cũ và số tiền được hoàn.');q.charge=q.newTicketPrice+q.processingFee;
    }
    q.description=q.airline+' · '+q.itinerary+' · '+q.newDate+' · '+q.flight+'; dùng vé cũ '+money(q.oldValue)+'; phí hãng '+money(q.airlineFee)+'; chênh lệch '+money(q.difference)+'; phí Bookese '+money(q.processingFee);
  } else {q.description=k==='name'?'Sửa tên thành '+q.newName:k==='member'?q.program+' · '+q.member:k==='split'?'Tách PNR / kiểm tra xử lý riêng theo vé':q.detail||workflowNames[k];}
  if(k==='name'&&q.nameMode==='new'){
    if(!q.nameTransfer||q.nameTransfer>cashAvailable(o)||q.transferCoins>o.coins||q.transferVoucher>o.voucher||q.transferReward>o.rewardPending)return error('Cần phân bổ đúng tiền và quyền lợi của vé chuyển sang B, không vượt số còn lại.');
    q.transfer=q.nameTransfer;q.exception=true;q.exceptionReason ||= 'HNH xác nhận phải tạo booking B: '+q.basis;
  }
  r.passengerId=v.passengerId||r.passengerId;r.segment=v.segment||r.segment;r.plan=q;r.exception=q.exception;r.stage='quoted';
  policyLog(o,'Đã kiểm phương án '+workflowNames[k]+': '+q.description+' · căn cứ '+q.basis);policyQuote(r);
}
function processTrace(o,r,v){
  if(!['cs','accounting'].includes(actorRole()))return error('CS hoặc Kế toán mới được ghi nhận tra soát.');
  if(!validAmounts(v,['received','traceAmount']))return error('Số tiền không hợp lệ.');
  if(actorRole()==='accounting'){
    r.moneyVerified=v.moneyStatus==='received';r.moneyBasis=v.moneyBasis;r.verifiedAmount=numeric(v.received);r.verifiedBy=state.currentUser;
    if(r.moneyVerified&&v.traceType!=='duplicate'){o.paid=numeric(v.received);o.payment='Đã thu';}
    if(v.moneyStatus==='notreceived')o.payment='Chưa thu';
  } else if(v.moneyStatus==='received'&&!r.moneyVerified&&o.payment!=='Đã thu')return error('Tiền chưa xác minh. Chọn vai trò Kế toán để ghi nhận kết quả giao dịch trước.');
  r.trace={...v,at:stamp()};r.policy=true;
  if(v.traceType==='orders'&&v.traceResult==='refund'){
    if(!isCS())return error('CS xác định đơn cần giữ và điều kiện xử lý đơn còn lại.');
    if(!needText(v.detail))return error('Ghi rõ mã booking giữ lại, booking cần hủy và đồng ý của khách.');
    markDone(o,r,'Nhiều booking: chuyển kiểm điều kiện hủy đơn này. '+v.detail);
    const next=request(o,o.type==='hotel'?'cancel':'refund',{policy:true,note:'Booking trùng: '+v.detail+'. Kiểm điều kiện / phí, chưa tự coi là được hoàn miễn phí.'});close();return openRequest(next.id);
  }
  if(v.traceType==='chargeback'||['dispute','settled'].includes(v.traceResult)){
    if(actorRole()!=='accounting')return error('Kế toán cập nhật tranh chấp và kết luận ngân hàng.');
    const t=o.transactions.find(t=>t.ref===v.reference)||{ref:v.reference,type:'Chargeback'};t.amount=numeric(v.traceAmount);t.status=v.traceResult==='settled'?'Đã có kết luận':'Tranh chấp';t.result=v.detail;if(!o.transactions.includes(t))o.transactions.push(t);
    r.stage=v.traceResult==='settled'?'done':'supplier';r.result=v.basis+' · '+v.detail;policyLog(o,'Chargeback: '+t.status+' · '+r.result+'; không thay đổi dịch vụ.');close();return;
  }
  if(v.traceResult==='found'){
    if(!isCS())return error('Kế toán đã xác minh tiền. Chuyển CS xác nhận dịch vụ.');
    if(o.type==='flight'&&!needText(v.ticket))return error('Cần số vé đã xuất, không chỉ PNR.');
    o.booking='Thành công';o.service='Có hiệu lực';o.supplierId=v.basis;if(o.type==='flight'){o.ticket=v.ticket;o.passengers[0].ticket=v.ticket;o.passengers[0].status='Có hiệu lực';}
    o.failureMoneyReviewed=true;markDone(o,r,'Đã đối chiếu dịch vụ hợp lệ và mô phỏng gửi xác nhận khách. '+v.basis);
  } else if(v.traceResult==='refund'){
    if(!isCS())return error('CS lập đề xuất sau kết quả tra soát của Kế toán.');
    if(o.payment!=='Đã thu'&&!r.moneyVerified)return error('Chưa xác minh thực nhận, chưa lập đề xuất hoàn.');
    const duplicate=v.traceType==='duplicate';
    if(duplicate){if(!r.moneyVerified)return error('Giao dịch thu thừa cần Kế toán xác minh riêng.');if(numeric(v.traceAmount)>r.verifiedAmount)return error('Khoản hoàn không vượt giao dịch thu thừa đã xác minh.');if(!r.duplicateRecorded){o.extraPaid=numeric(o.extraPaid)+r.verifiedAmount;r.duplicateRecorded=true;o.transactions.push({ref:v.reference,requestId:r.id,type:'Thu thừa đã xác minh',amount:r.verifiedAmount});}}
    proposeRefund(o,duplicate?numeric(v.traceAmount):cashAvailable(o),duplicate?'Hoàn giao dịch thu thừa':'Không cung cấp được dịch vụ',{requestId:r.id,basis:v.basis,scope:v.reference});
    o.failureMoneyReviewed=true;markDone(o,r,'Đã lập hồ sơ hoàn tiền; tiếp tục theo luồng CEO / Kế toán.');
  } else if(v.traceResult==='replace'){
    if(!isCS())return error('CS chốt phương án đặt lại với khách.');
    if(!needText(v.detail))return error('Lưu phương án khách đồng ý và bên chịu chênh lệch.');
    markDone(o,r,'Chuyển xử lý sự cố / đặt thay thế: '+v.detail);
    const next=request(o,o.type==='hotel'?'over':'reroute',{policy:true,note:v.detail});next.recovery=true;close();return openRequest(next.id);
  } else if(v.traceResult==='nocharge'){
    if(o.payment!=='Chưa thu')return error('Kế toán cần xác nhận chưa thu tiền trước.');o.failureMoneyReviewed=true;markDone(o,r,'Đã xác minh chưa thu tiền. Không có khoản hoàn.');
  } else {r.stage='supplier';policyLog(o,'Lưu tra soát: '+v.basis+' · '+v.moneyBasis);}
  close();
}

document.addEventListener('submit',e=>{
  if(e.target.id!=='flow-form'||!e.target.dataset.submit.startsWith('policy-'))return;
  e.preventDefault();e.stopImmediatePropagation();
  const action=e.target.dataset.submit,v=Object.fromEntries(new FormData(e.target)),o=current(),r=o.requests.find(x=>x.id===panel?.requestId);
  try{
    if(action==='policy-self-quote'){
      if((!customer()&&!isCS())||!canSelf(o,r.kind))return error('Thao tác dành cho khách hoặc CS hỗ trợ qua hệ thống.');
      const q={charge:0,refund:0,basis:'API-DEMO · Điều kiện / giá mới',expires:Date.now()+30*60000};r.passengerId=v.passengerId;
      if(r.kind==='services'){
        const choices={bag:['Thêm 10 kg hành lý',250000,50000],seat:['Ghế 12A',100000,20000],meal:['Suất ăn',130000,20000]},c=choices[v.choice];if(!c)return error('Chọn dịch vụ hợp lệ.');Object.assign(q,{detail:c[0],net:c[1],markup:c[2],charge:c[1]+c[2],description:c[0]+' · '+r.segment});
      }else Object.assign(q,{airline:o.airline,itinerary:o.title,newDate:v.newDate,flight:v.choice,oldValue:o.paid,airlineFee:100000,difference:v.choice==='VN-DEMO-14'?200000:350000,processingFee:0,charge:v.choice==='VN-DEMO-14'?300000:450000,servicesNote:'Giữ hành lý / ghế theo xác nhận API',description:o.airline+' · '+o.title+' · '+v.newDate+' · '+v.choice+'; phí hãng 100.000 đ, chênh lệch '+money(v.choice==='VN-DEMO-14'?200000:350000)});
      r.plan=q;r.stage='quoted';save();return policyQuote(r);
    }
    if(action==='policy-create'){
      const k=panel.kind,n=request(o,k,{...v,policy:true});n.stage='new';
      if(customer()&&!canSelf(o,k)){policyLog(o,'Khách gửi yêu cầu '+workflowNames[k]+'. Booking chưa thay đổi.');close();return;}
      return openRequest(n.id);
    }
    if(action==='policy-plan'){if(!customer()&&!requireRole('cs'))return;return processPlan(o,r,v);}
    if(action==='policy-consent'){
      if(r.stage!=='quoted'||!v.consent)return error('Cần khách đồng ý phương án đang chờ xác nhận.');
      if(Date.now()>r.plan.expires){r.stage='new';save();return error('Báo giá hết hạn. Đóng cửa sổ và kiểm tra lại phương án.');}
      r.consent={basis:v.consentBasis,at:stamp()};r.stage=r.plan.charge>0?'payment':'ready';policyLog(o,'Khách đồng ý: '+v.consentBasis);return openRequest(r.id);
    }
    if(action==='policy-paid'){
      if(r.stage!=='payment'||r.paid)return error('Yêu cầu không còn ở bước thu tiền.');
      if(Date.now()>r.plan.expires){r.stage='new';save();return error('Báo giá hết hạn; kiểm lại giá / khả dụng trước khi xác nhận tiền.');}
      if(!v.consent||!needText(v.paymentRef))return error('Cần xác minh tiền thực nhận.');
      if(state.orders.some(a=>a.transactions.some(t=>t.ref===v.paymentRef)))return error('Mã giao dịch đã ghi nhận. Tra soát để tránh thu / ghi trùng.');
      r.paid=true;r.paymentRef=v.paymentRef;o.extraPaid=numeric(o.extraPaid)+r.plan.charge;o.transactions.push({ref:v.paymentRef,type:'Thu bổ sung · '+workflowNames[r.kind],amount:r.plan.charge,requestId:r.id,status:'Đã xác minh'});r.stage='ready';policyLog(o,'Đã nhận '+money(r.plan.charge)+' · '+v.paymentRef);return openRequest(r.id);
    }
    if(action==='policy-execute'){
      if(!customer()&&!requireRole('cs'))return;
      if(customer()&&!canSelf(o,r.kind))return error('Nghiệp vụ này do CS thực hiện.');
      if(!['ready','unknown'].includes(r.stage)||r.applied)return error('Yêu cầu đã xử lý hoặc chưa đủ điều kiện.');
      if(r.plan.charge&&!r.paid)return error('Chưa xác minh tiền thực nhận.');
      if(v.outcome==='waiting'){r.stage='unknown';r.sourceResult={...v};policyLog(o,'Chờ xác minh nguồn: '+v.reference);close();return;}
      if(v.outcome==='failed'){
        if(r.paid)proposeRefund(o,r.plan.charge,'Nguồn không cung cấp phần đã thu bổ sung',{requestId:r.id,basis:v.reference,scope:workflowNames[r.kind]});
        r.stage='rejected';r.result='Nguồn xác nhận không thực hiện được. Giữ dịch vụ cũ. '+(r.paid?'Đã tạo hồ sơ hoàn khoản thu bổ sung.':'');policyLog(o,r.result);close();return;
      }
      if(v.outcome==='partial'){
        if(!['services','additional'].includes(r.kind)||!validAmounts(v,['partialAmount'])||numeric(v.partialAmount)<=0||numeric(v.partialAmount)>=r.plan.charge||!needText(v.partialDetail)||!needText(v.partialConsent))return error('Nhập đúng giá trị phần được nhận (nhỏ hơn tổng đã thu), nội dung và đồng ý khách.');
        if(r.kind==='additional'&&(!Number.isInteger(numeric(v.partialRooms))||numeric(v.partialRooms)<1||numeric(v.partialRooms)>r.plan.rooms||v.partialEnd>r.plan.end||v.partialEnd<=r.plan.start))return error('Kiểm tra phòng / đêm đặt thêm thực tế được xác nhận.');
        r.originalPlan=structuredClone(r.plan);r.plan.charge=numeric(v.partialAmount);r.plan.detail=v.partialDetail;r.plan.description=v.partialDetail;
        if(r.kind==='additional'){r.plan.rooms=numeric(v.partialRooms);r.plan.end=v.partialEnd;}
        r.partial={amount:numeric(v.partialAmount),detail:v.partialDetail,consent:v.partialConsent};
        proposeRefund(o,r.originalPlan.charge-r.plan.charge,'Hoàn phần bổ sung không cung cấp được',{requestId:r.id,basis:v.reference,scope:v.partialDetail});
      }
      executeConfirmed(o,r,v);close();return;
    }
    if(action==='policy-simple'){
      if(!requireRole('cs'))return;
      if(panel.kind==='reconfirm'){o.reconfirm={code:v.code,person:v.person,at:stamp(),by:state.currentUser};policyLog(o,'Reconfirm không bắt buộc: '+v.code+' · '+v.person);}
      else policyLog(o,'Ghi chú nội bộ: '+v.note);close();return;
    }
    if(action==='policy-amend'){
      if(!customer()&&!requireRole('cs'))return;
      r.proposedName=v.newName;r.sourceBasis=v.basis;
      if(r.kind==='rename'){
        if(v.sync==='confirmed'){const before=o.name;o.name=v.newName;markDone(o,r,'Đổi tên đại diện '+before+' → '+o.name+'; KS xác nhận '+v.basis+'. Thông tin người mua hóa đơn giữ nguyên.');}
        else {r.stage='supplier';policyLog(o,'Yêu cầu tên '+v.newName+' chưa được NCC xác nhận: '+v.basis);}
      }else{
        (o.chat||=[]).push({at:stamp(),request:v.note,reply:v.basis});o.special=v.note;
        if(v.sync==='confirmed')markDone(o,r,'KS xác nhận yêu cầu: '+v.note+' · '+v.basis);else {r.stage=v.sync==='refused'?'rejected':'supplier';r.result=v.basis;policyLog(o,'Chat với KS: '+v.note+' · '+v.basis);}
      }close();return;
    }
    if(action==='policy-incident'){
      if(!requireRole('cs'))return;
      const event={type:v.incidentType,detail:v.detail,basis:v.basis,status:v.resultType,at:stamp(),by:state.currentUser};o.events.push(event);r.incident=event;
      if(v.resultType==='waiting'){r.stage='supplier';policyLog(o,'Sự cố đang theo dõi: '+v.detail);close();return;}
      markDone(o,r,'Sự cố '+v.incidentType+': '+v.detail+' · '+v.basis);
      if(['over','reduce','cancel'].includes(v.resultType)){const n=request(o,v.resultType,{policy:true,exception:true,note:'Từ sự cố '+v.incidentType+': '+v.detail});close();return openRequest(n.id);}
      close();return;
    }
    if(action==='policy-trace')return processTrace(o,r,v);
    if(action==='policy-refund-new'){
      if(!requireRole('cs'))return;
      if(!validAmounts(v,['amount'])||!numeric(v.amount))return error('Nhập số tiền hoàn hợp lệ.');
      const f=proposeRefund(o,numeric(v.amount),v.reason,{scope:v.scope,basis:v.basis,recipient:v.recipient});f.status='submitted';f.submittedAt=stamp();policyLog(o,'CS đề xuất hoàn '+money(f.amount)+' · '+f.id);close();return;
    }
    if(action==='policy-refund-submit'){
      if(!requireRole('cs'))return;const f=o.refunds.find(f=>f.id===panel.refundId);
      if(!f||['done','pending','failed'].includes(f.status))return error('Khoản hoàn không thể sửa ở trạng thái này.');
      if(!validAmounts(v,['amount'])||!numeric(v.amount)||numeric(v.amount)>cashAvailable(o,f.id)||numeric(v.amount)>(f.maxAmount??Infinity))return error('Khoản hoàn vượt phương án nguồn đã chốt, số tiền còn được hoàn hoặc không hợp lệ.');
      if(!needText(v.basis)||!needText(v.recipient))return error('Cần đủ căn cứ và thông tin nhận tiền.');
      Object.assign(f,{amount:numeric(v.amount),recipient:v.recipient,basis:v.basis,reason:v.reason,status:'submitted',submittedAt:stamp()});delete f.approvedSnapshot;delete f.approvedBy;
      policyLog(o,'CS trình duyệt '+f.id+' · '+money(f.amount));close();return;
    }
    if(action==='policy-refund-approve'){
      if(!requireRole('ceo'))return;const f=o.refunds.find(f=>f.id===panel.refundId);if(f?.status!=='submitted')return error('Đề xuất chưa ở trạng thái chờ CEO.');
      f.status=v.decision;f.approvalNote=v.approvalNote;
      if(v.decision==='approved'){f.approvedBy='CEO · '+state.currentUser;f.approvedAt=stamp();f.approvedSnapshot=JSON.stringify([f.amount,f.recipient]);}
      policyLog(o,'CEO '+(v.decision==='approved'?'duyệt':'yêu cầu bổ sung')+' '+f.id+' · '+v.approvalNote);close();return;
    }
    if(action==='policy-refund-pay'){
      if(!requireRole('accounting'))return;const f=o.refunds.find(f=>f.id===panel.refundId);
      if(!f||!['approved','pending','failed'].includes(f.status)||f.approvedSnapshot!==JSON.stringify([f.amount,f.recipient]))return error('Cần CEO duyệt đúng số tiền và người nhận trước khi chi.');
      if(f.status!=='pending'&&o.transactions.some(t=>t.status==='Tranh chấp'))return error('Giao dịch đang có tranh chấp. Kế toán đối chiếu chargeback và kết luận ngân hàng trước khi gửi lệnh hoàn mới để tránh trả hai lần.');
      if(['pending','failed'].includes(f.status)&&!v.consent)return error('Tra soát lệnh cũ trước khi tiếp tục.');
      if(f.status==='pending'&&(v.reference!==f.reference||v.method!==f.method))return error('Lệnh cũ đang xử lý. Ghi nhận kết quả lệnh đó trước, không đổi mã hoặc kênh chi.');
      if(state.orders.some(a=>a.refunds.some(x=>x.id!==f.id&&x.reference===v.reference)))return error('Mã chi đã thuộc khoản hoàn khác.');
      Object.assign(f,{status:v.outcome,reference:v.reference,method:v.method,paidDate:v.paidDate,proof:v.proof,paidBy:'Kế toán · '+state.currentUser});
      policyLog(o,'Kế toán cập nhật '+f.id+' · '+rfLabels[f.status]+' · '+v.reference);close();return;
    }
    if(action==='policy-invoice-request'){
      if(!customer()&&!requireRole('cs'))return;const buyer={company:v.company,tax:v.tax,address:v.address,email:v.email};
      if(v.invoiceChange==='email'&&o.invoiceDocuments.length){o.invoiceBuyer.email=v.email;policyLog(o,'Mô phỏng gửi lại hóa đơn hiện có tới '+v.email+'. Không thay đổi hóa đơn gốc.');}
      else {invoiceJob(o,v.reason,{type:'buyer',buyer,previousBuyer:structuredClone(o.invoiceBuyer)});policyLog(o,'Gửi Kế toán yêu cầu sửa thông tin hóa đơn: '+v.reason);}
      const req=o.requests.find(x=>x.id===panel?.requestId);if(req)markDone(o,req,'Đã chuyển yêu cầu sửa thông tin sang Kế toán.');close();return;
    }
    if(action==='policy-invoice-process'){
      if(!requireRole('accounting'))return;const j=o.invoiceJobs.find(x=>x.id===panel.jobId);if(!j)return;
      if(j.status==='done')return error('Yêu cầu đã có kết quả, không phát hành lặp.');
      if(j.status==='sending'&&!v.consent)return error('Cần tra trạng thái phát hành cũ.');
      if(v.status==='done'&&!['notify','email'].includes(v.operation)&&(!needText(v.number)||!needText(v.file)||!v.date))return error('Cần số, ngày và file chứng từ hợp lệ trước khi báo hoàn tất.');
      if(v.operation==='issue'&&j.originalId&&v.status==='done')return error('Đã có hóa đơn gốc. Kế toán chọn xử lý điều chỉnh / thay thế / thông báo phù hợp, không xuất lặp.');
      if(!validAmounts(v,['amount']))return error('Giá trị chứng từ không hợp lệ.');
      if(v.status==='done'&&['adjust','replace'].includes(v.operation)&&!j.originalId)return error('Chưa có hóa đơn gốc để điều chỉnh / thay thế.');
      if(v.status==='done'&&!['notify','email'].includes(v.operation)){
        if(state.orders.some(a=>a.invoiceDocuments.some(d=>d.number===v.number)))return error('Số hóa đơn / chứng từ đã tồn tại.');
        o.invoiceDocuments.push({id:newId('HD'),number:v.number,date:v.date,amount:numeric(v.amount),file:v.file,originalId:j.originalId,buyer:structuredClone(j.buyer||o.invoiceBuyer),operation:v.operation,status:'issued',demo:true});
      }
      if(v.status==='done'&&j.buyer)o.invoiceBuyer=structuredClone(j.buyer);
      Object.assign(j,{status:v.status,result:v.result,operation:v.operation,processedBy:state.currentUser});policyLog(o,'Kế toán: '+invoiceLabels[j.status]+' · '+v.result);close();return;
    }
    if(action==='policy-compensation'){
      if(!requireRole('cs'))return;if(!validAmounts(v,['amount'])||!numeric(v.amount)||!v.consent)return error('Cần giá trị hợp lệ và đồng ý khách.');
      const c={...v,id:newId('COMP'),amount:numeric(v.amount),status:v.authority==='over'?'approval':'Đã cấp',at:stamp(),by:state.currentUser};o.compensations.push(c);if(v.authority!=='over')issueCompensation(o,c);policyLog(o,'Đền bù riêng '+c.type+' '+c.amount+' · '+c.status);close();return;
    }
    if(action==='policy-comp-approve'){
      if(!requireRole('ceo'))return;const c=o.compensations.find(c=>c.id===panel.compId);if(!c||c.status!=='approval')return error('Không còn khoản chờ duyệt.');c.approvedBy=state.currentUser;c.approval=v.approval;issueCompensation(o,c);policyLog(o,'Duyệt và cấp đền bù '+c.id);close();return;
    }
  }catch(err){error(err.message);}
},true);

function exportPolicy(type){
  const rows=[['Booking','Dịch vụ','Mã yêu cầu','Nội dung','Trạng thái','Số tiền','Căn cứ / kết quả','Người duyệt','Người chi','Booking liên kết']];

}
list=function(){if(!customer()&&state.view!=='bookings')return dashboard(state.view);const base=filteredOrders(),orders=base.filter(o=>matchStatus(o,state.filter)),hotel=state.serviceFilter!=='flight';
 return `<div class="pagehead"><div><div class="eyebrow">Bookese / Quản lý booking</div><h1>${customer()?'Đặt chỗ của tôi':'Danh sách booking'}</h1><p class="muted">Thông tin booking và số tiền còn cần xử lý trên cùng danh sách.</p></div></div><section class="card booking-list-card"><div class="booking-filters">${[['code','Mã booking','VD: BK-3002'],['hotel','Tên khách sạn','Nhập tên khách sạn'],['guest','Tên khách hàng','Tên người đặt / người sử dụng'],['phone','SĐT khách hàng','Nhập số điện thoại']].filter(([k])=>k!=='hotel'||hotel).map(([k,t,p])=>`<div><label for="filter-${k}">${t}</label><input id="filter-${k}" data-filter="${k}" value="${esc(filters[k])}" placeholder="${p}" ${k==='phone'?'inputmode="tel"':''}></div>`).join('')}<div><label for="service-filter">Loại dịch vụ</label><select id="service-filter">${[['all','Tất cả dịch vụ'],['hotel','Khách sạn'],['flight','Vé máy bay']].map(([v,t])=>`<option value="${v}" ${state.serviceFilter===v?'selected':''}>${t}</option>`).join('')}</select></div><div><label for="booking-filter">Trạng thái booking</label><select id="booking-filter"><option value="">Tất cả trạng thái</option>${['Thành công','Thất bại','Đang xử lý','Hủy'].map(t=>`<option ${filters.booking===t?'selected':''}>${t}</option>`).join('')}</select></div><div><label for="user-filter">User xử lý</label><select id="user-filter"><option value="">Tất cả User</option><option value="unassigned" ${filters.user==='unassigned'?'selected':''}>Chưa có User</option>${[...new Set(['Minh Anh','Thu Hà','Hoàng Nam',...state.orders.map(o=>o.assignee).filter(Boolean)])].map(v=>`<option ${filters.user===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div><fieldset class="stay-filter"><legend>${hotel?'Giai đoạn lưu trú':'Ngày bay'}</legend><div><label for="stay-from">Từ ngày</label><input id="stay-from" type="date" value="${esc(filters.stayFrom||'')}"></div><div><label for="stay-to">Đến ngày</label><input id="stay-to" type="date" value="${esc(filters.stayTo||'')}"></div></fieldset><div class="filter-reset">${btn('Xóa bộ lọc','clear-filters')}</div></div>${filters.stayFrom&&filters.stayTo&&filters.stayFrom>filters.stayTo?'<p class="list-error" role="alert">Ngày kết thúc bộ lọc phải bằng hoặc sau ngày bắt đầu.</p>':''}<p class="list-legend"><span class="legend-due">Đỏ: còn tiền cần thu</span><span class="legend-refund">Xanh: còn khoản tiền cần hoàn</span><small>${hotel?'Lọc các booking có đêm lưu trú trong giai đoạn đã chọn.':''}</small></p><div class="tabs" aria-label="Công việc CS">${statusTabs.map(([v,t])=>btn(t+' <span class="count">'+base.filter(o=>matchStatus(o,v)).length+'</span>','filter:'+v,state.filter===v?'active':'')).join('')}</div><div class="table-wrap booking-table-wrap" tabindex="0" aria-label="Danh sách booking, cuộn ngang để xem các cột"><table class="booking-table"><thead><tr><th>Booking / Khách</th><th>Ngày book</th><th>Dịch vụ</th><th>Loại</th><th>${state.serviceFilter==='hotel'?'Ngày lưu trú':state.serviceFilter==='flight'?'Ngày bay':'Ngày lưu trú / bay'}</th><th>Trạng thái booking</th><th>Thành tiền</th><th>User xử lý</th><th>Việc cần xử lý</th><th></th></tr></thead><tbody>${orders.map(o=>{const balance=listBalance(o);return `<tr data-booking-id="${esc(o.id)}" class="${balance.due?'balance-due':balance.refund?'balance-refund':''}"><td>${btn(o.id,'open:'+o.id,'link')}<span>${esc(o.name)}</span>${o.replacedFrom?'<small>Chuyển từ '+esc(o.replacedFrom)+'</small>':''}${o.transferredTo?'<small>Chuyển sang '+esc(o.transferredTo)+'</small>':''}</td><td>${esc(o.created||'Chưa có')}</td><td><b>${esc(o.title)}</b><small>${esc(o.type==='hotel'?o.hotelAddress||'Chưa có địa chỉ':o.airline||'')}</small><small>${esc(o.type==='hotel'?'ĐT: '+(o.hotelPhone||'Chưa có'):o.source+' · PNR '+o.pnr)}</small></td><td>${listRoomType(o)}</td><td>${esc(o.start)}${o.type==='hotel'?'<small>đến '+esc(o.end)+'</small>':''}</td><td>${bookingStatusBadge(o)}</td><td><strong class="money">${money(o.gross)}</strong><small>Đã nhận: ${money(numeric(o.paid)+numeric(o.extraPaid))}</small>${o.voucher||o.coins?'<small>Ưu đãi: '+money(numeric(o.voucher)+numeric(o.coins))+'</small>':''}${balance.due?'<span class="balance-label due">Cần thu thêm '+money(balance.due)+'</span>':''}${balance.refund?'<span class="balance-label refund">Còn hoàn '+money(balance.refund)+'</span>':''}</td><td>${esc(o.assignee||'Chưa có User')}</td><td>${balance.due?'<b>Thu khoản còn thiếu</b>':''}${balance.due&&!openRequests(o).length?'<small>Chưa thu đủ tiền</small>':workSummary(o)}</td><td>${btn('Mở đơn →','open:'+o.id,'link')}</td></tr>`;}).join('')||'<tr><td colspan="10" class="empty">Không có booking phù hợp.</td></tr>'}</tbody></table></div></section>`;
};
render=function(){listRenderBase();for(const [id,key]of [['stay-from','stayFrom'],['stay-to','stayTo']])$('#'+id)?.addEventListener('change',e=>{filters[key]=e.target.value;render();$('#'+id)?.focus();});};
save();render();
</script></body></html>
