</style><body><div id="demo"></div><div id="app"></div><dialog id="dialog"></dialog><div id="toast" role="status"></div><script>/* Bookese CS — editable, local-only prototype. No backend or payment calls. */
const screens={S01:'Danh sách đặt phòng',S02:'Chi tiết đặt phòng',S03:'Thanh toán & tra soát',S04:'Reconfirm với khách sạn',S05:'Yêu cầu hỗ trợ',S06:'Phương án thay thế',S07:'Đổi thông tin booking',S08:'Hủy & xin miễn phí',S09:'Hoàn tiền & xu',S10:'Lịch sử xử lý',S11:'Danh sách vé máy bay',S12:'Chi tiết vé & Hồng Ngọc Hà',S13:'Khách hàng • Lịch sử đặt chỗ',S14:'Khách hàng • Chi tiết booking',S15:'Khách hàng • Hủy miễn phí',S16:'Extranet • Xác nhận booking'};
const money=n=>new Intl.NumberFormat('vi-VN').format(n)+' đ';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seed=()=>({role:'CS',activeBooking:'BK-DEMO-2409',scenario:'success',reconfirm:false,request:null,alternative:null,change:null,cancel:null,refund:null,logs:[],updated:'24/09/2026 10:00',guestConsent:false});
let st;try{st=JSON.parse(localStorage.getItem('bookese-cs-prototype-v1'))||seed()}catch{st=seed()}
let screen=location.hash.slice(1)||'S01';
function save(){localStorage.setItem('bookese-cs-prototype-v1',JSON.stringify(st))}
function log(t){st.logs.unshift({time:new Date().toLocaleString('vi-VN'),actor:st.role,text:t});save()}
function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',4500)}
function go(s){if(location.hash==='#'+s)render();else location.hash=s}
function badge(t,k=''){return `<span class="badge ${k}">${esc(t)}</span>`}
function field(label,id,type='text',value='',hint='',required=false){return `<div class="field"><label for="${id}" class="${required?'required':''}">${label}</label><input id="${id}" name="${id}" type="${type}" value="${esc(value)}" ${required?'required':''}><small>${hint}</small></div>`}
function select(label,id,values,selected){return `<div class="field"><label for="${id}">${label}</label><select id="${id}" name="${id}">${values.map(v=>`<option ${v===selected?'selected':''}>${esc(v)}</option>`).join('')}</select></div>`}
function textfield(label,id,value='',required=false){return `<div class="field full"><label for="${id}" class="${required?'required':''}">${label}</label><textarea id="${id}" name="${id}" ${required?'required':''}>${esc(value)}</textarea></div>`}
function tick(label,id,checked=false){return `<label class="tick"><input id="${id}" name="${id}" type="checkbox" ${checked?'checked':''}> <span>${label}</span></label>`}
function btn(label,action,cls='',disabled=false){return `<button type="button" class="${cls}" data-action="${action}" ${disabled?'disabled':''}>${label}</button>`}
function link(label,s){return `<a href="#${s}">${label}</a>`}
function alert(t,cls=''){return `<div class="alert ${cls}">${t}</div>`}
function card(title,body){return `<section class="card"><h2>${title}</h2>${body}</section>`}
function kv(rows){return `<div class="kv">${rows.map(([a,b])=>`<div>${a}</div><div>${b}</div>`).join('')}</div>`}
function table(head,rows){return `<div class="tablewrap"><table><thead><tr>${head.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function bookingState(){return st.scenario==='failed'?'Thất bại':st.scenario==='success'?'Thành công':'Đang xử lý'}

function applyPaymentSnapshot(key){
 const p=traceState();if(!paymentOutcomes[key])return false;
 // Late results never revive a cancelled/refunded or previously failed booking.
 if((st.cancel||st.refund||(st.scenario==='failed'&&key==='success'))&&key!=='conflict')key='conflict';
 if(st.scenario==='pendingncc'&&['unknown','unsynced','debit'].includes(key))key='conflict';
 if(st.scenario==='success'&&['unknown','unsynced','debit','ncc','failedpaid'].includes(key))key='conflict';
 p.result=key;p.checkedAt=new Date().toLocaleString('vi-VN');st.updated=p.checkedAt;
 if(key==='success')st.scenario='success';
 if(key==='ncc')st.scenario='pendingncc';
 if(key==='failedpaid')st.scenario='failed';
 log('Tra cứu mô phỏng: '+paymentOutcomes[key].label+' · không phát lệnh thu / xuất / hoàn');return true;
}
function bindPaymentActions(){
 actions.retrieve=()=>{const label=document.querySelector('#mock-payment')?.value;const key=Object.keys(paymentOutcomes).find(k=>paymentOutcomes[k].label===label);if(applyPaymentSnapshot(key)){render();toast('Đã có kết quả. Xem mục 2: Việc CS cần làm tiếp.')}};
 submits.trace=v=>{if(!(Number(v['trace-amount'])>0))return toast('Số tiền phải lớn hơn 0.');if(!v['trace-due']||new Date(v['trace-due'])<=new Date())return toast('Chọn thời gian hẹn phản hồi khách trong tương lai.');const p=traceState();if(p.followup)return toast('Đã có trao đổi đang theo dõi. Ghi phản hồi vào bản ghi hiện có.');p.followup={team:v['trace-team'],ref:v['trace-sent'],note:v['trace-note'],due:v['trace-due'],method:v['trace-method'],transaction:v['trace-ref'],amount:Number(v['trace-amount']),time:v['trace-time']};log('CS ghi nhận đã gửi '+p.followup.team+' · '+p.followup.ref+' · hẹn khách '+p.followup.due);render();};
 submits['trace-response']=v=>{const p=traceState();if(!p.followup)return;if(!v['response-from']?.trim()||!v['response-proof']?.trim()||!v['response-note']?.trim())return toast('Cần người trả lời, nội dung và căn cứ.');p.responses=p.responses||[];p.responses.push({from:v['response-from'],proof:v['response-proof'],note:v['response-note'],at:new Date().toLocaleString('vi-VN')});log('Nhận phản hồi '+v['response-from']+' · '+v['response-proof']+'; chờ đối chiếu trạng thái');render();};
 submits['trace-customer']=v=>{const p=traceState();if(!v['customer-message']?.trim())return toast('Nhập nội dung đã báo khách.');if(paymentResult()?.team&&(!v['customer-due']||new Date(v['customer-due'])<=new Date()))return toast('Chọn thời gian cập nhật khách tiếp theo trong tương lai.');p.customer={channel:v['customer-channel'],note:v['customer-message'],due:v['customer-due'],at:new Date().toLocaleString('vi-VN')};if(p.followup&&v['customer-due'])p.followup.due=v['customer-due'];log('Đã báo khách qua '+p.customer.channel+': '+p.customer.note+(p.customer.due?' · hẹn '+p.customer.due:''));render();};
}

 document.querySelector('#app').innerHTML=nav+`<header class="topbar">${cust?'<div class="logo">bookese</div><div>Lưu trú &nbsp;&nbsp;&nbsp; Vé máy bay &nbsp;&nbsp;&nbsp; Trải nghiệm</div>':'<span class="muted">Intranet / Bookese</span>'}<span>Tiếng Việt</span><b>${cust?'Nguyễn An (demo)':esc(st.role)+' · Demo'}</b></header><main><div class="pagehead"><h1>${screens[screen]}</h1><span class="crumb">Bookese / ${screens[screen]}</span></div>${views[screen]()}<footer class="pagefooter">Bản đề xuất 24/09/2026 · ${screen} · Dữ liệu giả lập, lưu cục bộ trên trình duyệt. Không gửi email, thanh toán hoặc thay đổi booking thật.</footer></main>`;if(!['S01','S11','S12'].includes(screen)&&!(screen==='S14'&&st.customerItem==='flight')&&st.activeBooking&&st.activeBooking!=='BK-DEMO-2409'){let markup=document.querySelector('#app').innerHTML;const isB=st.activeBooking==='BK-DEMO-2410';document.querySelector('#app').innerHTML=markup.replaceAll('BK-DEMO-2409',st.activeBooking);}bind();bindOps();if(screen==='S01')listRows();if(screen==='S08')cancelPreview();if(screen==='S07'&&document.querySelector('#change-preview'))changePreview();if(screen==='S15'&&document.querySelector('#cc-preview'))customerPreview();}
function values(form){return Object.fromEntries(new FormData(form).entries())}
function need(id,message){if(!document.getElementById(id)?.checked){toast(message);return false}return true}
function dialog(title,body,confirmText,run){const d=document.querySelector('#dialog');d.innerHTML=`<h2>${title}</h2>${body}<div class="actions"><button id="dialog-back">Quay lại</button>${confirmText?`<button id="dialog-confirm" class="primary">${confirmText}</button>`:''}</div>`;d.querySelector('#dialog-back').onclick=()=>d.close();if(confirmText)d.querySelector('#dialog-confirm').onclick=()=>{d.close();run()};d.showModal()}
function cancelNumbers(){let share=document.querySelector('#cancel-share').value.startsWith('100')?1:.5;let rule=document.querySelector('#cancel-rule').value;let factor=rule.includes('toàn bộ')||rule.includes('trong hạn')?0:rule.includes('50%')?.5:1;let fees=(Number(document.querySelector('#cancel-nccfee').value)+Number(document.querySelector('#cancel-bkfee').value))*factor;return {share,fees,rule,cash:4200000*share-fees,spent:200000*share}}
function cancelPreview(){const c=cancelNumbers();document.querySelector('#cancel-preview').innerHTML=`<b>Khách sạn: phí NCC + phí Bookese cùng tỷ lệ hỗ trợ</b><p>Phí giữ lại: ${money(c.fees)} · Tiền hoàn: <b>${money(Math.max(0,c.cash))}</b> · Xu đã dùng trả lại: <b>${c.spent.toLocaleString('vi-VN')} xu</b></p><small>Hạn khách gửi: 27/09 12:00. Hạn NCC: 27/09 14:00. Báo trước +2 giờ để có thời gian xử lý.</small>`}
function changePreview(){let p=Number(document.querySelector('#change-price').value);document.querySelector('#change-preview').innerHTML=`<p>Chênh lệch dịch vụ: <b>${money(p-4400000)}</b> ${p>4400000?'— cần thu bổ sung trước khi đổi':p<4400000?'— kiểm tra điều kiện hoàn chênh lệch':'— không phát sinh thêm tiền'}</p>`}
function customerPreview(){let share=document.querySelector('#cc-scope').selectedIndex===0?1:.5;document.querySelector('#cc-preview').innerHTML=`<p><b>Mô phỏng yêu cầu còn hạn miễn phí:</b> phí hủy 0 đ</p><p>Tiền hoàn dự kiến: ${money(4200000*share)} · Xu dùng trả lại: ${(200000*share).toLocaleString('vi-VN')} xu</p><p>Xu thưởng đang chờ hủy: ${(84000*share).toLocaleString('vi-VN')} xu. Kết quả cuối cùng được cập nhật sau khi NCC xác nhận.</p>`}
function bind(){document.querySelector('#screen-picker').onchange=e=>go(e.target.value);document.querySelector('#role-picker').onchange=e=>{st.role=e.target.value;save();render()};document.querySelector('#scenario-picker').onchange=e=>{st=Object.assign(seed(),{role:st.role,scenario:e.target.value});save();render()};document.querySelectorAll('[data-action]').forEach(e=>e.onclick=()=>actions[e.dataset.action]?.());document.querySelectorAll('form').forEach(f=>f.onsubmit=e=>{e.preventDefault();submits[f.id]?.(values(f))});document.querySelector('#app').onclick=e=>{const b=e.target.closest('[data-openbooking]');if(b){const id=b.dataset.openbooking;if(id!==(st.activeBooking||'BK-DEMO-2409')){st=Object.assign(seed(),{role:st.role,activeBooking:id,scenario:id==='BK-DEMO-2410'?'pendingpay':id==='BK-DEMO-2411'?'failed':'success'});}save();go('S02')}};['cancel-share','cancel-rule','cancel-nccfee','cancel-bkfee'].forEach(id=>{if(document.getElementById(id))document.getElementById(id).oninput=cancelPreview});if(document.querySelector('#change-price'))document.querySelector('#change-price').oninput=changePreview;if(document.querySelector('#cc-scope'))document.querySelector('#cc-scope').onchange=customerPreview;if(document.querySelector('#flight-search'))document.querySelector('#flight-search').oninput=e=>{document.querySelector('#flight-results').style.display='FL-DEMO-0001 DEMO26 NGUYEN AN'.toLowerCase().includes(e.target.value.toLowerCase())?'':'none'}}

on ${st.role!==owner?'disabled':''}>Lưu phản hồi NCC</button></form>`)+card('2. CS chốt lựa chọn với khách',v.options.length?table(['Phương án','Chi phí / hiệu lực','Kết quả khách','Thao tác'],v.options.map((x,i)=>[esc(x.hotel)+'<small>'+esc(x.scope)+' · '+esc(x.note)+'</small>',money(x.cost)+' · '+esc(x.payer)+'<small>'+esc(x.until.replace('T',' '))+'</small>',esc(x.customer||'Chưa hỏi khách'),`${btn('Khách đồng ý','over-accept-'+i,'primary',st.role!=='CS'||!!v.closed)} ${btn('Khách từ chối','over-reject-'+i,'',st.role!=='CS'||!!v.closed)}`])):'<p>Chờ đầu mối NCC cập nhật phương án. CS chủ động hẹn cập nhật khách.</p>')+card('3. Xác nhận thực hiện và ổn định chỗ ở',`<p>Phương án chọn: <b>${esc(v.options[v.selected]?.hotel||'Chưa chốt')}</b></p>${v.selected!=null&&v.options[v.selected]?.payer.startsWith('Bookese')?btn(v.approved?'Khoản chi đã duyệt':'Duyệt khoản Bookese chi','over-approve','',st.role!=='Trưởng CS'||v.approved):''}<form id="over-execute">${field('Mã xác nhận phòng thay từ NCC','over-confirm-ref','text',v.confirmRef||'','',true)}${textfield('Hướng dẫn nhận phòng / liên hệ tại KS','over-instruction',v.instruction||'',true)}<button class="primary" ${st.role!==owner||v.selected==null||v.closed?'disabled':''}>Lưu NCC xác nhận thực hiện</button></form><form id="over-arrived">${textfield('CS xác nhận khách đã có phòng / kết quả thực tế','over-arrived-proof','',true)}<button class="primary" ${st.role!=='CS'||!v.confirmRef||v.closed?'disabled':''}>Xác nhận khách ổn định → bàn giao PS</button></form>${v.closed?alert('Khách đã có phòng. PS tiếp tục khoản NCC chịu và bàn giao Kế toán đối soát; không giữ ca khách chỉ vì công nợ chưa xong.','info'):''}${link('PS theo dõi chi phí / công nợ →','S17')}<p>${link('Khách chọn hoàn thay vì phòng thay → kiểm tra miễn phí tại màn Hủy','S08')}</p>`)+card('Trao đổi trong ca',table(['Thời điểm','Người cập nhật','Nội dung'],v.events.map(x=>[esc(x.at),esc(x.by),esc(x.note)])));}
function overEvent(note){const v=ops().over;if(v)v.events.unshift({at:stamp(),by:st.role,note});log(note);}
function createHold(v){if(!allowed(['CS']))return false;const o=ops();if(o.exchange)return false;if(st.scenario!=='success'||st.cancel){toast('Chỉ đổi booking thành công còn hiệu lực.');return false;}if(v['exchange-in']>=v['exchange-out']||Number(v['exchange-price'])<=0||!Number.isInteger(Number(v['exchange-rooms']))||Number(v['exchange-rooms'])<1){toast('Kiểm tra ngày, giá và số phòng.');return false;}const until=new Date(v['exchange-until']);if(until<=new Date()||until>new Date('2026-09-27T12:00:00+07:00')){toast('Giữ chỗ phải còn hạn và không vượt hạn hủy miễn phí booking cũ.');return false;}if(!v['exchange-free']||!v['exchange-consent']){toast('Cần căn cứ miễn hủy và khách đồng ý phương án.');return false;}const price=Number(v['exchange-price']);o.exchange={id:'CHANGE-DEMO-001',newId:'BK-NEW-DEMO-001',from:v['exchange-in'],to:v['exchange-out'],rooms:Number(v['exchange-rooms']),price,delta:price-4400000,until:v['exchange-until'],proof:v['exchange-proof'],oldStatus:'Đang giữ nguyên',payment:price>4400000?'Chưa thu':'Không cần thu thêm',status:'Đã giữ chỗ · chờ thanh toán',done:false};integration('Giữ chỗ booking mới',o.exchange.newId+' · chưa xuất; cấn tiền/xu gốc, thu thêm '+money(Math.max(0,o.exchange.delta)));return true;}
function processExchangePayment(result,method){const e=ops().exchange;if(!e||e.done||e.payment==='Đã thu'||e.delta<=0)return false;e.method=method;if(result==='Tiền về sau khi hold hết hạn'){e.expired=true;e.payment='Đã thu';e.exception='Tiền bổ sung về sau hold hết hạn. Không tự hủy đơn cũ hoặc xuất mới. Kế toán đối chiếu khoản bổ sung; CS xác nhận phương án tiếp với khách.';e.status='Tiền về muộn · cần xử lý';}else if(!holdValid(e)){toast('Hold hết hạn. Không tạo giao dịch mới trên link cũ.');return false;}else {e.payment=result==='Thành công'?'Đã thu':result==='Thất bại'?'Thất bại':'Đang xử lý';e.status=e.payment==='Đã thu'?'Đã thu bổ sung · CS hủy cũ rồi xuất mới':'Chờ xác minh thanh toán';}integration('Thanh toán bổ sung '+e.id,method+' · '+money(e.delta)+' · '+e.payment);return true;}
function cancelExchangeOld(result){const e=ops().exchange;if(!allowed(['CS'])||!holdValid(e)||e.done||e.oldStatus==='Đã hủy'||e.delta>0&&e.payment!=='Đã thu')return false;e.cancelRef='CANCEL-CHANGE-DEMO-001';e.oldStatus=result==='Thành công'?'Đã hủy':result==='NCC từ chối'?'NCC từ chối hủy':'Đang đối chiếu kết quả hủy';e.status=e.oldStatus==='Đã hủy'?'Đã hủy cũ · chờ CS xuất mới':'Chưa đủ điều kiện xuất mới';e.exception=result==='Thành công'?null:'Chưa hủy được booking cũ. Tra cứu cùng mã lệnh; không xuất đơn mới hoặc gửi hủy lặp.';integration('Hủy cũ để đổi',e.cancelRef,e.oldStatus);return true;}
function issueExchangeNew(result){const e=ops().exchange;if(!allowed(['CS'])||!holdValid(e)||e.oldStatus!=='Đã hủy'||e.done||e.delta>0&&e.payment!=='Đã thu')return false;e.issueRef='ISSUE-CHANGE-DEMO-001';e.done=result==='Thành công';e.status=e.done?'Đổi thành công':result==='NCC từ chối'?'Xuất mới thất bại · cần xử lý ngay':'Đang đối chiếu kết quả xuất';e.exception=e.done?null:'Đơn cũ đã hủy. CS ưu tiên xác minh chỗ mới / phương án thay, không báo khách đã có phòng và không gửi lệnh xuất trùng. Khoản tiền phải được đối soát riêng.';if(e.done){e.coinState='Cấn xu gốc, hủy thưởng chờ cũ, tạo thưởng chờ mới';st.reconfirm=false;}integration('Xuất mới',e.newId+' · '+e.issueRef,e.status);return true;}

 actions['exchange-issue']=()=>{issueExchangeNew(document.querySelector('#exchange-issue-mock').value);render();};
 actions['exchange-expire']=()=>{const e=ops().exchange;if(!e||e.done)return;e.expired=true;e.status='Hold hết hạn · cần báo giá lại';e.exception=e.oldStatus==='Đã hủy'?'Đơn cũ đã hủy, hold mới hết hạn. CS xử lý khẩn phương án thay và tiền.':'Giữ nguyên booking cũ. Không thanh toán hoặc xuất mới bằng hold hết hạn.';log(e.status);render();};
 const originalSupport=submits.support;
 submits.support=v=>{if(!allowed(['CS']))return;originalSupport(v);if(v['req-type'].startsWith('Overbooking')){if(!ops().over)ops().over={need:v['req-note'],urgent:v['req-urgent'].startsWith('Gấp'),detected:v['req-time'],status:'Cần xác minh NCC / tìm phương án',options:[],selected:null,events:[]};overEvent('CS ghi nhận overbooking; đầu mối NCC: '+overOwner());go('S06');}};
 submits['over-option']=v=>{const o=ops().over;if(!o||o.closed||!allowed([overOwner(o)]))return;if(new Date(v['over-until'])<=new Date()||Number(v['over-cost'])<0)return toast('Phương án phải còn hạn và chi phí hợp lệ.');o.support=v['over-support'];o.options.push({hotel:v['over-hotel'],scope:v['over-scope'],cost:Number(v['over-cost']),payer:v['over-payer'],until:v['over-until'],proof:v['over-proof'],note:v['over-note']});o.status='Có phương án · chờ CS chốt khách';overEvent('Đã cập nhật phương án '+v['over-hotel']+' · '+v['over-support']);render();};
 submits['over-response']=v=>{if(!ops().over||!allowed([overOwner()]))return;ops().over.support=v['over-response-status'];overEvent(v['over-response-status']+': '+v['over-response-note']);render();};
 actions['over-approve']=()=>{if(!allowed(['Trưởng CS']))return;ops().over.approved=true;overEvent('Duyệt khoản Bookese chi cho phương án đã chọn');render();};
 submits['over-execute']=v=>{const o=ops().over;if(!o||!allowed([overOwner(o)]))return;const x=o.options[o.selected];if(!x||new Date(x.until)<=new Date())return toast('Cần khách chọn phương án còn hiệu lực.');if(x.payer.startsWith('Bookese')&&!o.approved)return toast('Cần duyệt khoản Bookese chi.');o.confirmRef=v['over-confirm-ref'];o.instruction=v['over-instruction'];o.status='NCC xác nhận · CS theo dõi khách nhận phòng';integration('Phòng thay overbooking',o.confirmRef+' · '+x.hotel);overEvent(o.status);render();};
 submits['over-arrived']=v=>{const o=ops().over;if(!o||!allowed(['CS'])||!o.confirmRef||o.closed)return;o.closed=true;o.status='Khách đã có phòng · bàn giao PS';overEvent(v['over-arrived-proof']+' · '+o.status);render();};
 submits['ps-settlement']=v=>{if(!allowed(['PS']))return;const amount=Number(v['ps-recovery']);if(amount<0)return toast('Số tiền không hợp lệ.');ops().settlement={amount,proof:v['ps-proof'],due:v['ps-due'],note:v['ps-note'],received:false};log('PS chuyển khoản NCC chịu cho Kế toán đối soát');render();};
 submits['account-recovery']=v=>{if(!allowed(['Kế toán'])||!ops().settlement||ops().settlement.received)return;ops().settlement.received=true;ops().settlement.receipt=v['account-recovery-proof'];log('Kế toán đối soát công nợ NCC '+v['account-recovery-proof']);render();};
 submits['ex-special']=v=>{ops().specialConfirmed=true;ops().specialReply=v['ex-special-reply'];integration('Khách sạn phản hồi yêu cầu đặc biệt',v['ex-special-reply']);render();};
}
function bindOps(){
 const o=ops();o.over?.options.forEach((x,i)=>{const accept=document.querySelector(`[data-action="over-accept-${i}"]`),reject=document.querySelector(`[data-action="over-reject-${i}"]`);if(accept)accept.onclick=()=>{if(!allowed(['CS'])||o.over.closed)return;if(new Date(x.until)<=new Date())return toast('Phương án hết hạn, cần NCC giữ lại.');o.over.selected=i;o.over.approved=false;o.over.confirmRef=null;x.customer='Khách đồng ý';o.over.status='Khách đã chọn · chờ NCC xác nhận thực hiện';overEvent('CS ghi khách đồng ý '+x.hotel);render();};if(reject)reject.onclick=()=>{if(!allowed(['CS'])||o.over.closed)return;x.customer='Khách từ chối';if(o.over.selected===i){o.over.selected=null;o.over.confirmRef=null;o.over.approved=false;}o.over.status='Khách từ chối · tiếp tục tìm phương án';overEvent(o.over.status);render();};});
 for(const id of ['self-cancel-policy','self-cancel-scope']){const el=document.getElementById(id);if(el)el.onchange=()=>{const c=document.getElementById('self-cancel-consent');if(c)c.checked=false;renderSelfCancelQuote();};}renderSelfCancelQuote();
}

function hotelSource(){return st.hotelSource||'Extranet';}
function reconfirmText(){return hotelSource()==='API'?'Không áp dụng Extranet':st.reconfirm?.note||'—';}
function reconfirmSimple(){return bookingHeader()+card('Xác nhận lại · không bắt buộc',`<p>Khuyến khích kiểm tra để phát hiện vấn đề sớm. Để trống không ảnh hưởng trạng thái hoặc thao tác booking.</p><details><summary>Nguồn khách sạn — dữ liệu mô phỏng</summary>${select('Nguồn khách sạn','hotel-source',['Extranet','API'],hotelSource())}</details>${hotelSource()==='Extranet'?`<p>Khách sạn có thể nhập nội dung bất kỳ vào cột <b>Xác nhận lại</b> trong danh sách đặt phòng. Nội dung hiện tại: <b>${esc(reconfirmText())}</b>.</p>${link('Xem danh sách đặt phòng của KS','S16')}`:'<p>Khách sạn qua API không có cột xác nhận lại Extranet. CS được khuyến khích gọi/email kiểm tra với khách sạn khi phù hợp.</p>'}<form id="cs-check-note">${textfield('Ghi chú liên hệ khách sạn (tùy chọn)','cs-check-note-text',st.csCheckNote||'')}<button>Lưu ghi chú</button></form><p>${link('Phát hiện vấn đề → ghi nhận hỗ trợ','S05')}</p>`);}
function extranetSimple(){if(hotelSource()==='API')return card('Booking qua API',`<p>Khách sạn này không sử dụng Extranet để xác nhận lại. CS có thể liên hệ khách sạn khi cần.</p>${link('Về chi tiết booking','S02')}`);return card('Quản lý đặt phòng · Khách sạn Biển Xanh',`<p>Xác nhận lại là nội dung tùy chọn. Có thể nhập bất kỳ nội dung nào hoặc để trống.</p>${table(['Mã đặt phòng','Người lưu trú','Ngày nhận / trả','Phòng','Xác nhận lại','Tình trạng'],[[esc(st.activeBooking||'BK-DEMO-2409'),esc(ops().guest),'28–30/09/2026','2 Deluxe',`<form id="ex-reconfirm-note">${field('Xác nhận lại','ex-note-value','text',st.reconfirm?.note||'','Không bắt buộc')}<button>Lưu</button></form>`,esc(st.cancel?.status||bookingState())]])}`)+card('Thông tin booking đã cập nhật',kv([['Người lưu trú',esc(ops().guest)],['Yêu cầu đặc biệt',esc(ops().special||'Chưa có')]])+(ops().special?`<form id="ex-special">${textfield('Khách sạn phản hồi yêu cầu đặc biệt','ex-special-reply',ops().specialReply||'')}<button>Gửi phản hồi</button></form>`:'')+syncTable());}
function hotelContact(){return card('Liên hệ khách sạn & tài khoản đặt',`<div class="grid"><div><b>Khách sạn Biển Xanh</b><p>Điện thoại: <a href="tel:+842360000000">0236 000 0000</a><br>Email: <a href="mailto:hotel-demo@example.com">hotel-demo@example.com</a></p><small>Dữ liệu liên hệ minh họa · Nguồn ${hotelSource()}</small></div><div><b>Tài khoản đặt: Nguyễn An</b><p>an.demo@example.com · 090•••0123</p>${link('Xem tài khoản khách →','S21')}<p><a href="#S14" data-action="view-booking-customer">Xem đơn ở giao diện khách →</a></p><small>Tài khoản đặt và người lưu trú là hai thông tin riêng.</small></div></div>`);}
function accountView(){return card('Tài khoản khách · USER-DEMO-001 (dữ liệu mẫu)',kv([['Chủ tài khoản','Nguyễn An'],['Email','an.demo@example.com'],['Điện thoại','090•••0123'],['Người lưu trú trên đơn đang xem',esc(ops().guest)]])+`<div class="actions"><a href="#S14" data-action="view-booking-customer">Xem đơn ở giao diện khách</a>${link('Lịch sử đặt chỗ của khách','S13')}${walletLink(false)}</div>`)+card('Đơn của tài khoản',table(['Mã','Dịch vụ','Kết quả','Mở'],[[esc(st.activeBooking||'BK-DEMO-2409'),'Khách sạn Biển Xanh',bookingState(),link('Chi tiết Intranet','S02')],['FL-DEMO-0001','SGN → HAN','Thành công',link('Chi tiết vé','S12')]]));}
function bookingWork(s){const out=[];const o=s.ops||{};
 if(s.scenario==='pendingpay')out.push({group:'Thanh toán',label:'Cần tra soát thanh toán',to:'S03'});
 if(s.scenario==='pendingncc')out.push({group:'Yêu cầu cần xử lý',label:'Chờ kết quả NCC',to:'S03'});
 if(o.changeRequest&&!o.exchange)out.push({group:'Yêu cầu cần xử lý',label:'Khách yêu cầu '+o.changeRequest.type,to:'S07'});
 if(o.exchange)out.push({group:'Thay đổi',label:o.exchange.status,to:'S07'});
 if(s.cancel)out.push({group:'Hủy',label:s.cancel.status+(s.cancel.share<1?' một phần':''),to:s.cancel.status==='Đã hủy'?'S09':'S08'});
 if(s.refund)out.push({group:'Hoàn',label:s.refund.status+' · xu '+(s.refund.coins?'đã xử lý':'chưa xong'),to:'S09'});
 else if(s.cancel?.status==='Đã hủy'||s.scenario==='failed')out.push({group:'Hoàn',label:'Chờ xử lý hoàn tiền / xu',to:'S09'});
 if(o.over&&!o.over.closed)out.push({group:'Yêu cầu cần xử lý',label:'Overbooking · '+o.over.status,to:'S06'});
 if(s.request&&!s.request.closed&&!o.over)out.push({group:'Yêu cầu cần xử lý',label:'Khách cần hỗ trợ',to:'S05'});
 if(o.special&&!o.specialConfirmed)out.push({group:'Yêu cầu cần xử lý',label:'Yêu cầu đặc biệt · chờ KS phản hồi',to:'S04'});
 if(o.invoice&&o.invoice.status!=='Đã xuất')out.push({group:'Hóa đơn',label:o.invoice.status,to:'S18'});
 if((s.customerUpdateVersion||0)>(s.customerSeenVersion||0))out.push({group:'Khách vừa cập nhật',label:s.customerUpdateLabel||'Có thông tin mới từ khách',to:'S02'});
 return out;
}
function currentBookingData(){const o=ops(),e=o.exchange?.done?o.exchange:null;return {guest:o.guest,special:o.special||'Chưa có',from:e?.from||'2026-09-28',to:e?.to||'2026-09-30',rooms:e?.rooms||2,invoice:o.invoice};}
function liveBookingFields(html){const d=currentBookingData();html=html.replace('<b>Nguyễn An</b><span>090•••0123 · an.demo@example.com</span>',`<b>${esc(d.guest)}</b><span>Người lưu trú · Liên hệ đặt: 090•••0123 / an.demo@example.com</span>`).replace('<span>Tầng cao</span>',`<span>${esc(d.special)}</span>`);return html;}
let bookingCache;try{bookingCache=JSON.parse(localStorage.getItem('bookese-booking-cache-v2'))||{}}catch{bookingCache={}}
function storeBooking(){bookingCache[st.activeBooking||'BK-DEMO-2409']=JSON.parse(JSON.stringify(st));localStorage.setItem('bookese-booking-cache-v2',JSON.stringify(bookingCache));}
function openStoredBooking(id,to='S02'){storeBooking();const role=st.role;st=bookingCache[id]?JSON.parse(JSON.stringify(bookingCache[id])):Object.assign(seed(),{activeBooking:id,scenario:id==='BK-DEMO-2410'?'pendingpay':id==='BK-DEMO-2411'?'failed':'success'});st.role=role;save();go(to);}
function listRecords(){const current=st.activeBooking||'BK-DEMO-2409';return ['BK-DEMO-2409','BK-DEMO-2410','BK-DEMO-2411'].map(id=>({id,state:id===current?st:bookingCache[id]||Object.assign(seed(),{activeBooking:id,scenario:id==='BK-DEMO-2410'?'pendingpay':id==='BK-DEMO-2411'?'failed':'success'})}));}
function listV2(){const records=listRecords();const cats=['Tất cả','Yêu cầu cần xử lý','Khách vừa cập nhật','Thanh toán','Hủy','Hoàn','Thay đổi','Hóa đơn'];return card('Danh sách đặt phòng',`<p>Kết quả đặt giữ 3 trạng thái. Hủy, hoàn, thay đổi và yêu cầu khách được theo dõi riêng trong cột <b>Việc đang xử lý</b>.</p><form id="booking-search"><div class="filter">${field('Mã booking / tên / email','booking-q','search',st.listQuery||'')}${select('Kết quả đặt','booking-result',['Tất cả','Thành công','Đang xử lý','Thất bại'],st.listResult||'Tất cả')}${select('Nhóm việc','booking-work',cats,st.listWork||'Tất cả')}</div><button class="primary">Tìm kiếm</button></form><nav class="tabs">${cats.map((x,i)=>`<a href="#S01" data-action="work-filter-${i}" class="${(st.listWork||'Tất cả')===x?'active':''}">${x} (${x==='Tất cả'?records.length:records.filter(r=>bookingWork(r.state).some(t=>t.group===x)).length})</a>`).join('')}</nav><div id="results"></div><p class="note">Đếm theo booking, không phải số yêu cầu. “Đã xem cập nhật” không đóng yêu cầu hoặc đánh dấu đã hoàn.</p>`);}
function listRowsV2(){const query=(st.listQuery||'').toLowerCase(),result=st.listResult||'Tất cả',category=st.listWork||'Tất cả';const records=listRecords().filter(r=>{const resultText=r.state.scenario==='success'?'Thành công':r.state.scenario==='failed'?'Thất bại':'Đang xử lý';return (r.id+' '+(r.state.ops?.guest||(r.id==='BK-DEMO-2410'?'Trần Bình':r.id==='BK-DEMO-2411'?'Lê Chi':'Nguyễn An'))+' an.demo@example.com').toLowerCase().includes(query)&&(result==='Tất cả'||resultText===result)&&(category==='Tất cả'||bookingWork(r.state).some(x=>x.group===category));});document.querySelector('#results').innerHTML=records.length?table(['Booking / người lưu trú','Kết quả đặt','Việc đang xử lý','Cập nhật khách','Mở'],records.map(r=>{const w=bookingWork(r.state),result=r.state.scenario==='success'?'Thành công':r.state.scenario==='failed'?'Thất bại':'Đang xử lý';return [esc(r.id)+'<small>'+esc(r.state.ops?.guest||(r.id==='BK-DEMO-2410'?'Trần Bình':r.id==='BK-DEMO-2411'?'Lê Chi':'Nguyễn An'))+'</small>',badge(result,result==='Thành công'?'good':'warn'),w.filter(x=>x.group!=='Khách vừa cập nhật').map(x=>`<div><button class="link" data-work-booking="${r.id}" data-work-screen="${x.to}">${esc(x.label)} →</button></div>`).join('')||'Không có việc chờ xử lý',w.some(x=>x.group==='Khách vừa cập nhật')?badge('Mới · '+(r.state.customerUpdateLabel||'Khách vừa cập nhật'),'warn'):'—',`<button class="link" data-work-booking="${r.id}" data-work-screen="S02">Xem chi tiết</button>`];})):'<div class="empty">Không có booking phù hợp bộ lọc.</div>';bindClarityList();}
function bindClarityList(){document.querySelectorAll('[data-work-booking]').forEach(el=>el.onclick=()=>openStoredBooking(el.dataset.workBooking,el.dataset.workScreen));}

 submits['ex-reconfirm-note']=v=>{st.reconfirm={note:v['ex-note-value']||'',source:'Extranet',time:stamp()};log('KS cập nhật nội dung xác nhận lại tùy chọn');render();};

 submits['booking-search']=v=>{st.listQuery=v['booking-q'];st.listResult=v['booking-result'];st.listWork=v['booking-work'];save();render();};
 ['Tất cả','Yêu cầu cần xử lý','Khách vừa cập nhật','Thanh toán','Hủy','Hoàn','Thay đổi','Hóa đơn'].forEach((x,i)=>actions['work-filter-'+i]=()=>{st.listWork=x;save();render();});
 actions['view-booking-customer']=()=>{st.customerItem='hotel';save();go('S14');};
 actions['customer-seen']=()=>{st.customerSeenVersion=st.customerUpdateVersion;save();render();};

 const oldInvoice=invoiceCard;invoiceCard=()=>screen==='S12'||!ops().invoice?oldInvoice():card('Thông tin hóa đơn',kv([['Tên / MST',esc(ops().invoice.name)+' / '+esc(ops().invoice.tax||'—')],['Địa chỉ',esc(ops().invoice.address)],['Email',esc(ops().invoice.email)],['Trạng thái',esc(ops().invoice.status)]]));
 const oldBind=bindOps;bindOps=()=>{oldBind();const el=document.getElementById('hotel-source');if(el)el.onchange=()=>{st.hotelSource=el.value;save();render();};bindClarityList();};
}
