 a.requests=[{id:'YC-101',kind:'change',stage:'new',note:'Khách muốn dời sang 15–17/10, giữ 2 phòng.',origin:'Khách hàng',at:stamp()}];
 b.requests=[{id:'YC-102',kind:'refund',stage:'new',note:'Khách cần hủy chuyến đi; xin kiểm tra điều kiện hoàn.',origin:'Khách hàng',at:stamp()}];

// Work queues are independent of the service booking result and never overlap.
function hasPendingWork(o){return o.booking==='Đang xử lý'||openRequests(o).length>0||(o.refunds||[]).some(r=>r.status!=='done');}
function workQueue(o){

function ensureSystemTasks(o){

 o.requests.unshift({id:'YC-AUTO-'+o.id,kind:'payment',stage:'new',origin:'Hệ thống',at:stamp(),note:o.payment==='Đã thu'?'Booking thất bại nhưng đã thu tiền. Tra soát và thống nhất đặt lại hoặc xử lý khoản hoàn.':'Booking thất bại, thanh toán chưa rõ kết quả. Kiểm tra giao dịch trước khi quyết định hoàn hoặc đặt lại.'});

}

function bookingInfo(o){if(o.type==='hotel')return card('Thông tin lưu trú',`<div class="trip"><b>${esc(o.title)}</b><p>${esc(o.room)}</p><div class="route"><div><small>Nhận phòng</small><b>${o.start.slice(8)}/${o.start.slice(5,7)}</b><small>Từ 14:00</small></div><div class="path">${Math.max(1,Math.round((new Date(o.end)-new Date(o.start))/86400000))} đêm</div><div><small>Trả phòng</small><b>${o.end.slice(8)}/${o.end.slice(5,7)}</b><small>Trước 12:00</small></div></div></div>${kv('Người nhận phòng','<b>'+esc(o.name)+'</b>')}${kv('Yêu cầu đặc biệt',esc(o.special||'Chưa có'))}${o.reconfirm?kv('Code xác nhận KS',esc(o.reconfirm.code||'Chưa nhập'))+kv('Người xác nhận',esc(o.reconfirm.person||'Chưa nhập')):o.source==='Extranet'?kv('Xác nhận lại',esc(o.reconfirmed||'Chưa có ghi chú')+' <small>· Không bắt buộc</small>'):''}${o.replacedFrom?kv('Thay thế booking',btn(o.replacedFrom,'open:'+o.replacedFrom,'link')):''}${o.parentBooking?kv('Đặt thêm từ booking',btn(o.parentBooking,'open:'+o.parentBooking,'link')):''}${(o.linkedBookings||[]).map(x=>kv(x.relation==='replacement'?'Booking thay thế':'Booking đặt thêm',btn(x.id,'open:'+x.id,'link'))).join('')}${(o.supplements||[]).map(x=>kv(x.label,esc(x.detail)+'<br><small>'+money(x.amount)+' · Đã cập nhật NCC</small>')).join('')}`);
 return card('Chi tiết chuyến bay',`<div class="trip"><b>${esc(o.airline)}</b><p>${esc(o.title)} · ${esc(o.flight)}</p><div class="route"><div><small>${o.start}</small><b>${esc(o.departure)}</b><small>${esc(o.title.split(' → ')[0])}</small></div><div class="path">Bay thẳng · Phổ thông</div><div><small>${o.start}</small><b>${esc(o.arrival)}</b><small>${esc(o.title.split(' → ')[1])}</small></div></div></div>${kv('Hành khách','<b>'+esc(o.name)+'</b>')}${kv('PNR / Số vé',esc(o.pnr)+' / '+esc(o.ticket))}${kv('Hành lý',esc(o.baggage))}${kv('Chỗ ngồi',esc(o.seat))}${kv('Mua thêm',o.extras.map(esc).join(' · ')||'Chưa có')}${kv('Thẻ thành viên',esc(o.member||'Chưa bổ sung'))}${o.ssr?kv('Hỗ trợ đặc biệt',esc(o.ssr)):''}${o.split?kv('PNR sau tách',esc(o.split)):''}`)}
function tasks(o){const req=openRequests(o);return req.length?card(customer()?'Yêu cầu của bạn':'Cần xử lý trên đơn',req.map(r=>`<div class="task"><div class="line"><div><b>${esc(requestTitle(r,o))}</b><p>${esc(r.note||'Yêu cầu trên booking này')}</p><small>${r.id} · ${stageLabel(r)} · ${esc(r.origin)}</small></div>${btn(customer()?(r.stage==='quoted'?'Xem phương án':r.stage==='payment'?'Thanh toán':'Xem tiến độ'):'Tiếp tục →','request:'+r.id,needsCS(o)&&!customer()?'primary':'')}</div></div>`).join('')):''}
function detail(){const o=current();return `<div class="orderhead"><div class="eyebrow">${btn('← Danh sách booking','list','link')} &nbsp; / &nbsp; ${o.type==='hotel'?'Khách sạn':'Vé máy bay'}</div><div class="pagehead"><div><h1>${o.id} <span style="font-size:14px;font-weight:400;color:#73808e">${o.type==='flight'?'PNR '+esc(o.pnr):esc(o.title)}</span></h1><span class="muted">${esc(o.customer)} · ${esc(o.email)}</span></div>${!customer()?'<div class="buttons">'+(canResend(o)?btn('Gửi lại email xác nhận','resend-email'):'')+btn('Xem phía khách ↗','mode')+'</div>':''}</div><div class="statusline"><span><small>Trạng thái booking</small>${bookingStatusBadge(o)}</span><span><small>Dịch vụ</small>${tag(o.service)}</span><span><small>Thanh toán</small>${tag(o.payment,o.payment==='Đã thu'?'good':'warn')}</span><span><small>Hoàn tiền</small>${tag(o.refunds.length?o.refunds.every(r=>r.status==='done')?'Đã hoàn':'Đang xử lý':'Chưa phát sinh',o.refunds.some(r=>r.status!=='done')?'warn':'')}</span></div></div>${!customer()?'<div class="case-owner"><span>User xử lý: <b>'+esc(o.assignee||'Chưa có User')+'</b> · '+(o.caseOpen?'Đang xử lý':o.assignee?'Đã đóng case':'Chưa tiếp nhận')+'</span>'+ (o.caseOpen?btn('Đóng case','close-case'):btn('Bắt đầu xử lý','take-case'))+'</div>'+actionsHTML(o):''}<div class="detailgrid"><div>${o.demoCase?'<p class="muted"><b>Tình huống mẫu:</b> '+esc(o.demoCase)+'</p>':''}${tasks(o)}${bookingInfo(o)}${card(o.type==='flight'?'Điều kiện vé':'Điều kiện đặt phòng',o.type==='flight'?`<p>Đổi chuyến: kiểm tra phí và chênh lệch theo báo giá mới từ hãng.</p><p>Hoàn vé: Bookese kiểm tra điều kiện, báo phí và số tiền hoàn trước khi thực hiện.</p><p>Sửa tên: gửi yêu cầu cho Bookese; điều kiện và phí cần Hồng Ngọc Hà xác nhận.</p><small>Điều kiện minh họa. Bản thật sử dụng điều kiện đã mua và phản hồi API của từng vé.</small>`:`<p>${o.free?'Đơn mẫu đang trong điều kiện hủy miễn phí.':'Đơn mẫu áp dụng phí hủy; cần kiểm tra trước khi xác nhận.'}</p><p>Đổi phòng / ngày / khách sạn: gửi Bookese kiểm tra và báo phương án. Chỉ đổi cùng giá hoặc cao hơn theo chính sách Bookese.</p><small>Đổi giai đoạn / nâng hạng: giữ chỗ mới → thanh toán chênh lệch → hủy cũ miễn phí → tạo booking mới. Phụ thu: giữ và cập nhật đơn cũ. Thêm phòng / gia hạn: giữ đơn cũ, tạo booking bổ sung.</small>`)}<details><summary>Lịch sử đơn · ${o.history.length} cập nhật</summary><div class="card history">${o.history.map(h=>`<p>${esc(h.text)}<small>${esc(h.at)} · ${esc(h.actor)}</small></p>`).join('')}</div></details><details><summary>Yêu cầu đã hoàn tất · ${o.requests.filter(r=>['done','rejected'].includes(r.stage)).length}</summary><div>${o.requests.filter(r=>['done','rejected'].includes(r.stage)).map(r=>`<p>${esc(requestTitle(r,o))} · ${stageLabel(r)}<br><small>${esc(r.result||'')}</small></p>`).join('')||'<p>Chưa có yêu cầu đã hoàn tất.</p>'}</div></details></div><div>${customer()?card('Quản lý đặt chỗ',actionsHTML(o)+`<small>Sửa tên vé và hoàn vé là yêu cầu gửi Bookese. Vé chưa thay đổi khi gửi yêu cầu.</small>`):''}${moneyCard(o)}${benefitsCard(o)}${card(customer()?'Thông tin liên hệ':'Khách hàng & nhà cung cấp',`${kv('Tài khoản đặt',esc(o.customer)+'<br>'+esc(o.email))}${kv('Điện thoại',esc(o.phone))}${!customer()?btn('Xem thông tin tài khoản','account','link'):''}${o.type==='hotel'?kv('Khách sạn',esc(o.contact)+'<br>'+esc(o.hotelPhone)+'<br>'+esc(o.hotelEmail)):kv('NCC','Hồng Ngọc Hà · API / hỗ trợ nghiệp vụ')}`)}${card('Thông tin hóa đơn',o.invoice?`<p><b>${esc(o.invoice.company)}</b></p><p>${esc(o.invoice.tax)}</p><small>${esc(o.invoice.email)}<br>${esc(o.invoice.status)}</small>`:`<p class="muted">Chưa bổ sung</p>${btn('Bổ sung thông tin','start:invoice','link')}<p><small>Yêu cầu xuất trong ngày thanh toán: ${o.paidDate}.</small></p>`)}</div></div><p class="footnote">Dữ liệu mẫu lưu trong trình duyệt. Các kết quả API, đồng bộ khách sạn và thanh toán đều là mô phỏng.</p>`}
function moneyCard(o){const transferred=o.transferredTo;const refunded=o.refunds.filter(r=>r.status==='done').reduce((a,r)=>a+r.amount,0);return card('Thanh toán',`<div class="summaryrow"><span>Giá ${o.type==='flight'?'vé, thuế và phí xuất vé':'dịch vụ'}</span><span class="money">${money(o.gross)}</span></div><div class="summaryrow"><span>Voucher</span><span>− ${money(o.voucher)}</span></div><div class="summaryrow"><span>Xu đã sử dụng</span><span>${o.coins.toLocaleString('vi-VN')} xu</span></div><div class="summaryrow total"><span>Khách đã trả</span><span>${money(o.paid)}</span></div>${transferred?kv('Đã chuyển sang booking mới',btn(o.transferredTo,'open:'+o.transferredTo,'link')+' · '+money(o.transferAmount))+'<small>Tiền đã chuyển sang booking mới, không hoàn thêm trên đơn cũ.</small>':''}${o.extraPaid?`<div class="summaryrow"><span>Đã thu bổ sung</span><b>${money(o.extraPaid)}</b></div>`:''}${refunded?`<div class="summaryrow"><span>Đã trả lại khách</span><b>${money(refunded)}</b></div>`:''}${o.refunds.filter(r=>r.status!=='done').map(r=>`<div class="task"><b>Còn phải hoàn ${money(r.amount)}</b><p>${r.status==='pending'?'Đã gửi lệnh · chờ kết quả':'CS xác nhận và trả tiền'}</p>${customer()?tag('Bookese đang xử lý','warn'):btn('Xử lý hoàn tiền','money:'+r.id,'link')}</div>`).join('')}<details><summary>Xu thưởng & ưu đãi</summary><div><p>${esc(o.reward)}</p><small>Khách chủ động hủy có phí: không trả voucher / xu đã dùng. Hủy miễn phí: hoàn đủ tiền và khôi phục voucher / xu theo điều kiện cũ. Lỗi hệ thống / NCC / Bookese: khôi phục quyền lợi của phần hủy. Xu thưởng phần hủy được hủy / thu hồi, ví có thể âm; không trừ vào tiền hoàn.</small></div></details>`)}
function render(){ syncSystemTasks();$('#app').innerHTML=shell(route==='list'?list():detail());for(const [id,key] of [['booking-filter','booking'],['user-filter','user']])$('#'+id)?.addEventListener('change',e=>{filters[key]=e.target.value;render()});$('#demo-user')?.addEventListener('change',e=>{state.currentUser=e.target.value;save();render()});$('#service-filter')?.addEventListener('change',e=>{state.serviceFilter=e.target.value;if(state.serviceFilter==='flight')filters.hotel='';save();render()});document.querySelectorAll('[data-filter]').forEach(el=>el.addEventListener('input',e=>{const k=e.target.dataset.filter,pos=e.target.selectionStart;filters[k]=e.target.value;render();const input=$('#filter-'+k);input.focus();input.setSelectionRange(pos,pos)}));$('#other-action')?.addEventListener('change',e=>{if(e.target.value)start(e.target.value)}); }
function show(title,body,formAction='',label='Tiếp tục'){const o=current();$('#flow').innerHTML=`<div class="modalhead"><div><h2 id="flow-title">${esc(title)}</h2><small>${esc(o.id)} · ${esc(o.name)}${o.type==='flight'?' · '+esc(o.ticket):''}</small></div>${btn('×','close','close','aria-label="Đóng"')}</div><div class="modalbody">${formAction?`<form id="flow-form" data-submit="${formAction}"><div id="form-error" role="alert"></div>${body}<div class="buttons">${btn('Quay lại','close')}<button class="primary" type="submit">${label}</button></div></form>`:body}</div>`;if(!$('#flow').open)$('#flow').showModal(); }
function error(text){const x=$('#form-error');if(x)x.innerHTML=`<div class="error">${esc(text)}</div>`;else toast(text);return false}
function close(){ $('#flow').close();panel=null;render() }
function canResend(o){return o.booking==='Thành công'&&!['Đã hủy','Đã hoàn vé'].includes(o.service)&&(o.type!=='flight'||(o.ticket&&o.ticket!=='Chưa xuất'));}
function resendEmail(recipient){const o=current();if(customer()||!canResend(o))return toast('Chỉ gửi xác nhận khi dịch vụ đã được xác nhận và còn hiệu lực.');panel={kind:'resend',orderId:o.id};show('Gửi lại email xác nhận',`${field('Email nhận','recipient',recipient??o.email,'email','required maxlength="254"') }<small>Email này chỉ dùng cho lần gửi; không thay email tài khoản hoặc liên hệ trên đơn.</small><h3>Xem trước email</h3>${kv('Tiêu đề',esc('Bookese · Xác nhận '+(o.type==='hotel'?'đặt phòng ':'vé máy bay ')+o.id))}<div class="card"><p>Xin chào ${esc(o.customer)},</p><p>Bookese gửi lại thông tin xác nhận hiện tại của đơn <b>${esc(o.id)}</b>.</p>${kv(o.type==='hotel'?'Khách sạn':'Hành trình',esc(o.title))}${kv(o.type==='hotel'?'Người lưu trú':'Hành khách',esc(o.name))}${kv('Ngày sử dụng',esc(o.start)+(o.type==='hotel'?' → '+esc(o.end):' · '+esc(o.departure)))}${o.type==='hotel'?kv('Phòng / quyền lợi',esc(o.room))+kv('Mã tại khách sạn',esc(o.supplierId))+kv('Yêu cầu đặc biệt',esc(o.special||'Chưa có')):kv('PNR / Số vé',esc(o.pnr)+' / '+esc(o.ticket))+kv('Hành lý / Chỗ ngồi',esc(o.baggage)+' / '+esc(o.seat))+kv('Dịch vụ mua thêm',esc(o.extras.join(', ')||'Chưa có'))}<p>Cảm ơn bạn đã đặt dịch vụ tại Bookese.</p></div><small>Prototype chỉ mô phỏng gửi email, không gửi thư thật.</small><details><summary>Thử kết quả mô phỏng</summary>${select('Kết quả gửi','outcome',[['ok','Gửi thành công'],['fail','Gửi lỗi']],'ok')}</details>`,'resend-email','Gửi email');}
function request(o,kind,data={}){const duplicate=openRequests(o).find(r=>r.kind===kind);if(duplicate)return duplicate;const r={id:'YC-'+(++state.seq),kind,stage:'new',origin:customer()?'Khách hàng':'CS',at:stamp(),...data};if(customer()&&!o.caseOpen&&o.assignee){o.previousAssignee=o.assignee;delete o.assignee;}o.requests.unshift(r);log(o,'Tạo yêu cầu '+titleKind(kind,o)+' · '+r.id);return r}
function finish(o,r,text){r.stage='done';r.result=text;log(o,text);close();toast('Đã cập nhật đơn và lịch sử xử lý.')}
function start(kind){const o=current();if(!customer())takeCase(o);if(['services','seat','exchange'].includes(kind)&&o.type==='flight'&&(o.booking!=='Thành công'||o.ticket==='Chưa xuất'))return toast('Vé chưa được xuất. Cần kiểm tra xuất vé trước khi mua thêm / đổi.');if(['Đã hủy','Đã hoàn vé'].includes(o.service)&&!['refund','invoice','note','complaint','payment','double','chargeback'].includes(kind))return toast('Dịch vụ này đã kết thúc; không thể thay đổi tiếp.');const existing=openRequests(o).find(r=>r.kind===kind);if(existing)return openRequest(existing.id);if(kind==='refund'&&o.refunds.some(x=>x.status!=='done'))return refundMoney(o.refunds.find(x=>x.status!=='done').id);panel={kind,step:'start'};
 if(customer()&&!(o.type==='hotel'&&['rename','cancel'].includes(kind))&&!['services','seat','exchange','invoice'].includes(kind))return customerRequest(kind);
 if(kind==='rename')return show('Đổi tên người lưu trú',field('Tên hiện tại','old',o.name,'text','readonly')+field('Tên người nhận phòng mới','name',o.name,'text','required')+info('Lưu thành công sẽ cập nhật trên đơn, đồng bộ sang Extranet và gửi thông tin đến khách sạn.')+check('Tôi đã kiểm tra tên người nhận phòng mới.'),'rename','Lưu & cập nhật khách sạn');
 if(kind==='invoice')return show('Thông tin xuất hóa đơn',field('Tên công ty / người mua','company',o.invoice?.company||'','text','required')+field('Mã số thuế','tax',o.invoice?.tax||'','text','required')+field('Địa chỉ','address',o.invoice?.address||'','text','required')+field('Email nhận hóa đơn','email',o.invoice?.email||o.email,'email','required')+info('Ngày thanh toán: '+o.paidDate+'. Thông tin gửi sau ngày này được chuyển kiểm tra, không tự xác nhận hóa đơn đã xuất.'),'invoice','Lưu thông tin hóa đơn');
 if(kind==='reconfirm'){if(o.type!=='hotel'||o.booking!=='Thành công'||o.service==='Đã hủy')return toast('Reconfirm áp dụng cho booking khách sạn thành công, còn hiệu lực.');return show('Reconfirm khách sạn',field('Code xác nhận KS','hotelCode',o.reconfirm?.code||'')+field('Người xác nhận','confirmedBy',o.reconfirm?.person||'')+info('Khuyến khích xác nhận lại với khách sạn. Không bắt buộc, không thay đổi trạng thái booking.'),'hotel-reconfirm','Lưu xác nhận');}
 if(kind==='note')return show(titleKind(kind,o),area(kind==='note'?'Nội dung ghi chú':'Ghi chú xác nhận lại (không bắt buộc)','note',kind==='reconfirm'?o.reconfirmed:'')+info(kind==='note'?'Có thể ghi kết quả trao đổi offline với PS tại đây. Không chuyển ca hoặc tạo bước chờ PS.':o.source==='Extranet'?'Khách sạn có thể nhập hoặc để trống cột xác nhận lại trên Extranet.':'Nguồn API: CS có thể ghi kết quả gọi kiểm tra với khách sạn.'),kind,'Lưu ghi chú');
 if(['change','over','surcharge','additional','exchange','services','seat'].includes(kind))return configure(kind);
 if(kind==='cancel'||kind==='refund'||kind==='partial')return refundStart(kind);
 if(kind==='payment'||kind==='issue')return paymentStart(kind);
 return manualStart(kind);
}
function customerRequest(kind){const o=current();show('Yêu cầu '+titleKind(kind,o).toLowerCase(),(kind==='name'?field('Tên đề nghị theo giấy tờ','newName','','text','required'):'')+area('Nội dung cần Bookese hỗ trợ','note','','required')+info('Gửi yêu cầu chưa thay đổi thông tin đơn, chưa hủy dịch vụ và chưa hoàn tiền. Bookese sẽ kiểm tra và phản hồi trên booking.')+check('Tôi đồng ý gửi yêu cầu này cho Bookese.'),'customer-request','Gửi yêu cầu');}
function configure(kind,r){const o=current();panel={kind,requestId:r?.id,step:'configure'};
 if(kind==='surcharge')return surchargeForm(r);
 if(kind==='services')return show('Mua thêm dịch vụ',`<p><b>${esc(o.name)}</b> · ${esc(o.title)}</p><p class="muted">Đã có: ${esc(o.baggage)} · Ghế ${esc(o.seat)}</p>${select('Hành lý mua thêm','bag',[['0','Không mua thêm'],['250000','Thêm 10 kg · 250.000 đ'],['400000','Thêm 20 kg · 400.000 đ']],'0')}${select('Suất ăn','meal',[['0','Không mua thêm'],['80000','Suất ăn tiêu chuẩn · 80.000 đ']],'0')}${select('Chỗ ngồi','seat',[['','Giữ nguyên'],['6A','6A · Cửa sổ · 120.000 đ'],['6C','6C · Lối đi · 100.000 đ'],['7B','7B · Ghế giữa · 60.000 đ']],'')}${btn('Xem sơ đồ ghế','seatmap','link')}${info('Giá bán mẫu đã gồm phần cộng giá của Bookese; không thêm phí xử lý. Gói khả dụng và hạn mua lấy theo hãng.')}`,'quote-services','Kiểm tra giá & tiếp tục');
 if(kind==='seat')return seatmap();

}
function paymentView(r){panel={kind:r.kind,requestId:r.id};show('Thanh toán phần phát sinh',`<div class="step">Chờ thanh toán · ${r.id}</div><div class="summaryrow total"><span>Cần thanh toán</span><span>${money(r.quote.total)}</span></div><div class="qr-demo">VỊ TRÍ MÃ QR<br>MÔ PHỎNG<br><small>Không dùng để trả tiền</small></div><p class="mono">PAY-${r.id} · ${esc(current().id)}</p><p>Khách mở link hoặc quét QR do cổng thanh toán tạo. Hệ thống chỉ xác nhận thu tiền khi nhận kết quả giao dịch hợp lệ.</p>${btn('Mở link thanh toán mẫu','payment-preview','link')}<details><summary>Thử kết quả thanh toán (demo)</summary><div class="buttons">${btn('Đã thanh toán','paid:'+r.id,'primary')}${btn('Hết hạn / chưa trả tiền','expire:'+r.id)}</div></details>`)}
function executeView(r){panel={kind:r.kind,requestId:r.id};const o=current();const name=r.kind==='name',manual=['name','member','split','ssr','reroute','special','complaint'].includes(r.kind),refund=['refund','partial','cancel','void','involuntary'].includes(r.kind)&&r.quote?.refund!==undefined;
 show(requestTitle(r,o),`<div class="step">${r.stage==='unknown'?'Cần tra cứu kết quả':'Sẵn sàng thực hiện'}</div>${info(r.stage==='unknown'?'Chưa xác định lệnh trước đã thành công hay chưa. Tra cứu cùng mã lệnh trước khi gửi lại; không thu tiền lần nữa.':manual?'Ghi nhận kết quả NCC đã xác nhận; hệ thống sẽ cập nhật đúng thông tin trên đơn.':refund?(o.type==='flight'?'CS thực hiện hoàn vé trên Bookese qua API. Trả tiền là bước tiếp theo sau kết quả hoàn vé.':'Hủy đồng bộ Extranet / NCC; tiền hoàn được chuyển cho CS xử lý.'):'Hệ thống kiểm tra lại giữ chỗ và kết quả thanh toán trước khi thực hiện.')}${r.quote?.description?'<p>'+esc(r.quote.description)+'</p>':''}${r.quote?.manual?field('Mã kết quả hủy thực tế tại NCC / căn cứ đã xác nhận hủy','cancelProof','','text','required')+info('Hủy thủ công là ghi nhận ngoại lệ đã thống nhất. Chỉ cập nhật đơn sau khi có kết quả hủy; bản thật cần đồng bộ Extranet/API hoặc xác minh nguồn.'):''}${manual?field('Mã phản hồi / căn cứ kết quả NCC','proof','','text','required'):''}${name?field('Tên được HNH xác nhận','confirmedName',r.newName||'','text','required'):r.kind==='member'?field('Chương trình · mã thẻ · hạng được xác nhận','member',r.member||'','text','required'):r.kind==='split'?field('PNR mới và hành khách đã tách','split','','text','required'):manual?area('Kết quả được xác nhận','result',r.note||'','required'):''}${manual?'':`<details><summary>Thử tình huống API (demo)</summary><div>${select('Kết quả','outcome',[['ok','Thành công'],['unknown','Chưa trả trạng thái'],['fail','Thất bại có xác nhận']],'ok')}</div></details>`}${r.quote?.total>0?kv('Tiền bổ sung',r.paid?'Đã thu · '+esc(r.paymentRef):'Chưa thu'):''}`,'execute',r.stage==='unknown'?'Tra cứu kết quả lệnh':manual?'Lưu kết quả & cập nhật đơn':refund?'Thực hiện '+(o.type==='flight'?'hoàn vé':'hủy phòng'):r.kind==='additional'?'Xuất booking bổ sung':r.kind==='surcharge'?'Cập nhật booking & đồng bộ NCC':r.kind==='change'||r.kind==='over'?'Hủy cũ miễn phí & xuất booking mới':'Thực hiện & cập nhật đơn');}
function refundStart(kind,r){const o=current();if(o.transferredTo)return toast('Tiền đã chuyển sang '+o.transferredTo+'. Xử lý hoàn trên booking mới.');panel={kind,requestId:r?.id};show(titleKind(kind,o),`${r?.note?info(esc(r.note)):''}${customer()?'':select('Cách xử lý','mode',[['standard','Theo điều kiện dịch vụ'],['manual','Hủy thủ công — xử lý ngoại lệ']],r?.preferredMode||'standard')}${o.type==='hotel'?select('Phạm vi','scope',customer()?[['all','Toàn bộ booking']]:[['all','Toàn bộ booking'],['half','Một phần dịch vụ / đêm còn lại']],'all'):select('Phạm vi vé','scope',[['all',o.ticket+' · '+o.name+' · Toàn bộ vé'],['half','Một phần chặng / dịch vụ — cần xác minh số tiền']],'all')}${info(o.type==='flight'?'Thông tin vé được lấy từ đơn. Hệ thống lấy điều kiện và số tiền từ API để CS kiểm tra, chỉnh phương án nếu cần.':customer()?'Nếu đúng điều kiện và khách xác nhận, hệ thống sẽ tự hủy với NCC. CS xử lý tiền hoàn sau đó.':'Kiểm tra chính sách hoặc xác nhận miễn / giảm phí từ khách sạn trước khi hủy.')}<details><summary>Điều kiện mẫu</summary><div>${select('Kết quả kiểm tra','eligibility',[['allowed',o.type==='hotel'?'Cho hủy theo chính sách':'Được hoàn theo điều kiện'],['denied','Không đủ điều kiện / cần ngoại lệ'],['unknown','Chưa có kết quả NCC']],'allowed')}</div></details>`,'refund-check','Kiểm tra điều kiện & số tiền');}

function paymentStart(kind,r){panel={kind,requestId:r?.id};const o=current();show(titleKind(kind,o),`${kv('Booking',o.id)}${kv('Thanh toán',o.payment)}${kv('Giữ chỗ',o.ttl?'Còn TTL (mẫu)':'Đã hết hạn')}${info(kind==='payment'?'Tra cứu cổng thanh toán / đối chiếu Kế toán. Ảnh khách bị trừ tiền chưa đủ xác nhận Bookese đã nhận tiền.':'Tra cứu kết quả NCC trước để tránh xuất trùng. Nếu chưa xuất và còn giữ chỗ, CS có thể thực hiện lại.')}${select('Kết quả tra cứu mô phỏng','result',kind==='payment'?[['pending','Chưa xác định tiền về'],['received','Đã nhận tiền · chưa xuất'],['notReceived','Xác nhận chưa nhận tiền']]:[['issued','NCC đã xuất thành công'],['held','Chưa xuất · vẫn còn giữ chỗ'],['expired','Giữ chỗ đã hết hạn'],['unknown','NCC chưa trả kết quả']])}${field('Mã giao dịch / SCT / mã tra cứu','proof','','text','required')}`,'payment-check','Tra cứu & xử lý tiếp');}
function manualStart(kind,r){const o=current();panel={kind,requestId:r?.id};show(titleKind(kind,o),`${r?.note?info(esc(r.note)):''}${kind==='name'?field('Tên đề nghị theo giấy tờ','newName',r?.newName||'','text','required'):kind==='member'?field('Chương trình / số thẻ / hạng đề nghị','member',r?.member||'','text','required'):''}${area(kind==='ssr'?'Loại hỗ trợ và nhu cầu cụ thể':'Nội dung cần thực hiện','note',r?.note||'','required')}${info(kind==='name'?'CS gửi HNH thực hiện; có thể miễn phí hoặc có phí theo xác nhận. Tên trên vé chỉ cập nhật sau kết quả HNH.':kind==='ssr'?'Ví dụ xe lăn hoặc trẻ em đi một mình. Đây là yêu cầu xác nhận khả năng phục vụ; phí phụ thuộc loại dịch vụ và hãng, không mặc định miễn phí.':kind==='void'?'Số vé / PNR có sẵn ở trên. Kiểm tra điều kiện và thời hạn Void với nguồn vé; không mặc định được hủy miễn phí trong ngày.':kind==='split'?'HNH thực hiện tách. CS nhập các PNR và hành khách tương ứng sau khi nguồn xác nhận.':'CS trao đổi với NCC khi cần; sau đó ghi nhận phương án và cập nhật kết quả trên đơn.')}`,'manual-send',o.type==='flight'?'Ghi nhận đã gửi HNH / nguồn':'Ghi nhận đã trao đổi khách sạn');}
function supplierResponse(r){const o=current();panel={kind:r.kind,requestId:r.id};const canRefund=['void','involuntary','double'].includes(r.kind);show('Phản hồi '+(o.type==='flight'?'HNH / nguồn':'khách sạn'),`${info('Chỉ nhập phương án đã được xác nhận. Việc trao đổi với NCC / PS diễn ra ngoài prototype.')}${select('Kết quả','decision',[['yes','Đồng ý hỗ trợ'],['no','Không hỗ trợ / không đủ điều kiện']],'yes')}${area('Nội dung phương án / điều kiện','response',r.note||'','required')}${field('Mã tham chiếu / căn cứ phản hồi','proof','','text','required')}<div class="formgrid"><div>${field('Phí NCC cần thu thêm (đ)','net',0,'number','required min="0" step="1"')}</div><div>${field('Phí xử lý Bookese (đ)','fee',0,'number','required min="0" step="1"')}</div></div>${canRefund&&r.kind!=='double'?select('Quy chế hoàn hủy','cause',[['customer','Khách chủ động hủy'],['fault','Lỗi hệ thống / NCC / Bookese']],'customer'):''}${canRefund?field('Tiền thực trả được nguồn xác nhận hoàn trước phí xử lý','refundBase',0,'number',`required min="0" max="${o.paid}"`):''}${info('Dịch vụ mua thêm hành lý / suất ăn / chỗ ngồi dùng luồng Mua thêm dịch vụ; không cộng phí xử lý tại đó.')}`,'supplier-response','Lưu phản hồi & lập phương án');}
function openRequest(id){const o=current(),r=o.requests.find(r=>r.id===id);if(!r)return;if(!customer()){takeCase(o);r.taken=true;save();}panel={kind:r.kind,requestId:id};if(customer()&&!['quoted','payment'].includes(r.stage)){show(requestTitle(r,o),tag(stageLabel(r),'warn')+`<p>${esc(r.note)}</p>`+info(r.result||'Bookese đang kiểm tra và sẽ cập nhật kết quả trên đơn.')+`<div class="buttons">${btn('Đóng','close')}</div>`);return}
 if(r.stage==='quoted')return quoteView(r);if(r.stage==='payment')return paymentView(r);if(r.stage==='supplier')return supplierResponse(r);if(['ready','unknown'].includes(r.stage))return executeView(r);if(r.stage==='refund'){const rf=o.refunds.find(x=>x.requestId===r.id);return refundMoney(rf?.id)}
 if(['change','over','surcharge','additional','exchange','services','seat'].includes(r.kind))return configure(r.kind,r);if(['cancel','refund','partial'].includes(r.kind))return refundStart(r.kind,r);if(['payment','issue'].includes(r.kind))return paymentStart(r.kind,r);manualStart(r.kind,r);
}

function takeCase(o){if(customer())return;if(o.assignee!==state.currentUser||!o.caseOpen){o.assignee=state.currentUser||'Minh Anh';o.caseOpen=true;log(o,'User xử lý: '+o.assignee+' · tiếp tục xử lý trên đơn');}save();}

function refundProgress(o){const rr=o.refunds||[];if(rr.some(r=>r.status==='pending'))return 'Đang hoàn tiền';if(rr.some(r=>r.status!=='done'))return 'Chờ hoàn tiền';if(rr.length)return o.service==='Đã hoàn một phần'?'Hoàn tiền một phần':'Đã hoàn tiền';return ''; }
function bookingStatus(o){
 if(o.type==='hotel'&&o.service==='Đã hủy')return 'Đã hủy';
 if(o.type==='hotel'&&o.service==='Đã hoàn một phần')return 'Đã hủy một phần';
 const refunds=o.refunds||[];
 if(refunds.some(r=>r.status==='pending'))return 'Đang hoàn tiền';
 if(refunds.some(r=>r.status!=='done'))return 'Chờ hoàn tiền';
 if(refunds.some(r=>r.status==='done'))return o.service==='Đã hoàn một phần'?'Hoàn tiền một phần':'Đã hoàn tiền';
 if(['Đã hủy','Đã hoàn vé'].includes(o.service))return 'Đã hủy';
 if(o.service==='Đã hoàn một phần')return 'Đã hủy một phần';
 return o.booking;
}
function matchesBookingStatus(o,value){
 // Cancellation remains searchable even while its money refund progresses.
 if(['Chờ hoàn tiền','Đang hoàn tiền','Đã hoàn tiền','Hoàn tiền một phần'].includes(value))return refundProgress(o)===value;
 if(value==='Đã hủy')return ['Đã hủy','Đã hoàn vé'].includes(o.service);
 if(value==='Đã hủy một phần')return o.service==='Đã hoàn một phần';
 return bookingStatus(o)===value;
}

function isCS(){return actorRole()==='cs';}
function requireRole(role){if(actorRole()!==role){error('Thao tác này dành cho '+({cs:'CS',ceo:'CEO',accounting:'Kế toán'}[role]||role)+'. Chọn vai trò demo tương ứng.');return false;}return true;}
function policyLog(o,text){o.history.unshift({at:stamp(),actor:customer()?'Khách hàng':({cs:'CS',ceo:'CEO',accounting:'Kế toán'}[actorRole()])+' · '+state.currentUser,text});save();}
function numeric(v){return Number(v||0);}
function amountField(label,name,value=0){return field(label,name,value,'number','required min="0" step="1"');}
function requiredField(label,name,value=''){return field(label,name,value,'text','required');}
function needText(v){return String(v||'').trim().length>0;}
function validAmounts(v,keys){return keys.every(k=>Number.isSafeInteger(numeric(v[k]))&&numeric(v[k])>=0);}
function newId(prefix){return prefix+'-'+(++state.seq);}
function markDone(o,r,result){r.stage='done';r.result=result;r.completedAt=stamp();policyLog(o,result);}
function activeRefunds(o){return o.refunds.filter(x=>!['rejected'].includes(x.status));}
function reservedRefund(o,exceptId){return activeRefunds(o).filter(x=>x.id!==exceptId).reduce((s,x)=>s+numeric(x.amount),0);}
function cashAvailable(o,exceptId){return Math.max(0,numeric(o.paid)+numeric(o.extraPaid)-numeric(o.transferAmount)-numeric(o.retainedFees)-numeric(o.consumedCash)-reservedRefund(o,exceptId));}
function summaryRequest(r){return r.note || r.result || 'Chọn để xem phương án và xử lý.';}
function pendingInvoice(o){return (o.invoiceJobs||[]).some(j=>j.status!=='done');}
hasPendingWork = o => o.booking==='Đang xử lý'||openRequests(o).length>0||o.refunds.some(r=>r.status!=='done')||pendingInvoice(o)||(o.compensations||[]).some(x=>x.status==='approval');
workSummary = o => !openRequests(o).length&&pendingInvoice(o)?'<b>Theo dõi hóa đơn</b><small>Chờ kết quả Kế toán</small>':!openRequests(o).length&&(o.compensations||[]).some(c=>c.status==='approval')?'<b>Đền bù chờ duyệt</b>':originalWorkSummary(o);
bookingStatus = o => ['Đã hủy','Đã hoàn vé'].includes(o.service)?'Đã hủy':o.service==='Đã hoàn một phần'?'Đã hủy một phần':o.booking;
bookingStatusBadge = o => tag(bookingStatus(o),bookingStatus(o)==='Thành công'?'good':'warn');
refundProgress = o => o.refunds.some(r=>r.status==='pending')?'Đang hoàn tiền':o.refunds.some(r=>r.status!=='done')?'Chờ hoàn tiền':o.refunds.length?'Đã hoàn tiền':'';

function initOrder(o){
  o.invoiceJobs ||= []; o.invoiceDocuments ||= []; o.transactions ||= []; o.compensations ||= [];
  o.events ||= []; o.amendCount ||= 0; o.rewardAmount ??= o.type==='hotel'?84000:10000;
  o.rewardPending ??= o.rewardAmount; o.retainedFees ||= 0; o.consumedCash ||= 0;
  o.invoiceBuyer ||= {company:o.invoice?.company||o.customer,tax:o.invoice?.tax||'',address:o.invoice?.address||'TP. Hồ Chí Minh',email:o.invoice?.email||o.email};
  if(o.type==='hotel'){
    o.rooms ??= 2; o.nights ??= Math.max(1,Math.round((new Date(o.end)-new Date(o.start))/86400000));
    o.roomType ||= 'Deluxe'; o.rights ||= 'Bữa sáng · 2 người lớn / phòng';
    o.terms ||= o.free?'Hủy miễn phí theo thời hạn đã mua':'Hủy có phí theo điều kiện đã mua';
    o.nightlyPrices ||= Array.from({length:o.nights},(_,i)=>({date:new Date(new Date(o.start).getTime()+i*86400000).toISOString().slice(0,10),unit:o.gross/o.rooms/o.nights}));
  } else {
    o.passengers ||= [{id:o.id+'-P1',name:o.name,ticket:o.ticket,pnr:o.pnr,segment:o.title,status:o.service,member:o.member||'',ssr:[],services:[]}];
  }
  if(!o.invoiceDocuments.length&&o.booking==='Thành công'){
    o.invoiceDocuments.push({id:'HD-'+o.id,number:'DEMO-'+o.id,date:o.created,amount:o.gross,status:'issued',buyer:structuredClone(o.invoiceBuyer),file:'DEMO-HOADON-'+o.id+'.pdf',demo:true});
  }
  for(const f of o.refunds){if(!f.policy){f.policy=true;f.status=f.status==='done'?'done':'draft';f.reason='Khoản hoàn từ dữ liệu mẫu';f.recipient=o.email;f.scope='Theo kết quả xử lý dịch vụ';}}
  for(const r of o.requests){if(r.stage==='refund'&&o.refunds.some(f=>f.requestId===r.id)){r.stage='done';r.result='Dịch vụ đã xử lý; tiền hoàn theo dõi riêng.';}}
  return o;
}

  s.orders.forEach(initOrder);
  const fee=s.orders.find(o=>o.id==='BK-2509');
  if(fee){fee.service='Có hiệu lực';fee.booking='Thành công';fee.free=false;fee.refunds=[];fee.rewardPending=fee.rewardAmount;fee.demoCase='Hủy có phí · khách chỉ gửi yêu cầu';fee.requests=[{id:'YC-FEE-2509',kind:'cancel',stage:'new',origin:'Khách hàng',note:'Xin kiểm tra phí hủy trước khi thực hiện.'}];fee.history=[{at:stamp(),actor:'Hệ thống',text:fee.demoCase}];}
  const base=s.orders.find(o=>o.id==='BK-2601'), flight=s.orders.find(o=>o.id==='FL-0201');
  const add=(id,template,title,kind,note)=>{const o=structuredClone(template);Object.assign(o,{id,demoCase:title,requests:[],refunds:[],history:[],invoiceJobs:[],invoiceDocuments:[],transactions:[],compensations:[],caseOpen:false});delete o.assignee;o.supplierId='NCC-'+id;if(kind)o.requests.push({id:'YC-'+id,kind,stage:'new',origin:'Khách hàng',note});initOrder(o);o.history.push({at:stamp(),actor:'Hệ thống',text:title});s.orders.push(o);return o;};
  add('BK-2701',base,'Giảm 2 phòng còn 1 · giữ giá và quyền lợi','reduce','Khách giảm từ 2 phòng xuống 1, giữ nguyên ngày lưu trú.');
  const early=add('BK-2702',base,'Trả phòng sớm · xác minh phần đã ở','reduce','Khách đã ở 1 đêm, xin trả sớm 1 đêm.');early.checkedIn=true;
  add('BK-2703',base,'Overbooking · KS đã tìm phòng thay thế','over','KS xác nhận thiếu phòng, đã giữ khách sạn thay thế. Cần ghi nhận B và bên chịu chênh lệch.');
  add('BK-2704',base,'Sai quyền lợi · chỉ lưu case nội bộ','complaint','Khách phản ánh chưa được phục vụ bữa sáng đã bao gồm.');
  add('BK-2705',base,'Hóa đơn đã xuất · khách yêu cầu sửa MST','invoice','Khách gửi thông tin hóa đơn cần sửa.');
  const multi=add('FL-0301',flight,'2 hành khách · tách PNR để xử lý riêng','split','Một hành khách muốn đổi, cần HNH xác nhận có cần tách PNR.');multi.paid=1980000;multi.gross=2100000;multi.passengers=[{id:'P1',name:'NGUYEN AN',pnr:'DEMO2P',ticket:'738-DEMO-P1',segment:multi.title,status:'Có hiệu lực',services:[],ssr:[]},{id:'P2',name:'TRAN BINH',pnr:'DEMO2P',ticket:'738-DEMO-P2',segment:multi.title,status:'Có hiệu lực',services:[],ssr:[]}];multi.pnr='DEMO2P';
  add('FL-0302',flight,'Đổi khác hãng / chặng qua HNH','reroute','Khách muốn đổi sang Đà Nẵng.');
  add('FL-0303',flight,'Sửa tên · có thể xuất lại vé','name','Kiểm tra sửa tên với HNH.');
  add('BK-2706',base,'NCC không tìm thấy booking','payment','Khách đến nơi nhưng khách sạn không tìm thấy mã xác nhận.');
  const rf=add('FL-0304',flight,'Hoàn đã được duyệt · Kế toán đi tiền',null,'');rf.service='Đã hoàn vé';rf.refunds=[{id:'RF-DEMO-CEO',policy:true,status:'approved',amount:800000,reason:'Hoàn theo điều kiện',scope:'Toàn bộ vé',recipient:'Nguyễn An · tài khoản demo',basis:'Xác nhận HNH DEMO',approvedBy:'CEO demo',approvedAt:stamp(),approvedSnapshot:'',method:'OnePay'}];rf.refunds[0].approvedSnapshot=JSON.stringify([800000,rf.refunds[0].recipient]);rf.retainedFees=190000;
  return s;
};

const POLICY_KEY='bookese-cs-policy-'+POLICY_VERSION;
try{const saved=JSON.parse(localStorage.getItem(POLICY_KEY));state=saved?.policyVersion===POLICY_VERSION?saved:seed();}catch{state=seed();}
save=()=>localStorage.setItem(POLICY_KEY,JSON.stringify(state));
state.orders.forEach(initOrder); state.view ||= 'bookings'; state.role ||= 'cs';

function policyToolbar(){return `<div class="policy-toolbar"><div>${btn('Booking','policy-view:bookings',state.view==='bookings'?'primary':'')}${btn('Hoàn tiền','policy-view:refunds',state.view==='refunds'?'primary':'')}${btn('Hóa đơn','policy-view:invoices',state.view==='invoices'?'primary':'')}${btn('Báo cáo nghiệp vụ','policy-view:reports',state.view==='reports'?'primary':'')}</div><label>Vai trò demo <select id="policy-role">${[['cs','CS'],['ceo','CEO'],['accounting','Kế toán']].map(([v,t])=>`<option value="${v}" ${state.role===v?'selected':''}>${t}</option>`).join('')}</select></label></div>`;}
render=function(){
  originalRender();
  if(!customer())$('.main').insertAdjacentHTML('afterbegin',policyToolbar());
  $('#policy-role')?.addEventListener('change',e=>{state.role=e.target.value;save();render();});
  const selectUser=$('#demo-user');if(selectUser&&!isCS())selectUser.disabled=true;
};
list=function(){return !customer()&&state.view!=='bookings'?dashboard(state.view):originalList();};
function reportRows(type){
  return state.orders.flatMap(o=> type==='refunds'?o.refunds.map(x=>({o,x})):type==='invoices'?o.invoiceJobs.map(x=>({o,x})):o.requests.filter(x=>x.policy).map(x=>({o,x})));
}
function dashboard(type){
  const rows=reportRows(type), title={refunds:'Duyệt và thực hiện hoàn tiền',invoices:'Hóa đơn và chứng từ',reports:'Báo cáo nghiệp vụ'}[type];
  const desc={refunds:'CS lập đề xuất → CEO duyệt cuối ngày → Kế toán chi ngày tiếp theo. Dịch vụ và tiền hoàn có trạng thái riêng.',invoices:'Bookese xuất hóa đơn trong ngày phát sinh booking. Theo dõi riêng việc phát hành và từng yêu cầu thay đổi.',reports:'Theo dõi yêu cầu, ngoại lệ, sự cố và các booking liên kết. Ghi chú nội bộ không làm thay đổi doanh thu.'}[type];
  return `<h1>${title}</h1><p class="muted">${desc}</p><div class="buttons">${btn('Xuất danh sách CSV','policy-export:'+type)}</div>${type==='refunds'?`<div class="policy-metrics">${kv('Chờ CEO duyệt',rows.filter(z=>z.x.status==='submitted').length)}${kv('Đã duyệt / chờ chi',rows.filter(z=>z.x.status==='approved').length)}${kv('Đã hoàn',money(rows.filter(z=>z.x.status==='done').reduce((s,z)=>s+z.x.amount,0)))}</div>`:''}<section class="card"><div class="table-wrap"><table><thead><tr><th>Booking / dịch vụ</th><th>Nội dung</th><th>Trạng thái</th><th>Tiền / kết quả</th><th></th></tr></thead><tbody>${rows.map(({o,x})=>`<tr><td>${btn(o.id,'open:'+o.id,'link')}<small>${esc(o.title)}</small></td><td>${esc(type==='refunds'?x.reason:type==='invoices'?x.reason:workflowNames[x.kind])}<small>${esc(x.scope||x.note||'')}</small></td><td>${tag(type==='refunds'?rfLabels[x.status]:type==='invoices'?invoiceLabels[x.status]:stageLabel(x))}${x.exception?tag('Ngoại lệ','warn'):''}</td><td>${type==='refunds'?money(x.amount):type==='invoices'?esc(x.result||'—'):esc(x.result||'Chưa hoàn tất')}${x.linkedId?'<small>A → '+esc(x.linkedId)+'</small>':''}</td><td>${btn('Mở xử lý','policy-dashboard:'+type+':'+o.id+':'+x.id,'link')}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">Chưa có yêu cầu.</td></tr>'}</tbody></table></div></section>${type==='invoices'?invoiceRegister():''}${type==='reports'?eventReport():''}`;
}
function invoiceRegister(){return card('Danh sách hóa đơn',`<div class="table-wrap"><table><thead><tr><th>Booking</th><th>Số / ngày</th><th>Người mua</th><th>Giá trị</th><th>Liên kết / chứng từ</th></tr></thead><tbody>${state.orders.flatMap(o=>o.invoiceDocuments.map(d=>`<tr><td>${esc(o.id)}</td><td>${esc(d.number)}<small>${esc(d.date)}</small></td><td>${esc(d.buyer?.company||'')}</td><td>${money(d.amount)}</td><td>${esc(d.file)}<small>${esc(d.originalId||'Hóa đơn gốc')}${d.demo?' · Chứng từ minh họa':''}</small></td></tr>`)).join('')}</tbody></table></div>`);}
function eventReport(){return card('Sự cố và đền bù',state.orders.flatMap(o=>[...o.events.map(x=>`<p><b>${esc(o.id)} · ${esc(o.title)}</b> · ${esc(x.type)}<br>${esc(x.detail)}<br><small>${esc(x.at)} · ${esc(x.by)} · ${esc(x.status)}</small></p>`),...o.compensations.map(x=>`<p><b>${esc(o.id)}</b> · ${esc(x.type)} ${money(x.amount)} · ${esc(x.status)}<br>${esc(x.reason)} · người nhận ${esc(x.recipient)}</p>`)]).join('')||'<p>Chưa phát sinh.</p>');}

function availableBusinessGroups(section,o=current()){
  if(!customer()&&!isCS())return [];
  const ended=['Đã hủy','Đã hoàn vé'].includes(o.service);
  const hiddenForCustomer=['reconfirm','over','payment','double','chargeback','compensation','note','split','cash-proposal'];
  return (businessGroups[section]||[]).map(g=>({...g,kinds:g.kinds.filter(k=>(!customer()||!hiddenForCustomer.includes(k))&&(!ended||['payment','invoice','compensation','note','cash-proposal','double','chargeback','complaint'].includes(k)))})).filter(g=>g.kinds.length);
}
function showBusinessGroups(section){
  const groups=availableBusinessGroups(section);if(!groups.length)return toast('Không có thao tác phù hợp với vai trò hoặc trạng thái đơn.');
  panel={policy:true,kind:'group-picker',section};
  const common=section==='common';
  show(common?'Nghiệp vụ dùng chung':section==='hotel'?'Xử lý booking khách sạn':'Xử lý booking vé máy bay',
    `<p class="group-intro">Chọn nhóm nghiệp vụ cần xử lý.</p><div class="business-groups">${groups.map(g=>`<button type="button" class="business-group" data-action="policy-group:${section}:${g.id}"><b>${esc(g.title)}</b><span>${esc(g.hint)}</span><span class="group-next" aria-hidden="true">→</span></button>`).join('')}</div>${!common?'<p class="footnote">Ngoại lệ được xử lý trong nghiệp vụ tương ứng, theo xác nhận của KS / HNH.</p>':''}`);
}
function openBusinessGroup(section,id){
  const g=availableBusinessGroups(section).find(g=>g.id===id);if(!g)return toast('Nhóm này không còn phù hợp với vai trò hoặc trạng thái đơn.');
  if(g.kinds.length===1)return startGroupedBranch(section,id,g.kinds[0]);
  panel={policy:true,kind:'group-picker',section,groupId:id};
  show(g.title,`<p>${btn('← Chọn nhóm khác','policy-groups:'+section,'link')}</p><p class="group-intro">Chọn nội dung cần xử lý trong nhóm này.</p><div class="business-branches">${g.kinds.map(k=>btn(esc(workflowNames[k]),'policy-branch:'+section+':'+id+':'+k,'business-branch')).join('')}</div>`);
}
function startGroupedBranch(section,id,kind){
  const group=availableBusinessGroups(section).find(g=>g.id===id);
  if(!group?.kinds.includes(kind))return toast('Thao tác không phù hợp với vai trò hoặc trạng thái đơn.');
  $('#flow').close();panel=null;
  if(kind==='cash-proposal')return newRefundForm();
  return start(kind);
}

  return `<div class="actionbar grouped-actionbar">${availableBusinessGroups(o.type,o).length?btn(customer()?'Thay đổi / hỗ trợ booking':'Xử lý booking','policy-groups:'+o.type,'primary'):''}${customer()?btn('Hóa đơn & chứng từ','start:invoice'):btn('Nghiệp vụ dùng chung','policy-groups:common')}${isCS()?btn('Ghi chú nội bộ','start:note','link'):''}</div>`;
};

bookingInfo=function(o){

  return html;
};
detail=function(){const o=current();initOrder(o);return `<div class="orderhead"><div class="eyebrow">${btn('← Danh sách booking','list','link')}</div><h1>${esc(o.id)} <small>${esc(o.title)}</small></h1><p>${esc(o.customer)} · ${esc(o.email)}</p><div class="statusline">${kv('Booking',bookingStatusBadge(o))}${kv('Dịch vụ',tag(o.service))}${kv('Thanh toán',tag(o.payment))}${kv('Hoàn tiền',tag(refundProgress(o)||'Chưa phát sinh'))}</div></div>${!customer()?`<div class="case-owner"><span>User xử lý: <b>${esc(o.assignee||'Chưa có User')}</b> · ${workQueue(o)==='none'?'Không có yêu cầu':workQueue(o)==='completed'?'Đã đóng case':'Đang theo dõi'}</span>${isCS()?(o.caseOpen?btn('Đóng case','policy-close-case'):btn('Bắt đầu xử lý','take-case')):''}</div>`:''}${actionsHTML(o)}<div class="detailgrid"><div>${o.demoCase?info('<b>Tình huống mẫu:</b> '+esc(o.demoCase)):''}${tasks(o)}${bookingInfo(o)}${!customer()&&canResend(o)?btn('Gửi lại email xác nhận','resend-email'):''}${card('Lịch sử xử lý',o.history.slice(0,30).map(h=>`<p>${esc(h.text)}<br><small>${esc(h.at)} · ${esc(h.actor)}</small></p>`).join('')||'<p>Chưa có cập nhật.</p>')}${card('Yêu cầu đã xử lý',o.requests.filter(r=>['done','rejected'].includes(r.stage)).map(r=>`<p><b>${esc(workflowNames[r.kind])}</b><br>${esc(r.result||'Không tiếp tục')}${r.exception?' · Ngoại lệ':''}</p>`).join('')||'<p>Chưa có.</p>')}</div><div>${moneyCard(o)}${invoiceCard(o)}${benefitsCard(o)}</div></div><p class="footnote">Prototype theo nghiệp vụ ngày 15/10/2026. Tất cả xác nhận NCC, thanh toán, hóa đơn và thông báo trong demo đều là mô phỏng.</p>`;};
moneyCard=function(o){return card('Tiền trên booking',`${kv('Tiền khách đã trả',money(o.paid))}${kv('Thu bổ sung',money(o.extraPaid||0))}${kv('Chuyển sang B',money(o.transferAmount||0))}${kv('Phí giữ lại',money(o.retainedFees||0))}${o.supplierCost?kv('KS / Bookese chịu riêng',money(o.supplierCost)):''}${o.transferredTo?kv('Booking nhận tiền',btn(o.transferredTo,'open:'+o.transferredTo,'link')):''}${o.refunds.map(f=>`<div class="task"><b>${money(f.amount)}</b><p>${rfLabels[f.status]||f.status}</p>${btn(customer()?'Xem tiến độ hoàn':'Mở khoản hoàn','money:'+f.id,'link')}</div>`).join('')}${!customer()&&isCS()?btn('Lập đề xuất hoàn','policy-refund-new','link'):''}${o.transactions.map(t=>`<p><small>${esc(t.ref)} · ${money(t.amount)}<br>${esc(t.type)} · ${esc(t.status||'Đã xác minh')}</small></p>`).join('')}`);};
function invoiceCard(o){return card('Hóa đơn và chứng từ',`${o.invoiceDocuments.map(d=>`<p><b>${esc(d.number)}</b> · ${money(d.amount)}<br>${esc(d.buyer?.company)}<br><small>${esc(d.date)} · ${esc(d.file)}${d.originalId?'<br>Liên kết: '+esc(d.originalId):''}</small></p>`).join('')||'<p>Chưa phát hành · xuất trong ngày booking.</p>'}${o.invoiceJobs.map(j=>`<div class="task"><p>${esc(j.reason)}</p>${tag(invoiceLabels[j.status])}${!customer()?btn('Xem / xử lý','policy-invoice:'+j.id,'link'):''}</div>`).join('')}${btn('Yêu cầu sửa thông tin','start:invoice','link')}${actorRole()==='accounting'?btn('Phát hành / ghi kết quả','policy-invoice-issue','link'):''}`);}
benefitsCard=function(o){return card('Xu / voucher và đền bù',`${kv('Voucher đã dùng',money(o.voucher))}${kv('Xu đã dùng',o.coins+' xu')}${kv('Xu thưởng đang chờ',o.rewardPending+' xu')}${o.benefitNote?info(esc(o.benefitNote)):''}${o.compensations.map(c=>`<p>${esc(c.type)} · ${money(c.amount)}<br>${esc(c.reason)} · ${esc(c.status)}${c.status==='approval'&&actorRole()==='ceo'?btn('Xem duyệt','policy-comp-approve:'+c.id,'link'):''}</p>`).join('')}${!customer()&&isCS()?btn('Bù xu / voucher mới','start:compensation','link'):''}<small>Đền bù ghi riêng, không trừ tiền phải hoàn. Xu chờ chỉ thành khả dụng sau khi checkout hoặc bay.</small>`);};

// Entry points and the request/quote/confirmation workflow.
const replacementKinds=['reduce','change','over'];
const cancellationKinds=['cancel','refund','partial','void','involuntary'];
const manualKinds=['reroute','name','member','ssr','split','void','involuntary'];
function canSelf(o,k){return o.type==='hotel'&&((k==='cancel'&&o.free)||k==='rename'||k==='special')||o.type==='flight'&&['services','exchange'].includes(k);}
start=function(kind){
  const o=current();initOrder(o);if(!customer()&&!requireRole('cs'))return;
  if(!customer())takeCase(o);
  if(['services','exchange','reroute','name','member','ssr','split','refund','void','involuntary'].includes(kind)&&o.type==='flight'&&(o.ticket==='Chưa xuất'||o.booking!=='Thành công'))return toast('Vé chưa xuất thành công. Tra soát tiền và dịch vụ trước.');
  if(['Đã hủy','Đã hoàn vé'].includes(o.service)&&!['invoice','payment','note','compensation','complaint'].includes(kind))return toast('Dịch vụ đã kết thúc. Chỉ xử lý khoản còn tồn hoặc thông tin liên quan.');
  if(replacementKinds.includes(kind)&&o.amendCount>=3)return toast('Booking đã đạt 3 lần amend. Cần kiểm tra quyền xử lý, không tự tạo lần thứ 4.');
  if(kind==='invoice')return invoiceRequestForm();
  if(kind==='compensation')return compensationForm();
  if(kind==='reconfirm')return simpleForm('reconfirm');
  if(kind==='note')return simpleForm('note');
  const existing=openRequests(o).find(r=>r.kind===kind);if(existing)return openRequest(existing.id);
  panel={kind,policy:true};
  let body=area('Nội dung yêu cầu','note','','required');
  if(o.type==='flight')body+=passengerSelect(o)+requiredField('Chặng áp dụng','segment',o.title);
  if(kind==='rename')body+=requiredField('Tên đại diện nhận phòng mới','newName',o.name)+info('Đơn có một trường tên đại diện. Tên người nhận từng phòng: gửi danh sách qua chat để khách sạn xác nhận.');
  if(kind==='special')body+=info('Lưu cuộc trao đổi trên booking, gửi khách sạn. Dịch vụ có phí qua chat do khách sạn thu trực tiếp.');
  if(kind==='member')body+=requiredField('Chương trình thành viên','program','Bông Sen Vàng')+requiredField('Số thẻ','member');
  if(kind==='ssr')body+=select('Loại hỗ trợ','ssrType',['Xe lăn','Trẻ em đi một mình','Y tế','Khác']);
  if(kind==='name')body+=requiredField('Tên hành khách cần sửa thành','newName');
  if(customer())body+=info(canSelf(o,kind)?'Bạn có thể thực hiện trên hệ thống. Bước tiếp theo hiển thị điều kiện và xác nhận.':'Yêu cầu sẽ gửi CS. Booking chưa thay đổi khi gửi yêu cầu.');
  show(workflowNames[kind],body,'policy-create',customer()&&!canSelf(o,kind)?'Gửi yêu cầu cho CS':'Tiếp tục');
};
function passengerSelect(o,selected){return select('Hành khách / vé cần xử lý','passengerId',o.passengers.map(p=>[p.id,p.name+' · '+p.ticket]),selected||o.passengers[0]?.id);}
function currentPassenger(o,r){return o.passengers?.find(p=>p.id===r.passengerId)||o.passengers?.[0];}
function setupRequest(o,r){
  if(!r.policy){r.policy=true;r.stage='new';r.passengerId ||= o.passengers?.[0]?.id;r.segment ||= o.title;}
  return r;
}
openRequest=function(id){const o=current(),r=o.requests.find(r=>r.id===id);if(!r)return;setupRequest(o,r);if(!customer()&&isCS())takeCase(o);panel={policy:true,requestId:id,kind:r.kind};
  if(['done','rejected'].includes(r.stage))return show(workflowNames[r.kind]+' · '+stageLabel(r),`<p>${esc(r.result||'Đã kết thúc yêu cầu.')}</p>${r.plan?kv('Phương án đã chốt',esc(r.plan.description))+kv('Thu thêm / hoàn',money(r.plan.charge)+' / '+money(r.plan.refund)):''}${r.linkedId?btn('Mở booking '+esc(r.linkedId),'open:'+r.linkedId,'link'):''}`);
  if(r.kind==='invoice'){invoiceRequestForm();panel.requestId=id;return;}
  if(customer()&&!canSelf(o,r.kind)&&!['quoted','payment'].includes(r.stage))return show(workflowNames[r.kind],info('Yêu cầu đã gửi CS. '+stageLabel(r))+`<p>${esc(r.note)}</p>`);
  if(!customer()&&!isCS()&&!['payment','issue','double','chargeback'].includes(r.kind))return show(workflowNames[r.kind],info('CS xử lý nghiệp vụ này. Vai trò hiện tại chỉ xem tiến độ.')+`<p>${esc(r.note)}</p>`);
  if(r.stage==='quoted')return policyQuote(r);
  if(r.stage==='payment')return policyPayment(r);
  if(['ready','unknown'].includes(r.stage))return policyExecution(r);
  if(['payment','issue','double','chargeback'].includes(r.kind))return reconcileForm(r);
  if(r.kind==='complaint')return incidentForm(r);
  if(['rename','special'].includes(r.kind))return amendmentForm(r);
  if(customer()&&canSelf(o,r.kind))return selfPlanForm(r);
  return planForm(r);
};
function selfPlanForm(r){
  const o=current();
  if(r.kind==='cancel'){
    if(!o.free)return show('Hủy có phí',info('Gửi yêu cầu CS kiểm tra phí trước khi thực hiện.'));
    r.plan={base:cashAvailable(o),fee:0,refund:cashAvailable(o),charge:0,scope:'all',cause:'conditions',usedCoins:o.coins,usedVoucher:o.voucher,pendingReward:o.rewardPending,basis:'API-DEMO · Trong điều kiện hủy miễn phí',description:'Hủy toàn bộ phòng trên booking; tiền hoàn qua quy trình CS / CEO / Kế toán.',expires:Date.now()+30*60000};r.stage='quoted';save();return policyQuote(r);
  }
  const body=r.kind==='services'?select('Dịch vụ muốn mua','choice',[['bag','Thêm 10 kg hành lý · 300.000 đ'],['seat','Chọn ghế 12A · 120.000 đ'],['meal','Suất ăn · 150.000 đ']])+info('Giá hiển thị đã gồm markup, không cộng phí xử lý khác.'):field('Ngày bay mới','newDate',o.start,'date','required')+select('Chuyến bay','choice',[['VN-DEMO-14','14:00 → 16:10 · thu thêm 300.000 đ'],['VN-DEMO-18','18:00 → 20:10 · thu thêm 450.000 đ']])+info('Giữ '+esc(o.airline)+' · '+esc(o.title)+'. Đổi khác hãng / chặng: gửi yêu cầu CS.');
  show(workflowNames[r.kind],passengerSelect(o,r.passengerId)+body,'policy-self-quote','Xem điều kiện và giá');
}
function planForm(r){
  const o=current(),k=r.kind,p=currentPassenger(o,r),q=r.plan||{};
  let body=`<p>${esc(r.note)}</p>`;
  if(o.type==='flight')body+=passengerSelect(o,r.passengerId)+requiredField('Chặng áp dụng','segment',r.segment||o.title);
  if(replacementKinds.includes(k)){
    body+=info(k==='reduce'?'B giữ hạng phòng, quyền lợi, điều kiện và giá từng đêm của A. Chỉ giảm phần phòng / đêm được thống nhất.':'Xác nhận B trước → hủy phần A thay thế → chuyển tiền. Lưu liên kết A–B, không tính tiền chuyển là thu mới.');
    body+=requiredField('Khách sạn B','hotel',q.hotel||o.title)+field('Ngày nhận phòng','start',q.start||o.start,'date','required')+field('Ngày trả phòng','end',q.end||o.end,'date','required')+field('Số phòng B','rooms',q.rooms||(k==='reduce'?1:o.rooms),'number','required min="1" step="1"');
    if(k!=='reduce')body+=requiredField('Hạng phòng B','roomType',q.roomType||o.roomType)+requiredField('Quyền lợi B','rights',q.rights||o.rights)+requiredField('Điều kiện B','terms',q.terms||o.terms);
    body+=amountField('Tiền khách phải trả cho B sau ưu đãi (đ)','newCash',q.newCash??(k==='reduce'?Math.floor(o.paid/2):o.paid));
    body+=amountField('Phí hủy phần A đã chốt (đ)','fee',q.fee||0)+amountField('Tiền A giữ cho dịch vụ không thay thế (đ)','keepCash',q.keepCash||0);
    if(k!=='reduce')body+=field('Nếu chỉ thay một phần: số phòng còn giữ trên A','keepRooms',0,'number','min="0" step="1"')+field('Phòng / đêm / quyền lợi giữ lại trên A','keepDetail');
    if(k==='over')body+=select('Booking B','bMode',[['create','Bookese tạo B'],['record','Ghi nhận B do KS / PS đã đặt']])+requiredField('Khách đồng ý phương án thay thế / căn cứ','customerBasis')+amountField('Chênh lệch KS / Bookese chịu riêng (đ)','cost',q.cost||0)+select('Bên chịu chênh lệch','costPayer',['Khách sạn','Bookese','Không phát sinh']);
    if(k==='reduce'&&o.checkedIn)body+=requiredField('KS xác nhận đêm đã ở và phần được giảm','consumedBasis')+info('B ghi đầy đủ phần lưu trú thực tế. Không lấy đêm chưa ở nhân giá bình quân để tính hoàn.');
  } else if(k==='additional'){
    body+=select('Nhu cầu','addition',['Đặt thêm phòng','Gia hạn thêm đêm'])+requiredField('Khách sạn / hạng phòng mới','hotel',o.title)+field('Ngày nhận phòng','start',o.end,'date','required')+field('Ngày trả phòng','end','','date','required')+field('Số phòng','rooms',1,'number','required min="1"')+requiredField('Điều kiện / quyền lợi đặt thêm','terms','Theo báo giá mới')+requiredField('Giữ cùng phòng hay chuyển phòng','roomArrangement','Khách sạn cần xác nhận')+amountField('Toàn bộ tiền booking B (đ)','charge')+info('Giữ nguyên A; B có giao dịch, ưu đãi và hóa đơn riêng.');
    body+=requiredField('Hạng phòng đặt thêm','roomType',o.roomType)+requiredField('Quyền lợi đặt thêm','rights',o.rights);
  } else if(k==='surcharge'){
    body+=requiredField('Nội dung: số người, tuổi trẻ em, giường / quyền lợi','detail')+select('Bên thu','collector',[['bookese','Bookese'],['hotel','Khách sạn thu trực tiếp'],['free','Miễn phí']])+amountField('Số tiền phụ thu (đ)','charge');
  } else if(cancellationKinds.includes(k)){
    const rightsLeft=loyaltyLeft(o),multi=o.type==='flight'&&o.passengers.length>1;
    body+=select('Phạm vi','scope',[['all','Toàn bộ đơn / vé được chọn'],['part','Một phần dịch vụ / chặng']])+amountField('Tiền thực trả của phần được xử lý (đ)','base',multi?0:cashAvailable(o))+amountField('Phí hãng / KS và phí xử lý giữ lại (đ)','fee',k==='cancel'&&o.free?0:100000)+select('Căn cứ quyền lợi','cause',[['conditions','Theo điều kiện đã mua'],['fault','Lỗi Bookese / NCC đã được xác nhận']])+amountField('Xu đã dùng thuộc phần hủy','usedCoins',multi?0:rightsLeft.coins)+amountField('Voucher đã dùng thuộc phần hủy (đ)','usedVoucher',multi?0:rightsLeft.voucher)+amountField('Xu thưởng chờ của phần hủy','pendingReward',multi?0:o.rewardPending);
    if(o.type==='flight')body+=info('Nhập giá trị hoàn đúng vé/chặng từ nguồn; không chia đều tổng tiền. Nếu cần tách PNR, thực hiện tách trước.');
    if(k==='void')body+=field('Hạn void HNH xác nhận','deadline','','datetime-local','required');
  } else if(['exchange','reroute'].includes(k)){
    body+=requiredField('Hãng mới','airline',o.airline)+requiredField('Hành trình mới','itinerary',o.title)+field('Ngày bay mới','newDate',o.start,'date','required')+requiredField('Chuyến / giờ mới','flight','VN-DEMO · 14:00')+amountField('Giá trị vé cũ được dùng (đ)','oldValue',o.paid)+amountField('Phí hãng (đ)','airlineFee')+amountField('Chênh lệch giá / thuế phải thu (đ)','difference',300000)+amountField('Phí xử lý Bookese (đ)','processingFee');
    if(k==='reroute')body+=select('HNH xác nhận phương án','exchangeMode',[['exchange','Đổi trên vé hiện có'],['new','Không đổi được · mua vé mới']])+amountField('Nếu mua mới: giá vé mới (đ)','newTicketPrice')+amountField('Nếu mua mới: số tiền vé cũ được hoàn (đ)','oldRefund')+info('Mua mới: thu vé mới riêng, đề xuất hoàn vé cũ riêng sau kết quả hủy. Không tự bù tiền chưa hoàn.');
    body+=requiredField('Hành lý / ghế / EMD được chuyển hoặc thay đổi','servicesNote','Giữ theo xác nhận nguồn');
  } else if(k==='services'){
    body+=requiredField('Dịch vụ / ghế muốn mua','detail','Thêm 10 kg hành lý')+amountField('Giá NCC (đ)','net',250000)+amountField('Markup (đ)','markup',50000)+info('Tổng thu = giá NCC + markup. Không cộng phí xử lý khác.');
  } else if(k==='name'){
    body+=requiredField('Tên mới','newName',r.newName||p.name)+select('Kết quả kiểm tra HNH','nameMode',[['update','Sửa thông tin, giữ số vé'],['reissue','Xuất lại vé trên booking cũ'],['new','Phải tạo booking mới B · ngoại lệ']])+amountField('Phí / chênh lệch phải thu (đ)','charge');
    body+=`<details><summary>Nếu HNH yêu cầu tạo booking B</summary>${amountField('Tiền vé được chọn chuyển sang B (đ)','nameTransfer',o.passengers.length===1?cashAvailable(o):0)}${amountField('Xu đã dùng chuyển theo vé','transferCoins',o.passengers.length===1?o.coins:0)}${amountField('Voucher chuyển theo vé (đ)','transferVoucher',o.passengers.length===1?o.voucher:0)}${amountField('Xu chờ của vé chuyển đi','transferReward',o.passengers.length===1?o.rewardPending:0)}<p>Nhập theo phân bổ được xác nhận cho vé, không chia đều tổng booking.</p></details>`;
  } else if(k==='member')body+=requiredField('Chương trình','program',r.program||'Bông Sen Vàng')+requiredField('Số thẻ','member',r.member||'')+amountField('Phí được xác nhận (đ)','charge');
  else if(k==='ssr')body+=requiredField('Loại hỗ trợ và hồ sơ đã kiểm tra','detail',r.ssrType||'Xe lăn')+amountField('Phí được HNH xác nhận (đ)','charge');
  else if(k==='split')body+=select('Kết quả HNH kiểm tra','splitMode',[['split','Cần tách PNR'],['direct','Xử lý trực tiếp theo vé, không cần tách']])+requiredField('Đã kiểm tra trẻ em / người lớn đi cùng','childCheck','Không ảnh hưởng việc đi cùng')+amountField('Phí tách được HNH xác nhận (đ)','charge');
  body+=select('KS / HNH xác nhận','sourceStatus',[['approved','Đồng ý phương án'],['waiting','Đang chờ / thiếu hồ sơ'],['refused','Không đồng ý']])+requiredField('Mã / nội dung xác nhận hoặc hồ sơ cần bổ sung','basis',customer()&&canSelf(o,k)?'API-DEMO: điều kiện mẫu':'' );
  if(!customer())body+=select('Điều kiện áp dụng','exception',[['no','Theo điều kiện thông thường'],['yes','Ngoại lệ đã thương lượng']])+area('Lý do ngoại lệ / phí trước–sau / phê duyệt nếu vượt quyền','exceptionReason');
  body+=field('Báo giá có hiệu lực đến','expires',new Date(Date.now()+30*60000-new Date().getTimezoneOffset()*60000).toISOString().slice(0,16),'datetime-local','required');
  show(workflowNames[k]+' · Kiểm tra phương án',body,'policy-plan','Lưu phương án');
  $('#f-sourceStatus').addEventListener('change',e=>{const required=e.target.value==='approved';$('#flow-form').querySelectorAll('input,textarea').forEach(x=>{if(!x.dataset.wasRequired&&x.required)x.dataset.wasRequired='yes';if(x.dataset.wasRequired==='yes'&&x.name!=='basis')x.required=required;});});
  if(k==='reduce'){
    $('#f-hotel').readOnly=true;$('#f-newCash').readOnly=true;$('#f-keepCash').readOnly=true;
    const update=()=>{const start=$('#f-start').value,end=$('#f-end').value,rooms=Number($('#f-rooms').value);$('#f-newCash').value=Math.max(0,Math.round(o.nightlyPrices.filter(p=>p.date>=start&&p.date<end).reduce((s,p)=>s+p.unit*rooms,0)-o.voucher-o.coins));};
    ['start','end','rooms'].forEach(n=>$('#f-'+n).addEventListener('input',update));update();

function invoiceJob(o,reason,data={}){
  const same=data.requestId&&o.invoiceJobs.find(x=>x.requestId===data.requestId&&x.reason===reason);
  if(same)return same;
  const j={id:newId('HDYC'),reason,status:'waiting',at:stamp(),originalId:o.invoiceDocuments[0]?.id||'',...data};
  o.invoiceJobs.unshift(j);return j;
}
function proposeRefund(o,amount,reason,data={}){
  if(!amount)return null;
  const existing=data.requestId&&o.refunds.find(f=>f.requestId===data.requestId);
  if(existing)return existing;
  if(amount>cashAvailable(o))throw new Error('Số tiền hoàn vượt phần còn được hoàn sau phí, chuyển tiền và khoản đã đề xuất.');
  const f={id:newId('RF'),policy:true,status:'draft',amount,maxAmount:amount,reason,scope:data.scope||reason,recipient:o.email,basis:data.basis||'',...data};
  o.refunds.push(f);return f;
}
function loyaltyCancellation(o,r){

      r.result='Đã cập nhật PNR '+v.pnr+' cho '+p.name+'. Các vé còn nguyên; tiếp tục đổi / hoàn / void bằng yêu cầu riêng.';
    }else r.result='HNH xác nhận xử lý theo vé, không cần tách. Tiếp tục nghiệp vụ trên vé đã chọn.';
  }
  if(['member','ssr','split'].includes(k)&&q.charge)invoiceJob(o,'Phí '+workflowNames[k],{requestId:r.id,amount:q.charge,basis:v.reference});
  r.applied=true;markDone(o,r,r.result||'Đã cập nhật kết quả nguồn và thông báo khách.');
}
