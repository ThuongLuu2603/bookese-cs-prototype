<body><div id="app"></div><dialog id="flow" aria-labelledby="flow-title"></dialog><div id="toast" role="status" aria-live="polite"></div><script>'use strict';
// Offline prototype: all outcomes are simulated. No API, message or money is sent.
const KEY='bookese-order-first-20261005-v1';
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>Number(v||0).toLocaleString('vi-VN')+' đ';
const stamp=()=>new Date().toLocaleString('vi-VN');
const demoDay='2026-10-05';
function seed(){
 const base={customer:'Nguyễn An',email:'an.demo@example.com',phone:'0900 000 001',created:demoDay,paidDate:demoDay,booking:'Thành công',payment:'Đã thu',service:'Có hiệu lực',requests:[],history:[],refunds:[],extras:[],invoice:null,reconfirmed:'',special:'',reward:'Đang chờ',source:'Extranet',paid:4200000,gross:4400000,voucher:0,coins:200000,member:'',name:'Nguyễn An',ttl:true};
 const hotel=(id,title)=>({...structuredClone(base),id,type:'hotel',title,start:'2026-10-12',end:'2026-10-14',room:'2 phòng Deluxe · 4 người lớn · Bữa sáng',contact:'Khách sạn Biển Xanh',hotelPhone:'0236 000 0123',hotelEmail:'reservation@example.com',supplierId:'KS-DEMO-2409',free:true});
 const flight=(id)=>({...structuredClone(base),id,type:'flight',title:'Hồ Chí Minh → Hà Nội',start:'2026-10-15',end:'2026-10-15',name:'NGUYEN AN',paid:990000,gross:1050000,voucher:50000,coins:10000,contact:'Hồng Ngọc Hà',source:'API',pnr:'DEMO26',ticket:'738-DEMO-00001',airline:'Vietnam Airlines',flight:'VN-DEMO',departure:'09:00',arrival:'11:10',baggage:'Xách tay 7 kg · Ký gửi 23 kg',seat:'Chưa chọn',supplierId:'DEMO26',free:false});
 const a=hotel('BK-2409','Khách sạn Biển Xanh'),b=flight('FL-0001'),c=hotel('BK-2410','Khách sạn Biển Xanh'),d=hotel('BK-2411','Khách sạn Biển Xanh'),e=flight('FL-0002');
 a.requests=[{id:'YC-101',kind:'change',stage:'new',note:'Khách muốn dời sang 15–17/10, giữ 2 phòng.',origin:'Khách hàng',at:stamp()}];
 b.requests=[{id:'YC-102',kind:'refund',stage:'new',note:'Khách cần hủy chuyến đi; xin kiểm tra điều kiện hoàn.',origin:'Khách hàng',at:stamp()}];
 c.requests=[{id:'YC-103',kind:'over',stage:'new',note:'Khách sạn báo hết phòng, cần tìm chỗ thay thế cho khách.',origin:'CS',at:stamp()}];
 d.booking='Đang xử lý';d.payment='Chưa xác minh';d.service='Đang giữ chỗ';d.requests=[{id:'YC-104',kind:'payment',stage:'new',note:'Khách báo đã bị trừ tiền nhưng booking chưa thành công.',origin:'Khách hàng',at:stamp()}];
 e.booking='Đang xử lý';e.service='Chưa xuất vé';e.requests=[{id:'YC-105',kind:'issue',stage:'new',note:'Đã thu tiền; chưa nhận số vé từ NCC.',origin:'Hệ thống',at:stamp()}];e.ticket='Chưa xuất';
 for(const o of [a,b,c,d,e])o.history=[{at:stamp(),actor:'Hệ thống',text:'Tạo dữ liệu booking minh họa; chưa kết nối hệ thống thật.'}];
 return {orders:[a,b,c,d,e],seq:110,mode:'cs',filter:'all',serviceFilter:'all'};
}
let state;try{state=JSON.parse(localStorage.getItem(KEY))||seed()}catch{state=seed()}
let route=location.hash.slice(1)||'list',query='',panel=null;
if(!state.orders.some(o=>o.id===route)&&route!=='list')route=/S12|S11/.test(route)?'FL-0001':'list';
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function current(){return state.orders.find(o=>o.id===route)||state.orders[0]}
function log(o,text){o.history.unshift({at:stamp(),actor:state.mode==='customer'?'Khách hàng':'CS · Minh Anh',text});save()}
function toast(text){$('#toast').textContent=text;$('#toast').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').style.display='none',3500)}
const customer=()=>state.mode==='customer';
const names={rename:'Đổi tên người lưu trú',cancel:'Hủy phòng',refund:'Hoàn theo điều kiện vé',change:'Đổi phòng / ngày lưu trú',over:'Tìm phòng thay thế',special:'Yêu cầu đặc biệt',invoice:'Thông tin hóa đơn',name:'Sửa / đổi tên hành khách',services:'Mua thêm dịch vụ',seat:'Chọn chỗ ngồi',exchange:'Đổi chuyến bay',member:'Bổ sung thẻ thành viên',void:'Void vé',split:'Tách PNR',ssr:'Hỗ trợ đặc biệt (SSR)',involuntary:'Hãng đổi / hủy chuyến',reroute:'Đổi hành trình / nâng hạng',partial:'Hoàn một phần',double:'Thanh toán trùng',chargeback:'Tra soát chargeback',issue:'Kiểm tra xuất dịch vụ',payment:'Tra soát thanh toán',complaint:'Sự cố trong / sau lưu trú',reconfirm:'Ghi chú xác nhận lại',note:'Ghi chú nội bộ'};
const titleKind=(k,o)=>k==='refund'&&o.type==='hotel'?'Kiểm tra / hoàn tiền':names[k]||k;
const btn=(text,action,cls='',more='')=>`<button type="button" class="${cls}" data-action="${action}" ${more}>${text}</button>`;
const tag=(text,tone='')=>`<span class="badge ${tone}">${esc(text)}</span>`;
const kv=(label,value)=>`<div class="kv"><span>${label}</span><span>${value}</span></div>`;
const card=(title,body)=>`<section class="card"><h2>${title}</h2>${body}</section>`;
const field=(label,name,value='',type='text',extra='')=>`<label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}>`;
const area=(label,name,value='',extra='')=>`<label for="f-${name}">${label}</label><textarea id="f-${name}" name="${name}" ${extra}>${esc(value)}</textarea>`;
const select=(label,name,options,value)=>`<label for="f-${name}">${label}</label><select id="f-${name}" name="${name}">${options.map(x=>{const [v,t]=Array.isArray(x)?x:[x,x];return `<option value="${esc(v)}" ${v===value?'selected':''}>${esc(t)}</option>`}).join('')}</select>`;
const check=text=>`<label class="check"><input type="checkbox" name="consent" required>${text}</label>`;
const info=(text,warn=false)=>`<div class="info ${warn?'warn':''}">${text}</div>`;
const stageLabel=r=>({new:'Cần xử lý',supplier:'Chờ NCC phản hồi',quoted:'Chờ khách đồng ý',payment:'Chờ khách thanh toán',ready:'Cần thực hiện',unknown:'Chưa rõ kết quả · cần tra cứu',refund:'Chờ trả tiền',done:'Đã xong',rejected:'Đã đóng'})[r.stage]||r.stage;
const openRequests=o=>o.requests.filter(r=>!['done','rejected'].includes(r.stage));
const needsCS=o=>openRequests(o).some(r=>['new','ready','unknown','refund'].includes(r.stage));
function goto(id){route=id;location.hash=id;render();window.scrollTo(0,0)}
function shell(body){return `<div class="demo"><div><b>PROTOTYPE · DỮ LIỆU MẪU</b><span>Không kết nối booking hoặc thanh toán thật</span></div><div>${btn(customer()?'Về Intranet CS':'Xem phía khách','mode')} ${btn('Đặt lại demo','reset')}</div></div>${customer()?`<div class="customer"><header class="topbar"><b class="logo">bookese</b><span class="muted">Lưu trú &nbsp;&nbsp;&nbsp; Vé máy bay &nbsp;&nbsp;&nbsp; Trải nghiệm</span><span>Nguyễn An (demo)</span></header><main class="main">${body}</main></div>`:`<div class="shell"><aside class="nav"><div class="logo">bookese</div><p>Quản lý booking</p>${btn('▤ &nbsp; Tất cả booking','all',state.serviceFilter==='all'?'active':'')}${btn('▣ &nbsp; Đặt phòng khách sạn','hotel',state.serviceFilter==='hotel'?'active':'')}${btn('✈ &nbsp; Đặt vé máy bay','flight',state.serviceFilter==='flight'?'active':'')}<div class="note">CS xử lý trực tiếp trên đơn.<br>Trường hợp khó: trao đổi với PS ngoài hệ thống, rồi cập nhật kết quả tại đây.</div></aside><div class="workspace"><header class="topbar"><span>Quản lý đặt chỗ</span><span><span class="avatar">MA</span>Minh Anh · CS</span></header><main class="main">${body}</main></div></div>`}`}
function list(){const orders=state.orders.filter(o=>(state.serviceFilter==='all'||o.type===state.serviceFilter)&&(!query||[o.id,o.name,o.title,o.customer,o.email].join(' ').toLowerCase().includes(query.toLowerCase()))&&(state.filter==='all'||state.filter==='todo'&&needsCS(o)||state.filter==='waiting'&&openRequests(o).some(r=>['supplier','quoted','payment'].includes(r.stage))));
 return `<div class="pagehead"><div><div class="eyebrow">${customer()?'Tài khoản / Lịch sử đặt chỗ':'Bookese / Quản lý booking'}</div><h1>${customer()?'Đặt chỗ của tôi':'Danh sách booking'}</h1><p class="muted">${customer()?'Xem thông tin, thay đổi hoặc yêu cầu hỗ trợ trên đơn của bạn.':'Mở đơn để xử lý. Thông tin và kết quả được cập nhật tại cùng một nơi.'}</p></div></div><section class="card"><div class="filters"><input id="search" aria-label="Tìm booking" placeholder="Tìm mã đơn, tên khách hoặc khách sạn…" value="${esc(query)}"><select id="service-filter" aria-label="Loại dịch vụ"><option value="all">Tất cả dịch vụ</option><option value="hotel" ${state.serviceFilter==='hotel'?'selected':''}>Khách sạn</option><option value="flight" ${state.serviceFilter==='flight'?'selected':''}>Vé máy bay</option></select></div>${customer()?'':`<div class="tabs">${[['all','Tất cả'],['todo','Cần xử lý'],['waiting','Đang chờ']].map(([v,t])=>btn(t+' <span class="count">'+state.orders.filter(o=>v==='all'||v==='todo'&&needsCS(o)||v==='waiting'&&openRequests(o).some(r=>['supplier','quoted','payment'].includes(r.stage))).length+'</span>','filter:'+v,state.filter===v?'active':'')).join('')}</div>`}<div class="table-wrap"><table><thead><tr><th>Booking / Khách</th><th>Dịch vụ</th><th>Ngày sử dụng</th><th>Kết quả đặt / Tình trạng đơn</th><th>${customer()?'Tiến độ hỗ trợ':'Việc cần xử lý'}</th><th></th></tr></thead><tbody>${orders.map(o=>`<tr><td><b>${btn(o.id,'open:'+o.id,'link')}</b>${esc(o.name)}</td><td><b>${esc(o.title)}</b><small>${o.type==='hotel'?'Khách sạn · '+o.source:'Vé máy bay · '+o.pnr}</small></td><td>${esc(o.start)}${o.type==='hotel'?'<br><small>đến '+o.end+'</small>':''}</td><td>${tag(o.booking,o.booking==='Thành công'?'good':'warn')}<p><small>${esc(o.service)}</small></p></td><td>${openRequests(o).length?openRequests(o).slice(0,2).map(r=>`<b>${esc(titleKind(r.kind,o))}</b><small>${stageLabel(r)}</small>`).join('<br>'):'<small>Không có việc đang chờ</small>'}</td><td>${btn('Mở đơn →','open:'+o.id,'link')}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Không có booking phù hợp.</td></tr>'}</tbody></table></div></section><p class="footnote">Kết quả đặt giữ ba trạng thái Thành công / Đang xử lý / Thất bại. Hủy, hoàn tiền, thay đổi và yêu cầu hỗ trợ được theo dõi riêng trên đơn.</p>`}
function actionsHTML(o){let main=o.type==='hotel'?[['rename','Đổi tên lưu trú'],['cancel','Hủy phòng'],['change',customer()?'Yêu cầu thay đổi':'Đổi phòng / ngày']]:[['services','Mua dịch vụ / chọn chỗ'],['exchange','Đổi chuyến bay'],['refund',customer()?'Yêu cầu hoàn vé':'Hoàn vé']];
 const extra=o.type==='hotel'?['special','over','refund','invoice','complaint','reconfirm','payment','note']:['name','member','void','split','ssr','involuntary','reroute','partial','double','chargeback','invoice','issue','payment','note'];
 const allowed=extra.filter(k=>!customer()||!['over','reconfirm','payment','note','issue','double','chargeback','void'].includes(k));
 if(o.service==='Đã hủy'||o.service==='Đã hoàn vé')main=[];
 return `<div class="actionbar">${main.map(([k,t],i)=>btn(t,'start:'+k,i===0?'primary':'')).join('')}<select id="other-action" aria-label="Thao tác khác"><option value="">${customer()?'Hỗ trợ khác…':'Thao tác khác…'}</option>${allowed.map(k=>`<option value="${k}">${esc(titleKind(k,o))}</option>`).join('')}</select></div>`}
function bookingInfo(o){if(o.type==='hotel')return card('Thông tin lưu trú',`<div class="trip"><b>${esc(o.title)}</b><p>${esc(o.room)}</p><div class="route"><div><small>Nhận phòng</small><b>${o.start.slice(8)}/${o.start.slice(5,7)}</b><small>Từ 14:00</small></div><div class="path">${Math.max(1,Math.round((new Date(o.end)-new Date(o.start))/86400000))} đêm</div><div><small>Trả phòng</small><b>${o.end.slice(8)}/${o.end.slice(5,7)}</b><small>Trước 12:00</small></div></div></div>${kv('Người nhận phòng','<b>'+esc(o.name)+'</b>')}${kv('Yêu cầu đặc biệt',esc(o.special||'Chưa có'))}${o.source==='Extranet'?kv('Xác nhận lại',esc(o.reconfirmed||'Chưa có ghi chú')+' <small>· Không bắt buộc</small>'):''}${o.replacedFrom?kv('Booking trước',esc(o.replacedFrom)+' · Đã hủy để thay thế'):''}`);
 return card('Chi tiết chuyến bay',`<div class="trip"><b>${esc(o.airline)}</b><p>${esc(o.title)} · ${esc(o.flight)}</p><div class="route"><div><small>${o.start}</small><b>${esc(o.departure)}</b><small>${esc(o.title.split(' → ')[0])}</small></div><div class="path">Bay thẳng · Phổ thông</div><div><small>${o.start}</small><b>${esc(o.arrival)}</b><small>${esc(o.title.split(' → ')[1])}</small></div></div></div>${kv('Hành khách','<b>'+esc(o.name)+'</b>')}${kv('PNR / Số vé',esc(o.pnr)+' / '+esc(o.ticket))}${kv('Hành lý',esc(o.baggage))}${kv('Chỗ ngồi',esc(o.seat))}${kv('Mua thêm',o.extras.map(esc).join(' · ')||'Chưa có')}${kv('Thẻ thành viên',esc(o.member||'Chưa bổ sung'))}${o.ssr?kv('Hỗ trợ đặc biệt',esc(o.ssr)):''}${o.split?kv('PNR sau tách',esc(o.split)):''}`)}
function tasks(o){const req=openRequests(o);return req.length?card(customer()?'Yêu cầu của bạn':'Cần xử lý trên đơn',req.map(r=>`<div class="task"><div class="line"><div><b>${esc(titleKind(r.kind,o))}</b><p>${esc(r.note||'Yêu cầu trên booking này')}</p><small>${r.id} · ${stageLabel(r)} · ${esc(r.origin)}</small></div>${btn(customer()?(r.stage==='quoted'?'Xem phương án':r.stage==='payment'?'Thanh toán':'Xem tiến độ'):'Tiếp tục →','request:'+r.id,needsCS(o)&&!customer()?'primary':'')}</div></div>`).join('')):''}
function detail(){const o=current();return `<div class="orderhead"><div class="eyebrow">${btn('← Danh sách booking','list','link')} &nbsp; / &nbsp; ${o.type==='hotel'?'Khách sạn':'Vé máy bay'}</div><div class="pagehead"><div><h1>${o.id} <span style="font-size:14px;font-weight:400;color:#73808e">${o.type==='flight'?'PNR '+esc(o.pnr):esc(o.title)}</span></h1><span class="muted">${esc(o.customer)} · ${esc(o.email)}</span></div>${!customer()?btn('Xem phía khách ↗','mode'):''}</div><div class="statusline"><span><small>Kết quả đặt</small>${tag(o.booking,o.booking==='Thành công'?'good':'warn')}</span><span><small>Dịch vụ</small>${tag(o.service)}</span><span><small>Thanh toán</small>${tag(o.payment,o.payment==='Đã thu'?'good':'warn')}</span><span><small>Hoàn tiền</small>${tag(o.refunds.length?o.refunds.every(r=>r.status==='done')?'Đã hoàn':'Đang xử lý':'Chưa phát sinh',o.refunds.some(r=>r.status!=='done')?'warn':'')}</span></div></div>${!customer()?actionsHTML(o):''}<div class="detailgrid"><div>${tasks(o)}${bookingInfo(o)}${card(o.type==='flight'?'Điều kiện vé':'Điều kiện đặt phòng',o.type==='flight'?`<p>Đổi chuyến: kiểm tra phí và chênh lệch theo báo giá mới từ hãng.</p><p>Hoàn vé: Bookese kiểm tra điều kiện, báo phí và số tiền hoàn trước khi thực hiện.</p><p>Sửa tên: gửi yêu cầu cho Bookese; điều kiện và phí cần Hồng Ngọc Hà xác nhận.</p><small>Điều kiện minh họa. Bản thật sử dụng điều kiện đã mua và phản hồi API của từng vé.</small>`:`<p>${o.free?'Đơn mẫu đang trong điều kiện hủy miễn phí.':'Đơn mẫu áp dụng phí hủy; cần kiểm tra trước khi xác nhận.'}</p><p>Đổi phòng / ngày / khách sạn: gửi Bookese kiểm tra và báo phương án. Chỉ đổi cùng giá hoặc cao hơn theo chính sách Bookese.</p><small>Giữ chỗ mới → khách thanh toán phần thêm → hủy cũ miễn phí → xuất mới.</small>`)}<details><summary>Lịch sử đơn · ${o.history.length} cập nhật</summary><div class="card history">${o.history.map(h=>`<p>${esc(h.text)}<small>${esc(h.at)} · ${esc(h.actor)}</small></p>`).join('')}</div></details><details><summary>Yêu cầu đã hoàn tất · ${o.requests.filter(r=>['done','rejected'].includes(r.stage)).length}</summary><div>${o.requests.filter(r=>['done','rejected'].includes(r.stage)).map(r=>`<p>${esc(titleKind(r.kind,o))} · ${stageLabel(r)}<br><small>${esc(r.result||'')}</small></p>`).join('')||'<p>Chưa có yêu cầu đã hoàn tất.</p>'}</div></details></div><div>${customer()?card('Quản lý đặt chỗ',actionsHTML(o)+`<small>Sửa tên vé và hoàn vé là yêu cầu gửi Bookese. Vé chưa thay đổi khi gửi yêu cầu.</small>`):''}${moneyCard(o)}${card(customer()?'Thông tin liên hệ':'Khách hàng & nhà cung cấp',`${kv('Tài khoản đặt',esc(o.customer)+'<br>'+esc(o.email))}${kv('Điện thoại',esc(o.phone))}${!customer()?btn('Xem thông tin tài khoản','account','link'):''}${o.type==='hotel'?kv('Khách sạn',esc(o.contact)+'<br>'+esc(o.hotelPhone)+'<br>'+esc(o.hotelEmail)):kv('NCC','Hồng Ngọc Hà · API / hỗ trợ nghiệp vụ')}`)}${card('Thông tin hóa đơn',o.invoice?`<p><b>${esc(o.invoice.company)}</b></p><p>${esc(o.invoice.tax)}</p><small>${esc(o.invoice.email)}<br>${esc(o.invoice.status)}</small>`:`<p class="muted">Chưa bổ sung</p>${btn('Bổ sung thông tin','start:invoice','link')}<p><small>Yêu cầu xuất trong ngày thanh toán: ${o.paidDate}.</small></p>`)}</div></div><p class="footnote">Dữ liệu mẫu lưu trong trình duyệt. Các kết quả API, đồng bộ khách sạn và thanh toán đều là mô phỏng.</p>`}
function moneyCard(o){const refunded=o.refunds.filter(r=>r.status==='done').reduce((a,r)=>a+r.amount,0);return card('Thanh toán',`<div class="summaryrow"><span>Giá ${o.type==='flight'?'vé, thuế và phí xuất vé':'dịch vụ'}</span><span class="money">${money(o.gross)}</span></div><div class="summaryrow"><span>Voucher</span><span>− ${money(o.voucher)}</span></div><div class="summaryrow"><span>Xu đã sử dụng</span><span>${o.coins.toLocaleString('vi-VN')} xu</span></div><div class="summaryrow total"><span>Khách đã trả</span><span>${money(o.paid)}</span></div>${o.extraPaid?`<div class="summaryrow"><span>Đã thu bổ sung</span><b>${money(o.extraPaid)}</b></div>`:''}${refunded?`<div class="summaryrow"><span>Đã trả lại khách</span><b>${money(refunded)}</b></div>`:''}${o.refunds.filter(r=>r.status!=='done').map(r=>`<div class="task"><b>Còn phải hoàn ${money(r.amount)}</b><p>${r.status==='pending'?'Đã gửi lệnh · chờ kết quả':'CS xác nhận và trả tiền'}</p>${customer()?tag('Bookese đang xử lý','warn'):btn('Xử lý hoàn tiền','money:'+r.id,'link')}</div>`).join('')}<details><summary>Xu thưởng & ưu đãi</summary><div><p>${esc(o.reward)}</p><small>Khi hoàn: voucher và xu đã dùng không trả lại; hủy / thu hồi xu thưởng của đơn.</small></div></details>`)}
function render(){ $('#app').innerHTML=shell(route==='list'?list():detail());$('#service-filter')?.addEventListener('change',e=>{state.serviceFilter=e.target.value;save();render()});$('#search')?.addEventListener('input',e=>{query=e.target.value;const pos=e.target.selectionStart;render();$('#search').focus();$('#search').setSelectionRange(pos,pos)});$('#other-action')?.addEventListener('change',e=>{if(e.target.value)start(e.target.value)}); }
function show(title,body,formAction='',label='Tiếp tục'){const o=current();$('#flow').innerHTML=`<div class="modalhead"><div><h2 id="flow-title">${esc(title)}</h2><small>${esc(o.id)} · ${esc(o.name)}${o.type==='flight'?' · '+esc(o.ticket):''}</small></div>${btn('×','close','close','aria-label="Đóng"')}</div><div class="modalbody">${formAction?`<form id="flow-form" data-submit="${formAction}"><div id="form-error" role="alert"></div>${body}<div class="buttons">${btn('Quay lại','close')}<button class="primary" type="submit">${label}</button></div></form>`:body}</div>`;if(!$('#flow').open)$('#flow').showModal(); }
function error(text){const x=$('#form-error');if(x)x.innerHTML=`<div class="error">${esc(text)}</div>`;else toast(text);return false}
function close(){ $('#flow').close();panel=null;render() }
function request(o,kind,data={}){const duplicate=openRequests(o).find(r=>r.kind===kind);if(duplicate)return duplicate;const r={id:'YC-'+(++state.seq),kind,stage:'new',origin:customer()?'Khách hàng':'CS',at:stamp(),...data};o.requests.unshift(r);log(o,'Tạo yêu cầu '+titleKind(kind,o)+' · '+r.id);return r}
function finish(o,r,text){r.stage='done';r.result=text;log(o,text);close();toast('Đã cập nhật đơn và lịch sử xử lý.')}
function start(kind){const o=current();if(['services','seat','exchange'].includes(kind)&&o.type==='flight'&&(o.booking!=='Thành công'||o.ticket==='Chưa xuất'))return toast('Vé chưa được xuất. Cần kiểm tra xuất vé trước khi mua thêm / đổi.');if(['Đã hủy','Đã hoàn vé'].includes(o.service)&&!['refund','invoice','note','complaint','payment','double','chargeback'].includes(kind))return toast('Dịch vụ này đã kết thúc; không thể thay đổi tiếp.');const existing=openRequests(o).find(r=>r.kind===kind);if(existing)return openRequest(existing.id);if(kind==='refund'&&o.refunds.some(x=>x.status!=='done'))return refundMoney(o.refunds.find(x=>x.status!=='done').id);panel={kind,step:'start'};
 if(customer()&&!(o.type==='hotel'&&['rename','cancel'].includes(kind))&&!['services','seat','exchange','invoice'].includes(kind))return customerRequest(kind);
 if(kind==='rename')return show('Đổi tên người lưu trú',field('Tên hiện tại','old',o.name,'text','readonly')+field('Tên người nhận phòng mới','name',o.name,'text','required')+info('Lưu thành công sẽ cập nhật trên đơn, đồng bộ sang Extranet và gửi thông tin đến khách sạn.')+check('Tôi đã kiểm tra tên người nhận phòng mới.'),'rename','Lưu & cập nhật khách sạn');
 if(kind==='invoice')return show('Thông tin xuất hóa đơn',field('Tên công ty / người mua','company',o.invoice?.company||'','text','required')+field('Mã số thuế','tax',o.invoice?.tax||'','text','required')+field('Địa chỉ','address',o.invoice?.address||'','text','required')+field('Email nhận hóa đơn','email',o.invoice?.email||o.email,'email','required')+info('Ngày thanh toán: '+o.paidDate+'. Thông tin gửi sau ngày này được chuyển kiểm tra, không tự xác nhận hóa đơn đã xuất.'),'invoice','Lưu thông tin hóa đơn');
 if(kind==='reconfirm'||kind==='note')return show(titleKind(kind,o),area(kind==='note'?'Nội dung ghi chú':'Ghi chú xác nhận lại (không bắt buộc)','note',kind==='reconfirm'?o.reconfirmed:'')+info(kind==='note'?'Có thể ghi kết quả trao đổi offline với PS tại đây. Không chuyển ca hoặc tạo bước chờ PS.':o.source==='Extranet'?'Khách sạn có thể nhập hoặc để trống cột xác nhận lại trên Extranet.':'Nguồn API: CS có thể ghi kết quả gọi kiểm tra với khách sạn.'),kind,'Lưu ghi chú');
 if(['change','over','exchange','services','seat'].includes(kind))return configure(kind);
 if(kind==='cancel'||kind==='refund'||kind==='partial')return refundStart(kind);
 if(kind==='payment'||kind==='issue')return paymentStart(kind);
 return manualStart(kind);
}
function customerRequest(kind){const o=current();show('Yêu cầu '+titleKind(kind,o).toLowerCase(),(kind==='name'?field('Tên đề nghị theo giấy tờ','newName','','text','required'):'')+area('Nội dung cần Bookese hỗ trợ','note','','required')+info('Gửi yêu cầu chưa thay đổi thông tin đơn, chưa hủy dịch vụ và chưa hoàn tiền. Bookese sẽ kiểm tra và phản hồi trên booking.')+check('Tôi đồng ý gửi yêu cầu này cho Bookese.'),'customer-request','Gửi yêu cầu');}
function configure(kind,r){const o=current();panel={kind,requestId:r?.id,step:'configure'};
 if(kind==='services')return show('Mua thêm dịch vụ',`<p><b>${esc(o.name)}</b> · ${esc(o.title)}</p><p class="muted">Đã có: ${esc(o.baggage)} · Ghế ${esc(o.seat)}</p>${select('Hành lý mua thêm','bag',[['0','Không mua thêm'],['250000','Thêm 10 kg · 250.000 đ'],['400000','Thêm 20 kg · 400.000 đ']],'0')}${select('Suất ăn','meal',[['0','Không mua thêm'],['80000','Suất ăn tiêu chuẩn · 80.000 đ']],'0')}${select('Chỗ ngồi','seat',[['','Giữ nguyên'],['6A','6A · Cửa sổ · 120.000 đ'],['6C','6C · Lối đi · 100.000 đ'],['7B','7B · Ghế giữa · 60.000 đ']],'')}${btn('Xem sơ đồ ghế','seatmap','link')}${info('Giá bán mẫu đã gồm phần cộng giá của Bookese; không thêm phí xử lý. Gói khả dụng và hạn mua lấy theo hãng.')}`,'quote-services','Kiểm tra giá & tiếp tục');
 if(kind==='seat')return seatmap();
 const hotel=o.type==='hotel';show(titleKind(kind,o),`<div class="step">1 · Chọn phương án mới</div>${hotel?select('Nhu cầu','scope',[['dates','Đổi ngày lưu trú'],['room','Đổi hạng phòng / thêm phòng'],['hotel','Đổi khách sạn']],kind==='over'?'hotel':'dates'):info('Đổi ngày / giờ trên cùng hành trình. Đổi hành trình hoặc nâng hạng: chọn nghiệp vụ hỗ trợ tương ứng.')}<div class="formgrid"><div>${field(hotel?'Ngày nhận phòng mới':'Ngày bay mới','start',hotel?'2026-10-15':'2026-10-18','date','required min="2026-10-05"')}</div>${hotel?`<div>${field('Ngày trả phòng mới','end','2026-10-17','date','required min="2026-10-06"')}</div>`:''}</div>${hotel?select('Số phòng','rooms',[['2','2 phòng'],['3','3 phòng'],['4','4 phòng']],'2'):''}${kind==='over'?info('CS tìm phòng trên Bookese và chốt với khách. Có thể nhờ PS hỗ trợ offline khi cần; ghi lại phương án đã thống nhất.'):''}`,'search-options','Kiểm tra phòng / chuyến khả dụng');}
function seatmap(){const o=current();panel={kind:'services',step:'seatmap'};show('Chọn chỗ ngồi',`<p>${esc(o.name)} · ${esc(o.title)}</p><small>Giá ghế mẫu 120.000 đ · Ghế xám đã có người</small><div class="seatgrid">${Array.from({length:6},(_,i)=>['A','B','C','aisle','D','E','F'].map(c=>c==='aisle'?'<span class="aisle"></span>':btn((i+5)+c,'pickseat:'+(i+5)+c,'',i===0&&c==='A'?'disabled aria-label="5A đã có người"':'')).join('')).join('')}</div><p class="muted">Chọn ghế để kiểm tra giá và tiếp tục thanh toán.</p>`)}

 if(['change','over'].includes(kind)){if(!o.free&&kind==='change')return error('Chưa có xác nhận hủy cũ miễn phí. Cần thống nhất ngoại lệ trước.');o.replacedFrom=o.supplierId;o.supplierId='KS-NEW-'+r.id;o.start=r.selection.start;o.end=r.selection.end;o.room=r.selection.rooms+' phòng '+(r.selection.option==='1'?'Premium':'Deluxe')+' · Bữa sáng';if(r.selection.scope==='hotel'||kind==='over')o.title=r.selection.option==='1'?'Khách sạn Biển Xanh':'Khách sạn Ánh Dương';o.contact=o.title;o.service='Đã đổi · Có hiệu lực';}

 if(kind==='services'){if(r.selection.bag&&Number(r.selection.bag)>0)o.extras.push(Number(r.selection.bag)===250000?'Hành lý thêm 10 kg':'Hành lý thêm 20 kg');if(Number(r.selection.meal)>0)o.extras.push('Suất ăn tiêu chuẩn');if(r.selection.seat)o.seat=r.selection.seat;}
 if(kind==='name')o.name=v.confirmedName;if(kind==='member')o.member=v.member;if(kind==='split')o.split=v.split;if(kind==='ssr')o.ssr=v.result;if(kind==='special')o.special=v.result;
 if(kind==='issue'||kind==='payment'){if(o.payment!=='Đã thu'||!o.ttl)return error('Cần xác minh đã nhận tiền và giữ chỗ còn hạn trước khi xuất.');o.booking='Thành công';o.service=o.type==='hotel'?'Có hiệu lực':'Đã xuất vé';if(o.type==='flight')o.ticket='738-DEMO-ISSUED';}
 finish(o,r,'Hoàn tất '+titleKind(kind,o)+': '+(v.result||r.quote?.description||'đã cập nhật booking')+(v.proof?' · '+v.proof:''));
}
document.addEventListener('submit',e=>{if(e.target.id!=='flow-form')return;e.preventDefault();const v=Object.fromEntries(new FormData(e.target)),action=e.target.dataset.submit,o=current(),r=o.requests.find(x=>x.id===panel?.requestId),kind=panel?.kind;
 if(action==='rename'){if(!v.name.trim())return error('Nhập tên người lưu trú.');o.name=v.name.trim();log(o,'Đổi tên lưu trú thành '+o.name+'; đã đồng bộ Extranet và thông báo khách sạn (mẫu).');close();return toast('Đã cập nhật tên trên đơn và khách sạn.');}
 if(action==='invoice'){o.invoice={...v,status:o.paidDate===demoDay?'Đã nhận · chờ xuất trong ngày thanh toán':'Gửi sau ngày thanh toán · cần kiểm tra'};log(o,'Cập nhật thông tin hóa đơn: '+v.company);close();return toast('Đã lưu thông tin hóa đơn vào đơn.');}
 if(action==='reconfirm'||action==='note'){if(action==='reconfirm')o.reconfirmed=v.note;log(o,(action==='reconfirm'?'Xác nhận lại: ':'Ghi chú: ')+v.note);close();return}
 if(action==='customer-request'){request(o,kind,{note:v.note,newName:v.newName});close();return toast('Đã gửi yêu cầu cho CS. Booking hiện tại chưa thay đổi.');}
 if(action==='search-options'){if(v.end&&v.end<=v.start)return error('Ngày trả phòng phải sau ngày nhận phòng.');showOptions(v);return}
 if(action==='select-option'){const rr=r||request(o,kind);rr.selection={...panel.data,option:v.option};rr.quote={net:v.option==='1'?600000:300000,fee:o.type==='flight'?50000:0,expires:Date.now()+15*60000,description:o.type==='hotel'?'Đã kiểm tra phòng mới; booking cũ được giữ tới khi hoàn thành đổi.':'Đổi chuyến cùng hành trình; ghế/dịch vụ cũ kiểm tra theo phản hồi hãng.'};rr.quote.total=rr.quote.net+rr.quote.fee;rr.stage='quoted';log(o,'Đã lập phương án '+titleKind(kind,o));if(kind==='over'){panel={kind,requestId:rr.id};return show('Chi phí phòng thay thế',field('Phần chênh lệch (đ)','net',rr.quote.net,'number','readonly')+select('Bên chịu phần chênh lệch','payer',[['hotel','Khách sạn chịu'],['bookese','Bookese hỗ trợ'],['customer','Khách đồng ý trả thêm']],'hotel')+field('Căn cứ thống nhất chi phí','basis','','text','required')+info('Không mặc định bắt khách trả phần chênh lệch do overbooking.'),'over-cost','Lưu phương án')};quoteView(rr);return}
 if(action==='over-cost'){r.quote.payer=v.payer;r.quote.basis=v.basis;r.quote.absorb=v.payer==='customer'?0:r.quote.net;r.quote.total=v.payer==='customer'?r.quote.net:0;save();return quoteView(r)}
 if(action==='quote-services'){const seatFee=v.seat?(v.seat==='6C'?100000:v.seat==='7B'?60000:120000):0,total=Number(v.bag)+Number(v.meal)+seatFee;if(!total)return error('Chọn ít nhất một dịch vụ hoặc ghế.');const rr=r||request(o,'services');rr.selection=v;rr.quote={net:total,total,fee:0,ancillary:true,expires:Date.now()+15*60000,description:'Dịch vụ cho '+o.name+' · '+o.title};rr.stage='quoted';save();return quoteView(rr)}
 if(action==='refund-check'){if(v.eligibility!=='allowed'){const rr=r||request(o,kind,{note:'Cần kiểm tra điều kiện hoàn/hủy.'});rr.stage='new';save();return show('Cần kiểm tra thêm',info(v.eligibility==='denied'?'Điều kiện hiện tại không cho hoàn/hủy. CS cần hỏi khách sạn / nguồn vé về ngoại lệ.':'Chưa có kết quả NCC. Giữ nguyên dịch vụ và chưa tạo khoản hoàn.',true)+btn('Đóng','close'))}if(customer()&&o.type==='hotel'){const rr=r||request(o,'cancel');rr.scope=v.scope;rr.quote={base:o.paid,penalty:o.free?0:Math.floor(o.paid*.5),fee:0,refund:o.free?o.paid:Math.floor(o.paid*.5)};rr.stage='quoted';save();return quoteView(rr)}return refundQuoteForm(kind,r,v.scope)}
 if(action==='save-refund-quote'){const base=Number(v.base),penalty=Number(v.penalty),fee=Number(v.fee);if(penalty+fee>base)return error('Tổng phí không được lớn hơn phần tiền được xét hoàn.');const remaining=o.paid-o.refunds.reduce((s,x)=>s+x.amount,0);if(base-penalty-fee>remaining)return error('Số hoàn vượt tiền còn có thể hoàn.');const rr=r||request(o,kind);rr.scope=panel.scope;rr.quote={base,penalty,fee,refund:base-penalty-fee,basis:v.basis};rr.stage='quoted';log(o,'Lập phương án hoàn '+money(rr.quote.refund)+' · '+v.basis);return quoteView(rr)}
 if(action==='accept-quote'){if(r.quote.expires&&Date.now()>r.quote.expires)return error('Phương án đã hết hạn. Đóng và kiểm tra lại giá/giữ chỗ.');r.accepted=true;r.acceptedRef=v.reference||'Xác nhận trên booking';log(o,'Khách đồng ý phương án '+r.id);if(r.quote.total>0){r.stage='payment';save();return paymentView(r)}r.stage='ready';save();if(customer()&&o.type==='hotel'&&r.kind==='cancel'){applyExecution(o,r,{outcome:'ok'});return}if(customer()&&!['exchange','services'].includes(r.kind)){close();toast('Đã gửi đồng ý cho CS thực hiện.');return}executeView(r);return}
 if(action==='manual-send'){const rr=r||request(o,kind);Object.assign(rr,v,{stage:'supplier'});log(o,'Đã ghi nhận trao đổi nguồn: '+titleKind(kind,o));close();return toast('Đã lưu. Khi có phản hồi, mở yêu cầu để tiếp tục.');}
 if(action==='supplier-response'){if(v.decision==='no'){r.stage='rejected';r.result=v.response;log(o,'NCC không hỗ trợ '+titleKind(r.kind,o)+': '+v.response);close();return}const net=Number(v.net),fee=Number(v.fee);if(net===0&&fee===0&&['member','special','ssr'].includes(r.kind)){if(r.kind==='member')o.member=r.member;if(r.kind==='special')o.special=v.response;if(r.kind==='ssr')o.ssr=v.response;return finish(o,r,'Đã xác nhận '+titleKind(r.kind,o)+' · '+v.response+' · '+v.proof)}if(v.refundBase!==undefined&&Number(v.refundBase)>0&&net>0)return error('Phương án đang có cả thu thêm và hoàn; cần tách khoản rõ ràng.');r.quote={net,fee,total:net+fee,description:v.response,proof:v.proof};if(v.refundBase!==undefined&&Number(v.refundBase)>0){if(fee>Number(v.refundBase))return error('Phí xử lý vượt tiền hoàn.');Object.assign(r.quote,{base:Number(v.refundBase),penalty:0,refund:Number(v.refundBase)-fee,total:0})}r.stage='quoted';save();return quoteView(r)}
 if(action==='execute'){applyExecution(o,r,v);return}
 if(action==='payment-check'){const rr=r||request(o,kind);rr.trace=v.proof;if(['pending','unknown'].includes(v.result)){rr.stage='new';log(o,'Tra cứu chưa có kết quả · '+v.proof);return show('Chưa có kết quả xác định',info('Giữ nguyên booking. Tiếp tục đối chiếu cổng thanh toán / Kế toán hoặc NCC; chưa yêu cầu khách trả lần nữa.',true)+btn('Quay về đơn','close'))}if(v.result==='notReceived'){rr.stage='done';o.payment='Chưa thu';rr.result='Đã xác minh chưa nhận tiền · '+v.proof;log(o,rr.result);close();return}if(v.result==='received'){o.payment='Đã thu';log(o,'Đã xác minh tiền nhận · SCT '+v.proof)}if(v.result==='issued'){o.booking='Thành công';o.service=o.type==='hotel'?'Có hiệu lực':'Đã xuất vé';if(o.type==='flight')o.ticket='738-RECOVERED';return finish(o,rr,'Tra cứu NCC đã xuất thành công · cập nhật đơn, không xuất lại.')}if(v.result==='expired'||!o.ttl){rr.stage='new';log(o,'Giữ chỗ hết hạn; không được xuất theo giá cũ.');return show('Giữ chỗ đã hết hạn',info('Thống nhất với khách: tìm lại dịch vụ hoặc hoàn tiền đã nhận. Chưa được xuất lại chỗ cũ.',true)+`<div class="buttons">${btn('Tìm lại dịch vụ','recover:'+rr.id,'primary')}${btn('Lập phương án hoàn','recover-refund:'+rr.id)}</div>`)}rr.stage='ready';save();return executeView(rr)}
 if(action==='refund-money'){const rf=o.refunds.find(x=>x.id===panel.refundId);if(rf.status==='done')return error('Khoản này đã hoàn thành.');if(v.outcome==='fail'){log(o,'Giao dịch hoàn thất bại; chưa trừ số tiền phải hoàn.');return error('Chưa hoàn thành. Kiểm tra nguyên nhân rồi thực hiện lại.')}rf.method=v.method||rf.method;rf.proof=v.proof||rf.proof;rf.status=v.outcome==='pending'?'pending':'done';const rr=o.requests.find(x=>x.id===rf.requestId);if(rf.status==='done'){rr.stage='done';rr.result='Đã hoàn '+money(rf.amount)+' · '+rf.method+' · '+rf.proof}log(o,(rf.status==='done'?'Hoàn tiền thành công ':'Đã gửi lệnh hoàn; chờ kết quả ')+money(rf.amount));close();return toast(rf.status==='done'?'Đã cập nhật số tiền hoàn trên đơn.':'Đang chờ kết quả, không phát lệnh hoàn trùng.');}
});
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const [a,...parts]=el.dataset.action.split(':'),id=parts.join(':'),o=current();
 if(a==='open')return goto(id);if(a==='list')return goto('list');if(a==='close')return close();if(a==='mode'){state.mode=customer()?'cs':'customer';state.filter='all';save();return render()}if(a==='all'||a==='hotel'||a==='flight'){state.serviceFilter=a;save();return goto('list')}if(a==='filter'){state.filter=id;save();return render()}if(a==='start')return start(id);if(a==='request')return openRequest(id);if(a==='money')return refundMoney(id);
 if(a==='reset'){show('Đặt lại dữ liệu mẫu',info('Các thao tác demo đã lưu trong trình duyệt sẽ được xóa. Không ảnh hưởng hệ thống thật.')+`<div class="buttons">${btn('Giữ dữ liệu','close')}${btn('Đặt lại demo','reset-confirm','primary')}</div>`);return}if(a==='reset-confirm'){state=seed();save();close();return goto('list')}
 if(a==='account')return show('Tài khoản đặt booking',kv('Họ tên',esc(o.customer))+kv('Email',esc(o.email))+kv('Số điện thoại',esc(o.phone))+btn('Xem booking từ phía khách','account-customer','primary'));if(a==='account-customer'){close();state.mode='customer';save();return render()}
 if(a==='seatmap')return seatmap();if(a==='pickseat'){const rr=request(o,'services');rr.selection={bag:'0',meal:'0',seat:id};rr.quote={net:120000,total:120000,fee:0,ancillary:true,expires:Date.now()+15*60000,description:'Ghế '+id+' · '+o.name};rr.stage='quoted';save();return quoteView(rr)}
 if(a==='payment-preview'){return toast('Link mẫu PAY-'+panel.requestId+' — không tạo thanh toán thật.')}
 if(a==='paid'){const r=o.requests.find(x=>x.id===id);if(r.stage!=='payment')return;if(r.quote.expires&&Date.now()>r.quote.expires)return toast('Giữ chỗ / báo giá đã hết hạn. Cần kiểm tra lại.');r.paid=true;r.paymentRef='DEMO-PAY-'+id;r.stage='ready';o.extraPaid=(o.extraPaid||0)+r.quote.total;log(o,'Đã nhận tiền bổ sung '+money(r.quote.total)+' · '+r.paymentRef);if(customer()&&['services','exchange'].includes(r.kind))return applyExecution(o,r,{outcome:'ok'});return executeView(r)}
 if(a==='decline'){const r=o.requests.find(x=>x.id===id);r.stage='rejected';r.result='Không tiếp tục phương án; giữ nguyên dịch vụ hiện tại.';log(o,r.result);close();return}
 if(a==='revise'){const r=o.requests.find(x=>x.id===id);if(r.paid)return toast('Đã thu tiền; cần kiểm tra khoản thu trước khi đổi phương án.');r.stage=['name','member','void','split','ssr','involuntary','reroute','special','complaint'].includes(r.kind)?'supplier':'new';save();return openRequest(r.id)}
 if(a==='expire'){const r=o.requests.find(x=>x.id===id);r.stage='new';r.quote=null;log(o,'Thanh toán chưa hoàn tất / giữ chỗ mới hết hạn. Giữ booking cũ.');close();return toast('Booking cũ còn nguyên. Kiểm tra lại phương án khi khách tiếp tục.');}
 if(a==='recover'||a==='recover-refund'){const r=o.requests.find(x=>x.id===id);r.stage='done';r.result='Chuyển phương án theo trao đổi với khách';log(o,r.result);close();return start(a==='recover'?(o.type==='hotel'?'over':'exchange'):'refund')}
});
window.addEventListener('hashchange',()=>{route=location.hash.slice(1)||'list';if(!state.orders.some(o=>o.id===route)&&route!=='list')route='list';render()});
$('#flow').addEventListener('cancel',()=>{panel=null;render()});
save();render();
</script></body></html>
