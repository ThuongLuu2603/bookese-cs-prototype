</style><body><div id="demo"></div><div id="app"></div><dialog id="dialog"></dialog><div id="toast" role="status"></div><script>/* Bookese CS — editable, local-only prototype. No backend or payment calls. */
const screens={S01:'Danh sách đặt phòng',S02:'Chi tiết đặt phòng',S03:'Thanh toán & tra soát',S04:'Reconfirm với khách sạn',S05:'Yêu cầu hỗ trợ',S06:'Phương án thay thế',S07:'Đổi thông tin booking',S08:'Hủy & xin miễn phí',S09:'Hoàn tiền & xu',S10:'Lịch sử xử lý',S11:'Danh sách vé máy bay',S12:'Chi tiết vé & Hồng Ngọc Hà',S13:'Khách hàng • Lịch sử đặt chỗ',S14:'Khách hàng • Chi tiết booking',S15:'Khách hàng • Hủy miễn phí',S16:'Extranet • Xác nhận booking'};
const money=n=>new Intl.NumberFormat('vi-VN').format(n)+' đ';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seed=()=>({role:'CS',activeBooking:'BK-DEMO-2409',scenario:'success',reconfirm:false,request:null,alternative:null,change:null,cancel:null,refund:null,logs:[],updated:'24/09/2026 10:00',guestConsent:false});
let st;try{st=JSON.parse(localStorage.getItem('bookese-cs-prototype-v1'))||seed()}catch{st=seed()}
let screen=location.hash.slice(1)||'S01';
function save(){localStorage.setItem('bookese-cs-prototype-v1',JSON.stringify(st))}
function log(t){st.logs.unshift({time:new Date().toLocaleString('vi-VN'),actor:st.role,text:t});save()}
function toast(t){const e=document.querySelector('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',4500)}
function go(s){if(location.hash==='#'+s)render();else location.hash=s}
function badge(t,k=''){return `<span class="badge ${k}">${esc(t)}</span>`}
function field(label,id,type='text',value='',hint='',required=false){return `<div class="field"><label for="${id}" class="${required?'required':''}">${label}</label><input id="${id}" name="${id}" type="${type}" value="${esc(value)}" ${required?'required':''}><small>${hint}</small></div>`}
function select(label,id,values,selected){return `<div class="field"><label for="${id}">${label}</label><select id="${id}" name="${id}">${values.map(v=>`<option ${v===selected?'selected':''}>${esc(v)}</option>`).join('')}</select></div>`}
function textfield(label,id,value='',required=false){return `<div class="field full"><label for="${id}" class="${required?'required':''}">${label}</label><textarea id="${id}" name="${id}" ${required?'required':''}>${esc(value)}</textarea></div>`}
function tick(label,id,checked=false){return `<label class="tick"><input id="${id}" name="${id}" type="checkbox" ${checked?'checked':''}> <span>${label}</span></label>`}
function btn(label,action,cls='',disabled=false){return `<button type="button" class="${cls}" data-action="${action}" ${disabled?'disabled':''}>${label}</button>`}
function link(label,s){return `<a href="#${s}">${label}</a>`}
function alert(t,cls=''){return `<div class="alert ${cls}">${t}</div>`}
function card(title,body){return `<section class="card"><h2>${title}</h2>${body}</section>`}

function applyPaymentSnapshot(key){
 const p=traceState();if(!paymentOutcomes[key])return false;
 // Late results never revive a cancelled/refunded or previously failed booking.
 if((st.cancel||st.refund||(st.scenario==='failed'&&key==='success'))&&key!=='conflict')key='conflict';
 if(st.scenario==='pendingncc'&&['unknown','unsynced','debit'].includes(key))key='conflict';
 if(st.scenario==='success'&&['unknown','unsynced','debit','ncc','failedpaid'].includes(key))key='conflict';
 p.result=key;p.checkedAt=new Date().toLocaleString('vi-VN');st.updated=p.checkedAt;
 if(key==='success')st.scenario='success';
 if(key==='ncc')st.scenario='pendingncc';
 if(key==='failedpaid')st.scenario='failed';
 log('Tra cứu mô phỏng: '+paymentOutcomes[key].label+' · không phát lệnh thu / xuất / hoàn');return true;
}
function bindPaymentActions(){
 actions.retrieve=()=>{const label=document.querySelector('#mock-payment')?.value;const key=Object.keys(paymentOutcomes).find(k=>paymentOutcomes[k].label===label);if(applyPaymentSnapshot(key)){render();toast('Đã có kết quả. Xem mục 2: Việc CS cần làm tiếp.')}};
 submits.trace=v=>{if(!(Number(v['trace-amount'])>0))return toast('Số tiền phải lớn hơn 0.');if(!v['trace-due']||new Date(v['trace-due'])<=new Date())return toast('Chọn thời gian hẹn phản hồi khách trong tương lai.');const p=traceState();if(p.followup)return toast('Đã có trao đổi đang theo dõi. Ghi phản hồi vào bản ghi hiện có.');p.followup={team:v['trace-team'],ref:v['trace-sent'],note:v['trace-note'],due:v['trace-due'],method:v['trace-method'],transaction:v['trace-ref'],amount:Number(v['trace-amount']),time:v['trace-time']};log('CS ghi nhận đã gửi '+p.followup.team+' · '+p.followup.ref+' · hẹn khách '+p.followup.due);render();};
 submits['trace-response']=v=>{const p=traceState();if(!p.followup)return;if(!v['response-from']?.trim()||!v['response-proof']?.trim()||!v['response-note']?.trim())return toast('Cần người trả lời, nội dung và căn cứ.');p.responses=p.responses||[];p.responses.push({from:v['response-from'],proof:v['response-proof'],note:v['response-note'],at:new Date().toLocaleString('vi-VN')});log('Nhận phản hồi '+v['response-from']+' · '+v['response-proof']+'; chờ đối chiếu trạng thái');render();};
 submits['trace-customer']=v=>{const p=traceState();if(!v['customer-message']?.trim())return toast('Nhập nội dung đã báo khách.');if(paymentResult()?.team&&(!v['customer-due']||new Date(v['customer-due'])<=new Date()))return toast('Chọn thời gian cập nhật khách tiếp theo trong tương lai.');p.customer={channel:v['customer-channel'],note:v['customer-message'],due:v['customer-due'],at:new Date().toLocaleString('vi-VN')};if(p.followup&&v['customer-due'])p.followup.due=v['customer-due'];log('Đã báo khách qua '+p.customer.channel+': '+p.customer.note+(p.customer.due?' · hẹn '+p.customer.due:''));render();};
}

function applyCustomerCancellation(share,scope){
 if(!canSelfCancel())return false;
 st.cancel={share,fees:0,scope,status:'Đã hủy',source:'Khách tự hủy miễn phí',requestId:'CANCEL-SELF-DEMO-001',at:new Date().toLocaleString('vi-VN')};
 st.refundPendingFromSelfCancel=true;
 log('Khách xác nhận tự hủy miễn phí '+scope+'; hệ thống gửi CANCEL-SELF-DEMO-001, NCC xác nhận thành công (mô phỏng); chuyển CS xử lý hoàn tiền/xu');return true;
}

const views={S01:list,S02:overview,S03:payment,S04:reconfirm,S05:support,S06:alternative,S07:change,S08:cancel,S09:refund,S10:history,S11:flights,S12:flightDetail,S13:customerHistory,S14:customerDetail,S15:customerCancel,S16:extranet};
function render(){screen=views[location.hash.slice(1)]?location.hash.slice(1):'S01';let cust=['S13','S14','S15','S19','S20'].includes(screen);document.body.className=cust?'customer':'';document.title=screens[screen]+' • Bookese CS Prototype';document.querySelector('#demo').innerHTML=`<b>PROTOTYPE · DỮ LIỆU MẪU</b><span>Không kết nối hệ thống thật</span><select id="screen-picker" aria-label="Màn hình">${Object.entries(screens).map(([id,t])=>`<option value="${id}" ${screen===id?'selected':''}>${id} · ${t}</option>`).join('')}</select><select id="role-picker" aria-label="Vai trò">${['CS','PS','Kế toán','Trưởng CS'].map(r=>`<option ${st.role===r?'selected':''}>${r}</option>`).join('')}</select><select id="scenario-picker" aria-label="Tình huống">${[['success','Booking thành công'],['pendingpay','Treo thanh toán'],['pendingncc','Treo tại NCC'],['failed','Booking thất bại']].map(([v,t])=>`<option value="${v}" ${st.scenario===v?'selected':''}>${t}</option>`).join('')}</select>${btn('Hướng dẫn','guide')}${btn('Đặt lại demo','reset')}`;
 let nav=cust?`<aside><a class="navitem" href="#S13">Thông tin tài khoản</a><a class="navitem active" href="#S13">▣ &nbsp; Lịch sử đặt chỗ</a><a class="navitem" href="${walletUrls.customer}" target="_blank" rel="noopener">Ví xu của tôi ↗</a></aside>`:`<aside><div class="logo">bookese</div><span class="navitem muted">QUẢN LÝ HỆ THỐNG</span><a class="navitem" href="#S01">▦ &nbsp; Tổng quan booking</a><a class="navitem ${screen.startsWith('S1')&&['S11','S12'].includes(screen)?'':'active'}" href="#S01">▣ &nbsp; Quản lý đặt phòng</a><a class="navitem navsub" href="#S01">Danh sách đặt phòng</a><a class="navitem navsub" href="#S03">Tra soát thanh toán</a><a class="navitem ${['S11','S12'].includes(screen)?'active':''}" href="#S11">✈ &nbsp; Quản lý vé máy bay</a><a class="navitem" href="#S17">PS · Nhà cung cấp</a><a class="navitem" href="#S18">Kế toán · Thu / hoàn / hóa đơn</a><a class="navitem" href="#S13">↗ &nbsp; Xem phía khách hàng</a><a class="navitem" href="#S16">↗ &nbsp; Đặt phòng Extranet</a></aside>`;

function values(form){return Object.fromEntries(new FormData(form).entries())}
function need(id,message){if(!document.getElementById(id)?.checked){toast(message);return false}return true}
function dialog(title,body,confirmText,run){const d=document.querySelector('#dialog');d.innerHTML=`<h2>${title}</h2>${body}<div class="actions"><button id="dialog-back">Quay lại</button>${confirmText?`<button id="dialog-confirm" class="primary">${confirmText}</button>`:''}</div>`;d.querySelector('#dialog-back').onclick=()=>d.close();if(confirmText)d.querySelector('#dialog-confirm').onclick=()=>{d.close();run()};d.showModal()}
function cancelNumbers(){let share=document.querySelector('#cancel-share').value.startsWith('100')?1:.5;let rule=document.querySelector('#cancel-rule').value;let factor=rule.includes('toàn bộ')||rule.includes('trong hạn')?0:rule.includes('50%')?.5:1;let fees=(Number(document.querySelector('#cancel-nccfee').value)+Number(document.querySelector('#cancel-bkfee').value))*factor;return {share,fees,rule,cash:4200000*share-fees,spent:200000*share}}

function customerPreview(){let share=document.querySelector('#cc-scope').selectedIndex===0?1:.5;document.querySelector('#cc-preview').innerHTML=`<p><b>Mô phỏng yêu cầu còn hạn miễn phí:</b> phí hủy 0 đ</p><p>Tiền hoàn dự kiến: ${money(4200000*share)} · Xu dùng trả lại: ${(200000*share).toLocaleString('vi-VN')} xu</p><p>Xu thưởng đang chờ hủy: ${(84000*share).toLocaleString('vi-VN')} xu. Kết quả cuối cùng được cập nhật sau khi NCC xác nhận.</p>`}
function bind(){document.querySelector('#screen-picker').onchange=e=>go(e.target.value);document.querySelector('#role-picker').onchange=e=>{st.role=e.target.value;save();render()};document.querySelector('#scenario-picker').onchange=e=>{st=Object.assign(seed(),{role:st.role,scenario:e.target.value});save();render()};document.querySelectorAll('[data-action]').forEach(e=>e.onclick=()=>actions[e.dataset.action]?.());document.querySelectorAll('form').forEach(f=>f.onsubmit=e=>{e.preventDefault();submits[f.id]?.(values(f))});document.querySelector('#app').onclick=e=>{const b=e.target.closest('[data-openbooking]');if(b){const id=b.dataset.openbooking;if(id!==(st.activeBooking||'BK-DEMO-2409')){st=Object.assign(seed(),{role:st.role,activeBooking:id,scenario:id==='BK-DEMO-2410'?'pendingpay':id==='BK-DEMO-2411'?'failed':'success'});}save();go('S02')}};['cancel-share','cancel-rule','cancel-nccfee','cancel-bkfee'].forEach(id=>{if(document.getElementById(id))document.getElementById(id).oninput=cancelPreview});if(document.querySelector('#change-price'))document.querySelector('#change-price').oninput=changePreview;if(document.querySelector('#cc-scope'))document.querySelector('#cc-scope').onchange=customerPreview;if(document.querySelector('#flight-search'))document.querySelector('#flight-search').oninput=e=>{document.querySelector('#flight-results').style.display='FL-DEMO-0001 DEMO26 NGUYEN AN'.toLowerCase().includes(e.target.value.toLowerCase())?'':'none'}}

 refund:v=>{if(st.refund)return;if(v['refund-reason'].startsWith('Hoàn chênh lệch')||v['refund-reason'].startsWith('NCC hỗ trợ bổ sung'))return toast('Demo tính tiền đang minh họa hủy/booking thất bại. Hoàn chênh lệch và hoàn bổ sung theo yêu cầu RQ-029/036/057, không dùng số tiền toàn đơn ở đây.');if(v['refund-route'].startsWith('Phương án khác'))return toast('Cần quy trình xác minh người nhận và phê duyệt riêng; chưa gửi trong demo.');if(v['refund-reason']==='Hủy đã xác nhận'&&st.cancel?.status!=='Đã hủy')return toast('Chưa có kết quả hủy NCC. Kiểm tra tại màn Hủy.');if(v['refund-reason'].startsWith('Booking thất bại')&&st.scenario!=='failed')return toast('Booking chưa ở trạng thái thất bại.');if(v['refund-reason'].startsWith('Hoàn chênh lệch')&&(!st.change?.done||st.change.delta>=0))return toast('Cần có kết quả đổi sang giá thấp hơn.');st.refund={status:'Chờ duyệt',coins:false,ref:null};log('CS lập đề nghị hoàn RF-DEMO-001; chưa phát lệnh tiền');render()},
 handoff:v=>{log(v['handoff-type']+': '+v['handoff-note']+' · Hẹn '+v['handoff-time']);render()},
 'flight-request':v=>{if(!need('flight-consent','Cần điều kiện vé, phản hồi NCC và khách đồng ý.'))return;log('CS làm trực tiếp Hồng Ngọc Hà: '+v['flight-type']+' · '+v['flight-ref']);toast('Đã lưu yêu cầu. Báo giá hoàn cuối cùng chờ chốt quy tắc phí vé.')},
 'customer-cancel':v=>{if(!need('cc-consent','Vui lòng xác nhận đã đọc thông tin hoàn hủy.'))return;let share=v['cc-scope']==='Toàn bộ booking'?1:.5;st.cancel={share,fees:0,scope:v['cc-scope'],status:'Đang xử lý hủy'};log('Khách gửi yêu cầu hủy; hệ thống chuyển NCC và chờ kết quả');go('S14');toast('Đã nhận yêu cầu hủy. Chưa hoàn tiền cho đến khi có kết quả.')},
 extranet:v=>{if(!need('ex-consent','Khách sạn cần xác nhận nội dung phục vụ.'))return;st.reconfirm={source:'Extranet',person:v['ex-person'],time:new Date().toLocaleString('vi-VN'),proof:v['ex-note']};log('KS reconfirm qua Extranet: '+v['ex-code']);toast('Đã đồng bộ phản hồi sang màn CS.');go('S04')}
};
// Shared booking operations model. All integrations below are explicitly simulated.
function ops(){return st.ops||(st.ops={guest:st.activeBooking==='BK-DEMO-2410'?'Trần Bình':st.activeBooking==='BK-DEMO-2411'?'Lê Chi':'Nguyễn An',special:'',sync:[],invoice:null,changeRequest:null,exchange:null,over:null,settlement:null});}
function stamp(){return new Date().toLocaleString('vi-VN');}
function futureInput(minutes=60){const d=new Date(Date.now()+minutes*60000);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16);}
function allowed(roles){if(!roles.includes(st.role)){toast('Thao tác dành cho '+roles.join(' / ')+'. Đổi vai ở thanh mô phỏng để thử.');return false;}return true;}
function integration(kind,detail,result='Đã đồng bộ'){const o=ops(),id='SYNC-'+String(o.sync.length+1).padStart(3,'0');o.sync.unshift({id,kind,detail,result,at:stamp()});log(kind+': '+detail+' · '+result+' · '+id);return id;}
function syncTable(){return table(['Lệnh','Nội dung','Kết quả Extranet / API','Thời điểm'],ops().sync.map(x=>[esc(x.id),esc(x.kind)+'<small>'+esc(x.detail)+'</small>',esc(x.result),esc(x.at)]));}
function opTimeline(){return `<div class="op-flow">${['Khách yêu cầu','Hệ thống ghi nhận','CS / PS xử lý','Tiền & NCC xác nhận','Khách nhận kết quả'].map(x=>`<span>${x}</span>`).join('')}</div>`;}
function sharedWork(){const o=ops();return `<div class="work-nav">${link('CS · Booking','S02')}${link('PS · Nhà cung cấp','S17')}${link('Kế toán · Tiền & hóa đơn','S18')}${link('Khách · Tự phục vụ','S19')}${link('NCC · Extranet','S16')}</div>`;}
function selfEditBlock(){
 if(st.ops?.exchange?.oldStatus==='Đã hủy')return 'Booking cũ đã hủy để đổi sang booking mới. Vui lòng xem booking mới; không sửa thông tin đơn cũ.';
 if(st.scenario!=='success')return 'Booking chưa đặt thành công. Cần xác minh kết quả đặt trước khi cập nhật thông tin lưu trú.';
 if(st.cancel?.share===1&&st.cancel.status==='Đã hủy')return 'Booking đã hủy toàn bộ nên không thể đổi tên hoặc cập nhật yêu cầu lưu trú.';
 if(st.cancel&&st.cancel.status!=='Đã hủy'&&st.cancel.status!=='NCC từ chối'&&st.cancel.status!=='Hủy thất bại')return 'Yêu cầu hủy đang chờ kết quả. Vui lòng đợi kết quả hủy trước khi cập nhật thông tin lưu trú.';
 return '';
}
function customerManage(){const o=ops();if(st.customerItem==='flight')return customerFlightDetail();return sharedWork()+card('Tự quản lý đặt phòng',`<p><b>BK-DEMO-2409</b> · Biển Xanh · 28–30/09/2026 · 2 phòng</p><p>${badge(bookingState(),'neutral')} ${st.cancel?badge(st.cancel.status+(st.cancel.share<1?' một phần':' toàn bộ'),'warn'):badge('Booking còn hiệu lực','good')}</p>${selfEditBlock()?alert(selfEditBlock()):''}${alert('Các thay đổi tên lưu trú và hủy được hệ thống tự đồng bộ sang Extranet/API đối tác. Yêu cầu đặc biệt được chuyển đến khách sạn, chưa có nghĩa khách sạn bảo đảm đáp ứng.','info')}`)+`<div class="grid">${card('Đổi tên người lưu trú',`<form id="self-name">${field('Họ tên người nhận phòng','self-guest-name','text',o.guest,'Nhập họ tên người sẽ nhận phòng tại khách sạn.',true)}${tick('Tôi xác nhận thông tin người lưu trú mới','self-name-consent')}<button class="primary" ${selfEditBlock()?'disabled':''}>Lưu và cập nhật khách sạn</button></form>`)}${card('Yêu cầu đặc biệt',`<form id="self-special">${textfield('Yêu cầu với khách sạn','self-special-text',o.special,true)}<p class="note">Giường, tầng, giờ nhận phòng… chỉ được bảo đảm khi khách sạn xác nhận.</p><button class="primary" ${selfEditBlock()?'disabled':''}>Cập nhật yêu cầu</button></form>${o.special?`<p>${badge(o.specialConfirmed?'Khách sạn đã phản hồi':'Đã gửi · chờ khách sạn phản hồi','warn')} ${esc(o.specialReply||'')}</p>`:''}`)}</div>${card('Thông tin xuất hóa đơn',`<p>Hóa đơn xuất trong ngày khách thanh toán. Giao dịch mẫu thanh toán ngày 24/09/2026; hạn bổ sung và xuất là hết ngày 24/09/2026 (GMT+7). Hóa đơn đã xuất không được sửa trực tiếp; gửi đề nghị điều chỉnh cho Kế toán.</p>${o.invoice?alert('Trạng thái: '+esc(o.invoice.status)+(o.invoice.number?' · Số '+esc(o.invoice.number):''),'info'):''}<form id="self-invoice"><div class="grid">${field('Tên đơn vị / cá nhân','invoice-name','text',o.invoice?.name||'','',true)}${field('Mã số thuế (nếu có)','invoice-tax','text',o.invoice?.tax||'')}${field('Địa chỉ hóa đơn','invoice-address','text',o.invoice?.address||'','',true)}${field('Email nhận hóa đơn','invoice-email','email',o.invoice?.email||'','',true)}</div><button class="primary" ${o.invoice?.status==='Đã xuất'?'disabled':''}>Lưu thông tin hóa đơn</button></form>${o.invoice?.status==='Đã xuất'?btn('Đề nghị điều chỉnh hóa đơn','invoice-correction'):''}`)}${card('Đổi ngày, thêm phòng hoặc gia hạn',`<p>Gửi nhu cầu để CS kiểm tra chỗ, báo giá và tạo phương án đổi. Booking hiện tại chưa thay đổi khi chỉ gửi yêu cầu.</p><form id="self-change"><div class="grid">${select('Nhu cầu thay đổi','self-change-type',['Đổi giai đoạn lưu trú','Thêm phòng','Gia hạn lưu trú'])}${field('Ngày nhận mong muốn','self-change-in','date','2026-10-02','',true)}${field('Ngày trả mong muốn','self-change-out','date','2026-10-04','',true)}${field('Tổng số phòng sau đổi','self-change-rooms','number',2,'Với thêm phòng, nhập tổng số phòng mong muốn.',true)}${textfield('Ghi chú cho Bookese','self-change-note','')}</div><button class="primary">Gửi nhu cầu thay đổi</button></form>${o.changeRequest?alert('Đã gửi '+esc(o.changeRequest.type)+' · '+esc(o.changeRequest.from)+' → '+esc(o.changeRequest.to)+'. CS đang kiểm tra phương án.','info'):''}${o.exchange?exchangeCustomer():''}`)}${card('Hủy booking',`<p>Hệ thống lấy phí từ điều kiện đã mua, hiển thị tiền và xu trước khi bạn xác nhận. Cả hủy miễn phí và có phí đều tự cập nhật NCC khi đủ điều kiện.</p>${link('Kiểm tra phí và hủy booking →','S15')}`)}${card('Cập nhật gần nhất',table(['Nội dung','Kết quả','Thời điểm'],o.sync.filter(x=>['Đổi tên lưu trú','Yêu cầu đặc biệt','Khách sạn phản hồi yêu cầu đặc biệt','Khách tự hủy'].includes(x.kind)).map(x=>[esc(x.kind)+' · '+esc(x.detail),esc(x.result),esc(x.at)])))}`;}
function selfCancelV2(){const o=ops();if(st.customerItem==='flight')return customerFlightDetail();if(st.cancel)return card('Theo dõi hủy booking',`<p>${badge(st.cancel.status,st.cancel.status==='Đã hủy'?'good':'warn')} · ${esc(st.cancel.scope)}</p><p>Phí hủy ${money(st.cancel.fees)} · Tiền hoàn ${money(refundCalculation().cash)} · ${refundCalculation().spent.toLocaleString('vi-VN')} xu được trả theo phần dịch vụ hủy.</p><p>${st.cancel.status==='Đã hủy'?'Bookese tiếp nhận hoàn tiền/xu. Chưa có nghĩa tiền đã về tài khoản.':'Hệ thống đang đối chiếu với NCC; không gửi lại lệnh hủy.'}</p>${link('Về chi tiết booking','S14')}`);if(st.ops?.exchange)return card('Booking đang có phương án đổi',`<p>Kiểm tra kết quả đổi và booking mới trước khi hủy. Không gửi hủy lại đơn gốc.</p>${link('Xem phương án đổi','S14')}`);if(st.scenario!=='success')return card('Chưa thể hủy',`<p>Cần xác minh kết quả đặt và thanh toán trước khi hủy.</p>${btn('Liên hệ hỗ trợ','customer-help')}`);return card('Kiểm tra và xác nhận hủy',`<p>BK-DEMO-2409 · 2 phòng × 2 đêm. Chỉ hủy sau khi bạn đồng ý phí và khoản hoàn.</p><details><summary>Dữ liệu mô phỏng chính sách và kết quả NCC</summary>${select('Chính sách demo','self-cancel-policy',['Còn hạn miễn phí','Có phí theo điều kiện đã mua'])}${select('Kết quả NCC mô phỏng','self-cancel-result',['Hủy thành công','Chưa có kết quả','NCC từ chối'])}<p class="note">Trên hệ thống thật server quyết định chính sách, số tiền và nhận kết quả từ NCC; khách không có các lựa chọn mô phỏng này.</p></details><form id="self-cancel-v2"><div class="grid">${select('Phạm vi cần hủy','self-cancel-scope',['Toàn bộ 2 phòng','1 trong 2 phòng'])}${select('Lý do hủy','self-cancel-reason',['Thay đổi kế hoạch','Không còn nhu cầu','Lý do khác'])}</div><div id="self-cancel-quote" class="summary"></div>${tick('Tôi đồng ý phí, số tiền và xu được hoàn, xác nhận hủy đúng phạm vi','self-cancel-consent')}<div class="actions">${link('Giữ booking','S14')}<button class="danger">Xác nhận hủy booking</button></div></form>`);}

function psDesk(){const o=ops();return sharedWork()+opTimeline()+card('PS · Công việc với nhà cung cấp',table(['Booking','Nghiệp vụ','Việc cần xử lý','Mở'],[[st.activeBooking||'BK-DEMO-2409','Overbooking',o.over?(o.over.closed?'Khách đã có phòng · đối soát NCC':o.over.status):'Chưa có ca',link('Phương án & phản hồi NCC','S06')],[st.activeBooking||'BK-DEMO-2409','Đổi booking',o.exchange?o.exchange.status:o.changeRequest?'CS nhận nhu cầu; PS hỗ trợ nếu cần':'Chưa có yêu cầu',link('Xem đổi booking','S07')]]))+card('Phạm vi PS',`<p><b>Ca thường / sau T+24 giờ:</b> PS làm việc với NCC, tìm phòng thay, thương lượng hỗ trợ, cập nhật phương án để CS chốt với khách.</p><p><b>Ca gấp trong T→T+24 giờ:</b> CS giải quyết chỗ ở trước. PS nhận bàn giao và theo dõi chi phí, công nợ NCC.</p><p>Vé máy bay: CS làm trực tiếp Hồng Ngọc Hà. PS không duyệt hoàn tiền thay Kế toán.</p>`)+card('Theo dõi chi phí / thu hồi từ NCC',o.over?`<form id="ps-settlement"><div class="grid">${field('Số tiền NCC đồng ý chịu (đ)','ps-recovery','number',o.settlement?.amount||0,'Tách khỏi khoản tiền Bookese trả khách.',true)}${field('Tham chiếu xác nhận / công nợ NCC','ps-proof','text',o.settlement?.proof||'','',true)}${field('Ngày NCC dự kiến thanh toán','ps-due','date',o.settlement?.due||'','',true)}${textfield('Nội dung bàn giao Kế toán','ps-note',o.settlement?.note||'',true)}</div><button class="primary" ${st.role!=='PS'?'disabled':''}>Lưu và chuyển đối soát Kế toán</button></form>`:'<p>Phát sinh sau khi tiếp nhận ca overbooking. '+link('CS ghi nhận vấn đề','S05')+'</p>')+card('Nhật ký đồng bộ NCC',syncTable());}
function financeDesk(){const o=ops(),e=o.exchange;return sharedWork()+card('Kế toán · Khoản thu, hoàn và hóa đơn',table(['Nghiệp vụ','Kết quả hiện tại','Việc tiếp theo'],[['Thu bổ sung đổi booking',e?money(e.delta)+' · '+e.payment:'Chưa có',e?link('Đối chiếu payment link','S07'):'—'],['Hoàn booking',st.refund?st.refund.status:st.cancel?.status==='Đã hủy'?'Chờ CS lập đề nghị':'Chưa có',link('Duyệt / gửi hoàn / tiền & xu','S09')],['Tra soát thanh toán',st.paymentTrace?.followup?'Có trao đổi đang theo dõi':'Chưa có',link('Ghi phản hồi đối soát','S03')],['Hóa đơn',o.invoice?o.invoice.status:'Chưa nhận thông tin','Xử lý bên dưới'],['Công nợ NCC',o.settlement?money(o.settlement.amount)+' · '+(o.settlement.received?'Đã đối soát thu':'Chưa đối soát thu'):'Chưa có','Xử lý bên dưới']]))+card('Hóa đơn khách yêu cầu',o.invoice?`${kv([['Tên',esc(o.invoice.name)],['Mã số thuế',esc(o.invoice.tax||'Không có')],['Địa chỉ',esc(o.invoice.address)],['Email',esc(o.invoice.email)],['Tiếp nhận',esc(o.invoice.at)],['Trạng thái',esc(o.invoice.status)]])}<p class="note">Hạn xuất: hết ngày khách thanh toán — 24/09/2026 (GMT+7) trong mẫu. Yêu cầu đến trễ chuyển Kế toán kiểm tra ngoại lệ; không xuất lùi ngày tự động.</p><form id="account-invoice">${field('Số hóa đơn đã xuất','account-invoice-number','text',o.invoice.number||'','',true)}${field('Tham chiếu kết quả hệ thống hóa đơn','account-invoice-ref','text',o.invoice.ref||'','',true)}<button class="primary" ${st.role!=='Kế toán'||o.invoice.status==='Đã xuất'?'disabled':''}>Ghi nhận hóa đơn đã xuất</button></form>`:'<p>Khách chưa bổ sung thông tin hóa đơn. '+link('Mở phía khách','S19')+'</p>')+card('Thu hồi khoản NCC chịu',o.settlement?`${kv([['Số tiền',money(o.settlement.amount)],['Xác nhận NCC',esc(o.settlement.proof)],['Ngày dự kiến',esc(o.settlement.due)],['Bàn giao PS',esc(o.settlement.note)]])}<form id="account-recovery">${field('Chứng từ thu / đối trừ công nợ','account-recovery-proof','text','','',true)}<button class="primary" ${st.role!=='Kế toán'||o.settlement.received?'disabled':''}>Xác nhận đối soát khoản NCC</button></form><p>Tiền NCC chưa về không đồng nghĩa được giữ khoản hoàn khách đã duyệt.</p>`:'<p>Chưa có khoản PS bàn giao.</p>');}

function overV2(){const o=ops(),v=o.over;if(!v)return sharedWork()+card('Chưa có ca overbooking',`<p>CS ghi nhận vấn đề và mức độ gấp để xác định đầu mối làm việc NCC.</p>${link('Tiếp nhận vấn đề →','S05')}`);const owner=overOwner(v);return sharedWork()+bookingHeader()+card('Overbooking · tiến độ chung',`${kv([['Khách cần gì',esc(v.need)],['Phát hiện T',esc(v.detected)],['Mức độ',v.urgent?'Gấp':'Thông thường'],['Đầu mối NCC hiện tại',owner],['Tiến độ',esc(v.status)],['NCC hỗ trợ',esc(v.support||'Chưa có phản hồi')]])}<p>CS luôn trao đổi với khách. ${owner==='CS'?'CS xử lý chỗ ở trước rồi bàn giao PS.':'PS tìm và thương lượng phương án với NCC, chuyển CS chốt khách.'}</p>`)+card('1. Cập nhật phản hồi NCC / tìm phương án',`<form id="over-option"><div class="grid">${select('Mức hỗ trợ NCC','over-support',['Hỗ trợ đủ','Chỉ miễn hủy','Có phòng thay, không chịu chênh','Từ chối hỗ trợ','Chưa liên lạc được'])}${field('KS / hạng phòng thay','over-hotel','text','','',true)}${field('Ngày, số phòng và quyền lợi','over-scope','text','28–30/09 · 2 phòng · bữa sáng','',true)}${field('Khoản chênh / chi thêm (đ)','over-cost','number',0,'Không tự thu thêm khách do lỗi overbooking.',true)}${select('Bên chịu khoản chi','over-payer',['NCC chịu','Bookese ứng / bù — cần duyệt'])}${field('Phương án giữ đến','over-until','datetime-local',futureInput(90),'',true)}${field('Tham chiếu NCC / bằng chứng','over-proof','text','','',true)}${textfield('Khác biệt so với đơn cũ / điều kiện','over-note','',true)}</div><button class="primary" ${st.role!==owner?'disabled':''}>Lưu phương án → chuyển CS chốt khách</button></form><p class="note">Không có phòng phù hợp: ghi phản hồi và tiếp tục tìm, hoặc để CS chốt hoàn với khách. Không ép khách tự hủy chịu phí.</p><form id="over-response">${select('Kết quả liên hệ','over-response-status',['Chưa có phòng thay','NCC từ chối hỗ trợ','Chưa liên lạc được NCC','NCC đồng ý miễn hủy'])}${textfield('Nội dung / bằng chứng phản hồi','over-response-note','',true)}<button ${st.role!==owner?'disabled':''}>Lưu phản hồi NCC</button></form>`)+card('2. CS chốt lựa chọn với khách',v.options.length?table(['Phương án','Chi phí / hiệu lực','Kết quả khách','Thao tác'],v.options.map((x,i)=>[esc(x.hotel)+'<small>'+esc(x.scope)+' · '+esc(x.note)+'</small>',money(x.cost)+' · '+esc(x.payer)+'<small>'+esc(x.until.replace('T',' '))+'</small>',esc(x.customer||'Chưa hỏi khách'),`${btn('Khách đồng ý','over-accept-'+i,'primary',st.role!=='CS'||!!v.closed)} ${btn('Khách từ chối','over-reject-'+i,'',st.role!=='CS'||!!v.closed)}`])):'<p>Chờ đầu mối NCC cập nhật phương án. CS chủ động hẹn cập nhật khách.</p>')+card('3. Xác nhận thực hiện và ổn định chỗ ở',`<p>Phương án chọn: <b>${esc(v.options[v.selected]?.hotel||'Chưa chốt')}</b></p>${v.selected!=null&&v.options[v.selected]?.payer.startsWith('Bookese')?btn(v.approved?'Khoản chi đã duyệt':'Duyệt khoản Bookese chi','over-approve','',st.role!=='Trưởng CS'||v.approved):''}<form id="over-execute">${field('Mã xác nhận phòng thay từ NCC','over-confirm-ref','text',v.confirmRef||'','',true)}${textfield('Hướng dẫn nhận phòng / liên hệ tại KS','over-instruction',v.instruction||'',true)}<button class="primary" ${st.role!==owner||v.selected==null||v.closed?'disabled':''}>Lưu NCC xác nhận thực hiện</button></form><form id="over-arrived">${textfield('CS xác nhận khách đã có phòng / kết quả thực tế','over-arrived-proof','',true)}<button class="primary" ${st.role!=='CS'||!v.confirmRef||v.closed?'disabled':''}>Xác nhận khách ổn định → bàn giao PS</button></form>${v.closed?alert('Khách đã có phòng. PS tiếp tục khoản NCC chịu và bàn giao Kế toán đối soát; không giữ ca khách chỉ vì công nợ chưa xong.','info'):''}${link('PS theo dõi chi phí / công nợ →','S17')}<p>${link('Khách chọn hoàn thay vì phòng thay → kiểm tra miễn phí tại màn Hủy','S08')}</p>`)+card('Trao đổi trong ca',table(['Thời điểm','Người cập nhật','Nội dung'],v.events.map(x=>[esc(x.at),esc(x.by),esc(x.note)])));}

function createHold(v){if(!allowed(['CS']))return false;const o=ops();if(o.exchange)return false;if(st.scenario!=='success'||st.cancel){toast('Chỉ đổi booking thành công còn hiệu lực.');return false;}if(v['exchange-in']>=v['exchange-out']||Number(v['exchange-price'])<=0||!Number.isInteger(Number(v['exchange-rooms']))||Number(v['exchange-rooms'])<1){toast('Kiểm tra ngày, giá và số phòng.');return false;}const until=new Date(v['exchange-until']);if(until<=new Date()||until>new Date('2026-09-27T12:00:00+07:00')){toast('Giữ chỗ phải còn hạn và không vượt hạn hủy miễn phí booking cũ.');return false;}if(!v['exchange-free']||!v['exchange-consent']){toast('Cần căn cứ miễn hủy và khách đồng ý phương án.');return false;}const price=Number(v['exchange-price']);o.exchange={id:'CHANGE-DEMO-001',newId:'BK-NEW-DEMO-001',from:v['exchange-in'],to:v['exchange-out'],rooms:Number(v['exchange-rooms']),price,delta:price-4400000,until:v['exchange-until'],proof:v['exchange-proof'],oldStatus:'Đang giữ nguyên',payment:price>4400000?'Chưa thu':'Không cần thu thêm',status:'Đã giữ chỗ · chờ thanh toán',done:false};integration('Giữ chỗ booking mới',o.exchange.newId+' · chưa xuất; cấn tiền/xu gốc, thu thêm '+money(Math.max(0,o.exchange.delta)));return true;}
function processExchangePayment(result,method){const e=ops().exchange;if(!e||e.done||e.payment==='Đã thu'||e.delta<=0)return false;e.method=method;if(result==='Tiền về sau khi hold hết hạn'){e.expired=true;e.payment='Đã thu';e.exception='Tiền bổ sung về sau hold hết hạn. Không tự hủy đơn cũ hoặc xuất mới. Kế toán đối chiếu khoản bổ sung; CS xác nhận phương án tiếp với khách.';e.status='Tiền về muộn · cần xử lý';}else if(!holdValid(e)){toast('Hold hết hạn. Không tạo giao dịch mới trên link cũ.');return false;}else {e.payment=result==='Thành công'?'Đã thu':result==='Thất bại'?'Thất bại':'Đang xử lý';e.status=e.payment==='Đã thu'?'Đã thu bổ sung · CS hủy cũ rồi xuất mới':'Chờ xác minh thanh toán';}integration('Thanh toán bổ sung '+e.id,method+' · '+money(e.delta)+' · '+e.payment);return true;}
function cancelExchangeOld(result){const e=ops().exchange;if(!allowed(['CS'])||!holdValid(e)||e.done||e.oldStatus==='Đã hủy'||e.delta>0&&e.payment!=='Đã thu')return false;e.cancelRef='CANCEL-CHANGE-DEMO-001';e.oldStatus=result==='Thành công'?'Đã hủy':result==='NCC từ chối'?'NCC từ chối hủy':'Đang đối chiếu kết quả hủy';e.status=e.oldStatus==='Đã hủy'?'Đã hủy cũ · chờ CS xuất mới':'Chưa đủ điều kiện xuất mới';e.exception=result==='Thành công'?null:'Chưa hủy được booking cũ. Tra cứu cùng mã lệnh; không xuất đơn mới hoặc gửi hủy lặp.';integration('Hủy cũ để đổi',e.cancelRef,e.oldStatus);return true;}
function issueExchangeNew(result){const e=ops().exchange;if(!allowed(['CS'])||!holdValid(e)||e.oldStatus!=='Đã hủy'||e.done||e.delta>0&&e.payment!=='Đã thu')return false;e.issueRef='ISSUE-CHANGE-DEMO-001';e.done=result==='Thành công';e.status=e.done?'Đổi thành công':result==='NCC từ chối'?'Xuất mới thất bại · cần xử lý ngay':'Đang đối chiếu kết quả xuất';e.exception=e.done?null:'Đơn cũ đã hủy. CS ưu tiên xác minh chỗ mới / phương án thay, không báo khách đã có phòng và không gửi lệnh xuất trùng. Khoản tiền phải được đối soát riêng.';if(e.done){e.coinState='Cấn xu gốc, hủy thưởng chờ cũ, tạo thưởng chờ mới';st.reconfirm=false;}integration('Xuất mới',e.newId+' · '+e.issueRef,e.status);return true;}

 submits['ps-settlement']=v=>{if(!allowed(['PS']))return;const amount=Number(v['ps-recovery']);if(amount<0)return toast('Số tiền không hợp lệ.');ops().settlement={amount,proof:v['ps-proof'],due:v['ps-due'],note:v['ps-note'],received:false};log('PS chuyển khoản NCC chịu cho Kế toán đối soát');render();};

function bookingWork(s){const out=[];const o=s.ops||{};
 if(s.scenario==='pendingpay')out.push({group:'Thanh toán',label:'Cần tra soát thanh toán',to:'S03'});
 if(s.scenario==='pendingncc')out.push({group:'Yêu cầu cần xử lý',label:'Chờ kết quả NCC',to:'S03'});
 if(o.changeRequest&&!o.exchange)out.push({group:'Yêu cầu cần xử lý',label:'Khách yêu cầu '+o.changeRequest.type,to:'S07'});
 if(o.exchange)out.push({group:'Thay đổi',label:o.exchange.status,to:'S07'});
 if(s.cancel)out.push({group:'Hủy',label:s.cancel.status+(s.cancel.share<1?' một phần':''),to:s.cancel.status==='Đã hủy'?'S09':'S08'});
 if(s.refund)out.push({group:'Hoàn',label:s.refund.status+' · xu '+(s.refund.coins?'đã xử lý':'chưa xong'),to:'S09'});
 else if(s.cancel?.status==='Đã hủy'||s.scenario==='failed')out.push({group:'Hoàn',label:'Chờ xử lý hoàn tiền / xu',to:'S09'});
 if(o.over&&!o.over.closed)out.push({group:'Yêu cầu cần xử lý',label:'Overbooking · '+o.over.status,to:'S06'});
 if(s.request&&!s.request.closed&&!o.over)out.push({group:'Yêu cầu cần xử lý',label:'Khách cần hỗ trợ',to:'S05'});
 if(o.special&&!o.specialConfirmed)out.push({group:'Yêu cầu cần xử lý',label:'Yêu cầu đặc biệt · chờ KS phản hồi',to:'S04'});
 if(o.invoice&&o.invoice.status!=='Đã xuất')out.push({group:'Hóa đơn',label:o.invoice.status,to:'S18'});
 if((s.customerUpdateVersion||0)>(s.customerSeenVersion||0))out.push({group:'Khách vừa cập nhật',label:s.customerUpdateLabel||'Có thông tin mới từ khách',to:'S02'});
 return out;
}

và kết quả ví theo phạm vi hoàn đã chốt. Tiền đang chờ/thất bại hoặc được ứng trước không phải căn cứ tự hoàn xu thêm lần nữa; giữ hạn lô gốc.", "result": "Báo số tiền, tình trạng thực tế và thời gian cập nhật; tiếp tục hỗ trợ nếu khách chưa nhận được tiền.\nKhách biết kết quả tiền và xu riêng; nếu xu chưa đúng thì tiếp tục đối soát."}, {"code": "5.4", "title": "Tiền hoàn đang chờ xử lý", "condition": "Kế toán xác nhận khoản hoàn vẫn đang chờ xử lý hoặc cần khách bổ sung thông tin.", "cs": "Nhờ Kế toán kiểm giao dịch hoàn đang chờ và nguyên nhân → báo khách thời gian cập nhật tiếp theo.\nĐối chiếu tiền và xu riêng: xu đã dùng cần trả, thưởng cần hủy/thu hồi và các lần đã xử lý → báo kết quả từng khoản; lệch thì nhờ Tech/Kế toán.", "ps": "Không cần tham gia ở bước này.", "fees": "Không tạo lệnh thứ hai khi lệnh đầu có thể thành công.\nXu: kiểm riêng tiến độ và kết quả ví theo phạm vi hoàn đã chốt. Tiền đang chờ/thất bại hoặc được ứng trước không phải căn cứ tự hoàn xu thêm lần nữa; giữ hạn lô gốc.", "result": "Báo số tiền, tình trạng thực tế và thời gian cập nhật; tiếp tục hỗ trợ nếu khách chưa nhận được tiền.\nKhách biết kết quả tiền và xu riêng; nếu xu chưa đúng thì tiếp tục đối soát."}, {"code": "5.5", "title": "Hoàn tiền chưa thành công", "condition": "Cổng báo failed/canceled, tiền chưa tới khách.", "cs": "Nhờ Kế toán xác nhận hoàn thất bại và cách xử lý tiếp → xác minh thông tin cần bổ sung với khách → báo kết quả.\nĐối chiếu tiền và xu riêng: xu đã dùng cần trả, thưởng cần hủy/thu hồi và các lần đã xử lý → báo kết quả từng khoản; lệch thì nhờ Tech/Kế toán.", "ps": "Không cần tham gia ở bước này.", "fees": "Không yêu cầu chi lại khi chưa biết kết quả khoản hoàn trước.\nXu: kiểm riêng tiến độ và kết quả ví theo phạm vi hoàn đã chốt. Tiền đang chờ/thất bại hoặc được ứng trước không phải căn cứ tự hoàn xu thêm lần nữa; giữ hạn lô gốc.", "result": "Báo số tiền, tình trạng thực tế và thời gian cập nhật; tiếp tục hỗ trợ nếu khách chưa nhận được tiền.\nKhách biết kết quả tiền và xu riêng; nếu xu chưa đúng thì tiếp tục đối soát."}, {"code": "5.6", "title": "Cổng thành công nhưng khách chưa thấy tiền", "condition": "Khách không thấy khoản có trong sao kê.", "cs": "Lấy ngày/số tiền hoàn và mã tra soát từ Kế toán → hướng dẫn khách kiểm tra ngân hàng → tiếp tục theo dõi nếu chưa thấy tiền.\nĐối chiếu tiền và xu riêng: xu đã dùng cần trả, thưởng cần hủy/thu hồi và các lần đã xử lý → báo kết quả từng khoản; lệch thì nhờ Tech/Kế toán.", "ps": "Không cần tham gia ở bước này.", "fees": "Không hoàn lần hai chỉ từ phản ánh chưa thấy tiền.\nTiền đã hoàn nhưng xu chưa về/sai: xác minh số xu trả và thưởng điều chỉnh, sửa phần lệch; không phát lại tiền vì xu chưa về và không hoàn xu trùng khi khách hỏi lại.", "result": "Báo số tiền, tình trạng thực tế và thời gian cập nhật; tiếp tục hỗ trợ nếu khách chưa nhận được tiền.\nKhách biết kết quả tiền và xu riêng; nếu xu chưa đúng thì tiếp tục đối soát."}, {"code": "5.7", "title": "Thẻ cũ hết hạn hoặc tài khoản đóng", "condition": "Khách yêu cầu đổi tài khoản nhận.", "cs": "Nhờ Kế toán kiểm với cổng/ngân hàng xem còn nhận hoàn được không → chỉ xác minh nơi nhận khác khi cần.\nĐối chiếu tiền và xu riêng: xu đã dùng cần trả, thưởng cần hủy/thu hồi và các lần đã xử lý → báo kết quả từng khoản; lệch thì nhờ Tech/Kế toán.", "ps": "Không cần tham gia ở bước này.", "fees": "Không tự đổi tài khoản nhận tiền theo tin nhắn chưa xác minh.\nXu: kiểm riêng tiến độ và kết quả ví theo phạm vi hoàn đã chốt. Tiền đang chờ/thất bại hoặc được ứng trước không phải căn cứ tự hoàn xu thêm lần nữa; giữ hạn lô gốc.", "result": "Báo số tiền, tình trạng thực tế và thời gian cập nhật; tiếp tục hỗ trợ nếu khách chưa nhận được tiền.\nKhách biết kết quả tiền và xu riêng; nếu xu chưa đúng thì tiếp tục đối soát."}, {"code": "5.8", "title": "Người đặt, người ở, người trả khác nhau", "condition": "Người ở đòi chuyển tiền vào tài khoản cá nhân.", "cs": "Xác minh ai đã trả tiền và ai có quyền nhận → gửi Kế toán kiểm trước khi hoàn → báo đúng người liên quan.\nĐối chiếu tiền và xu riêng: xu đã dùng cần trả, thưởng cần hủy/thu hồi và các lần đã xử lý → báo kết quả từng khoản; lệch thì nhờ Tech/Kế toán.", "ps": "Không cần tham gia ở bước này.", "fees": "Không hoàn cho người ở chỉ vì đang cầm xác nhận đặt phòng.\nXu trả về đúng tài khoản/lô đã dùng cho booking; không chuyển sang người ở hoặc người yêu cầu khác.", "result": "Báo số tiền, tình trạng thực tế và thời gian cập nhật; tiếp tục hỗ trợ nếu khách chưa nhận được tiền.\nKhách biết kết quả tiền và xu riêng; nếu xu chưa đúng thì tiếp tục đối soát."}, {"code": "5.9", "title": "Hoàn nhiều lần một phần", "condition": "Đã hoàn một đêm, nay hoàn thêm phòng hoặc miễn thêm phí.", "cs": "Nhờ Kế toán kiểm tổng đã hoàn và khoản còn được hoàn → báo khách số tiền đợt này và thời gian dự kiến.\nĐối chiếu tiền và xu riêng: xu đã dùng cần trả, thưởng cần hủy/thu hồi và các lần đã xử lý → báo kết quả từng khoản; lệch thì nhờ Tech/Kế toán.", "ps": "Đối chiếu với NCC phần tiền/căn cứ còn vướng → gửi Kế toán và CS kết quả.", "fees": "Không hoàn vượt phần được duyệt; tính cả những khoản đang chờ.\nTrả xu đã dùng theo phần dịch vụ hoàn từng đợt, giữ hạn gốc; không vượt xu đã cấn. Nếu thưởng phải thu hồi đã bị tiêu hết, ghi số dư âm phần thiếu và cấn xu tương lai theo đặc tả; không đòi khách nộp tiền mặt hoặc tự trừ vào tiền hoàn.", "result": "Báo số tiền, tình trạng thực tế và thời gian cập nhật; tiếp tục hỗ trợ nếu khách chưa nhận được tiền.\nKhách biết kết quả tiền và xu riêng; nếu xu chưa đúng thì tiếp tục đối soát."}, {"code": "5.10", "title": "KS đã hoàn trực tiếp cho khách", "condition": "KS đã trả tiền mặt/chuyển khoản cho khách trong khi Bookese cũng đang chuẩn bị hoàn.", "cs": "Nhận thông tin, xác minh khách thực nhận bao nhiêu; báo Kế toán và PS đối chiếu trước khi tiếp tục khoản hoàn\nĐối chiếu tiền và xu riêng: xu đã dùng cần trả, thưởng cần hủy/thu hồi và các lần đã xử lý → báo kết quả từng khoản; lệch thì nhờ Tech/Kế toán.", "ps": "Làm rõ với KS/NCC lý do  hồi và các lần đã xử lý → báo kết quả từng khoản; lệch thì nhờ Tech/Kế toán.", "ps": "Không tham gia xử lý nghiệp vụ vé thường lệ.", "fees": "Theo điều kiện vé và số tiền NCC xác nhận; Kế toán thực hiện hoàn.\nXu đã dùng trả theo phần dịch vụ vé được hoàn, giữ hạn lô gốc. Không hủy thưởng của chặng đã bay hợp lệ khi chỉ hoàn chặng khác; Hồng Ngọc Hà xác nhận nghiệp vụ, Bookese xử lý ví xu.", "result": "Báo số tiền, tình trạng thực tế và thời gian cập nhật; tiếp tục hỗ trợ nếu khách chưa nhận được tiền.\nKhách biết kết quả tiền và xu riêng; nếu xu chưa đúng thì tiếp tục đối soát."}, {"code": "5.13", "title": "Ứng trước tiền hoàn cho khách", "condition": "Nguồn cung chưa chuyển tiền về nhưng cần hoàn cho khách sớm", "cs": "Trình người có quyền (CEO) về khoản ứng hoàn → chỉ báo chắc với khách khi đã được duyệt → theo dõi tiền thực trả.\nĐối chiếu tiền và xu riêng: xu đã dùng cần trả, thưởng cần hủy/thu hồi và các lần đã xử lý → báo kết quả từng khoản; lệch thì nhờ Tech/Kế toán.", "ps": "Đối chiếu với NCC phần tiền/căn cứ còn vướng → gửi Kế toán và CS kết quả.", "fees": "Chỉ ứng sau phê duyệt; tách khoản ứng với tiền NCC trả sau để tránh chi trùng.\nXu: kiểm riêng tiến độ và kết quả ví theo phạm vi hoàn đã chốt. Tiền đang chờ/thất bại hoặc được ứng trước không phải căn cứ tự hoàn xu thêm lần nữa; giữ hạn lô gốc.", "result": "Báo số tiền, tình trạng thực tế và thời gian cập nhật; tiếp tục hỗ trợ nếu khách chưa nhận được tiền.\nKhách biết kết quả tiền và xu riêng; nếu xu chưa đúng thì tiếp tục đối soát."}, {"code": "6.1", "title": "Đến muộn bị đánh dấu không đến nhận phòng", "condition": "Khách báo trễ hoặc chuyến bay trễ; chưa chắc KS còn giữ phòng.", "cs": "Nhận giờ đến dự kiến → báo KS/NCC → xác nhận cách nhận phòng muộn và phản hồi khách.\nNếu KS đã bán lại phòng: Xử lý theo case không cung cấp được phòng/overbooking, ưu tiên bố trí chỗ ở cho khách.", "ps": "Phối hợp khi KS/NCC không xác nhận giữ phòng hoặc phát sinh vướng mắc.", "fees": "Không tự phát sinh phí no-show hoặc thu lại tiền phòng chỉ vì khách đến muộn", "result": "Khách nhận được dịch vụ đã chốt hoặc biết phương án thay/hoàn được đồng ý."}, {"code": "6.2", "title": "KS yêu cầu thu thêm trước hoặc khi nhận phòng", "condition": "Tên khoản thu, số tiền, bên thu; đã công bố lúc đặt chưa; là phụ phí, cọc hay tiền phòng bị thu lại.", "cs": "Lấy yêu cầu thu của KS → đối chiếu giá và điều kiện lúc đặt → NCC qua nhờ PS xác nhận căn cứ. Khoản chưa công bố hoặc thu sai thì yêu cầu làm rõ/điều chỉnh; CS báo khoản phải trả và phương án trước khi khách đồng ý.", "ps": "Làm việc với NCC để xác nhận và thống nhất cách xử lý nêu ở cột NCC → gửi phương án, chi phí và kết quả cho CS.", "fees": "Tách phí bắt buộc, dịch vụ tùy chọn và cọc; miễn/bù nếu có căn cứ và duyệt.", "result": "Khách nhận được dịch vụ đã chốt hoặc biết phương án thay/hoàn được đồng ý."}, {"code": "6.3", "title": "Sai tên người ở / thiếu giấy tờ", "condition": "Tên khách không khớp hoặc thiếu điều kiện nhận phòng đã công bố.", "cs": "Xác minh thông tin khách và giấy tờ cần thiết → nhận giải pháp hợp lệ → hướng dẫn khách, không dùng giấy tờ người khác.", "ps": "Làm việc với NCC để xác nhận và thống nhất cách xử lý nêu ở cột NCC → gửi phương án, chi phí và kết quả cho CS.", "fees": "Phí sửa/không nhận theo căn cứ gốc; thiện chí xin miễn phí riêng.", "result": "Khách nhận được dịch vụ đã chốt hoặc biết phương án thay/hoàn được đồng ý."}, {"code": "6.4", "title": "Sai số người, tuổi trẻ em, giường phụ", "condition": "Booking không đủ sức chứa hoặc phát sinh trẻ em chưa khai.", "cs": "Xác nhận số khách, tuổi trẻ em → báo phương án giường/phòng và phí → lấy đồng ý khách.", "ps": "Làm việc với NCC để xác nhận và thống nhất cách xử lý nêu ở cột NCC → gửi phương án, chi phí và kết quả cho CS.", "fees": "Lỗi khai khách khác lỗi hiển thị/mapping; phân trách nhiệm trước tính phí.", "result": "Khách nhận được dịch vụ đã chốt hoặc biết phương án thay/hoàn được đồng ý."}, {"code": "6.5", "title": "KS không đáp ứng yêu cầu đặc biệt", "condition": "Giường đôi, không hút thuốc, tầng cao/view, nhận sớm/trả muộn: là lời nhắn mong muốn hay quyền lợi KS đã xác nhận/khách đã mua?", "cs": "Đối chiếu xác nhận lúc đặt → PS hỏi KS khả năng đáp ứng và phí. Nếu chỉ là yêu cầu thêm, giải thích chưa được bảo đảm; nếu là quyền lợi đã xác nhận, yêu cầu khắc phục hoặc phương án thay → CS chốt với khách.", "ps": "Làm việc với NCC để xác nhận và thống nhất cách xử lý nêu ở cột NCC → gửi phương án, chi phí và kết quả cho CS.", "fees": "Chỉ thu khoản đã báo và khách đồng ý; không hứa miễn do chỉ có ghi chú.", "result": "Khách nhận được dịch vụ đã chốt hoặc biết phương án thay/hoàn được đồng ý."}, {"code": "6.6", "title": "KS không tìm thấy đơn trước chuyến đi hoặc tại quầy", "condition": "Khách gọi kiểm trước chuyến đi hoặc đã tới KS; kiểm tên, ngày ở, mã Bookese và mã NCC nếu có.", "cs": "Gửi xác nhận Bookese → NCC qua PS đối chiếu đơn với KS và lấy xác nhận có phòng → CS báo khách. Nếu thực sự không có phòng thì xử lý theo nhóm overbooking; khách đang ở quầy cần hỗ trợ ngay.", "ps": "Làm việc với NCC để xác nhận và thống nhất cách xử lý nêu ở cột NCC → gửi phương án, chi phí và kết quả cho CS.", "fees": "Chưa thấy đơn không đủ kết luận thu lại/hoàn; phải đối soát nguồn trước.", "result": "Khách nhận được dịch vụ đã chốt hoặc biết phương án thay/hoàn được đồng ý."}, {"code": "6.7", "title": "KS yêu cầu trả lại tiền đã đã trả trước", "condition": "Nguồn chưa thanh toán KS hoặc lễ tân nhầm pay-at-property.", "cs": "Kiểm khoản khách đã thanh toán và xác nhận booking → liên hệ để giải quyết nhận phòng", "ps": "Đối chiếu việc thanh toán với KS, làm rõ khoản công nợ giữa các bên.", "fees": "Nếu đã trả hai lần, xác minh khoản trùng và hoàn đúng bên nhận tiền.", "result": "Khách nhận được dịch vụ đã chốt hoặc biết phương án thay/hoàn được đồng ý."}, {"code": "6.8", "title": "Thông tin phòng sai trước chuyến đi hoặc khi lưu trú", "condition": "Đối chiếu ảnh/mô tả lúc đặt với xác nhận KS hoặc thực tế: diện tích, ảnh phòng, ban công, bồn tắm, view bị khuất và tiện ích chung đóng cửa không báo trước.", "cs": "Lấy ảnh/mô tả lúc đặt và xác nhận KS → PS xác minh khác biệt → CS chốt khắc phục, đổi phòng/KS, giảm giá hoặc hủy/hoàn theo kết quả được duyệt. Phát hiện trước chuyến đi thì chốt phương án trước ngày nhận phòng; báo bộ phận phụ trách sửa thông tin sai.\nKhi có hoàn/giảm: xác nhận phạm vi phòng/đêm, kiểm số xu được trả và thưởng điều chỉnh → báo cùng kết quả tiền; xu lệch thì nhờ Tech/Kế toán.", "ps": "Làm việc với NCC để xác nhận và thống nhất cách xử lý nêu ở cột NCC → gửi phương án, chi phí và kết quả cho CS.", "fees": "Giảm/hoàn theo phần thiếu và phương án được duyệt; không mặc định tỷ lệ bù.\nXu: trả xu đã dùng theo phần dịch vụ được hoàn, không chia đều nếu giá phòng/đêm khác nhau. Trước hoàn tất: hủy lô thưởng CHỜ cũ, tính lô cho phần giữ. Sau hoàn tất: thu hồi phần thưởng đã cấp tương ứng; giữ hạn lô xu trả.", "result": "Khách nhận được dịch vụ đã chốt hoặc biết phương án thay/hoàn được đồng ý."}, {"code": "6.9", "title": "Thiếu quyền lợi hoặc phòng bẩn, có mùi, thiết bị hỏng", "condition": "Kiểm quyền lợi đã xác nhận; ảnh phòng bẩn, mùi, thiết bị hỏng hoặc xuống cấp; mức ảnh hưởng và kết quả dọn/sửa trước đó.", "cs": "Nhận ảnh và phản ánh → yêu cầu KS bổ sung quyền lợi, dọn/sửa hoặc đổi phòng. Nếu đã khắc phục vẫn không đạt, nhờ PS xác nhận phương án đổi KS/giảm giá/hoàn phần phù hợp → CS chốt với khách; ưu tiên an toàn nếu có nguy cơ.\nKhi có hoàn/giảm: xác nhận phạm vi phòng/đêm, kiểm số xu được trả và thưởng điều chỉnh → báo cùng kết quả tiền; xu lệch thì nhờ Tech/Kế toán.", "ps": "Làm việc với NCC để xác nhận và thống nhất cách xử lý nêu ở cột NCC → gửi phương án, chi phí và kết quả cho CS.", "fees": "Hoàn quyền lợi thiếu theo giá/căn cứ thỏa thuận, không tự ấn định tỷ lệ.\nXu: trả xu đã dùng theo phần dịch vụ được hoàn, không chia đều nếu giá phòng/đêm khác nhau. Trước hoàn tất: hủy lô thưởng CHỜ cũ, tính lô cho phần giữ. Sau hoàn tất: thu hồi phần thưởng đã cấp tư // Staff assistance is distinct from customer self-service; both update the same booking.
const assistKinds={name:'Đổi tên người lưu trú',special:'Yêu cầu đặc biệt / giờ đến',invoice:'Bổ sung / điều chỉnh hóa đơn',voucher:'Lấy lại xác nhận đặt phòng',change:'Đổi ngày / thêm phòng / gia hạn',cancel:'Hủy / xin miễn giảm phí',refund:'Theo dõi hoàn tiền / xu',payment:'Thanh toán / booking treo',over:'Overbooking / không có phòng',complaint:'Khiếu nại trước, trong, sau lưu trú',flight:'Vé máy bay · Hồng Ngọc Hà',advice:'Tư vấn giá / thanh toán'};
const assistRoutes={change:'S07',cancel:'S08',refund:'S09',payment:'S03',over:'S06',flight:'S12'};
function assistStore(){return st.assist||(st.assist={requests:[],active:null,kind:'name',filter:'Tất cả'});}
function assistCurrent(){return assistStore().requests.find(r=>r.id===assistStore().active);}
function assistEvent(r,text){r.events.unshift({at:stamp(),by:st.role,text});log(r.id+' · '+text);}
function assistOwner(r){if(r.kind==='flight')return 'CS';if(['invoice','refund','payment'].includes(r.kind))return 'Kế toán';return r.urgent&&Date.now()-new Date(r.detected).getTime()<=86400000?'CS':'PS';}
function assistDate(hours=0){return new Date(Date.now()+hours*3600000+7*3600000).toISOString().slice(0,16);}
function assistCases(kind){const pick={name:['6.3'],special:['6.1','6.5'],invoice:['8.1'],voucher:['1.1','1.2'],change:['4.'],cancel:['3.'],refund:['5.'],payment:['1.3','1.4','1.5','1.6','1.7','1.8','1.9','1.10','1.11','1.12','1.13','1.14','1.15','1.16','1.19'],over:['2.'],complaint:['6.','8.'],flight:['7.','5.12'],advice:['1.17','1.18']};return assistCatalog.filter(c=>(pick[kind]||[]).some(x=>x.endsWith('.')?c.code.startsWith(x):c.code===x));}
function assistNewForm(){const a=assistStore(),k=a.kind;return `<form id="assist-intake"><div class="grid">${select('Khách cần hỗ trợ gì?','assist-kind',Object.values(assistKinds),assistKinds[k])}${select('Tình huống tham khảo','assist-case',assistCases(k).map(c=>c.code+' · '+c.title))}${select('Kênh tiếp nhận','assist-channel',['Điện thoại','Tin nhắn','Email','Khách gửi trên website'])}${field('Người liên hệ','assist-caller','text','','Tên và quan hệ với người đặt.',true)}${field('Tham chiếu yêu cầu / bằng chứng đồng ý','assist-evidence','text','','Mã email/chat/cuộc gọi; không ghi thông tin thẻ.',true)}${select('Mức độ','assist-urgent',['Thông thường','Gấp · cần giải quyết ngay'])}${field('Phát hiện lúc T','assist-detected','datetime-local',assistDate(),'',true)}${field('Hẹn cập nhật khách','assist-due','datetime-local',assistDate(2),'Giờ Việt Nam; CS chủ động hẹn.',true)}${textfield('Khách muốn giải quyết điều gì?','assist-note','',true)}</div>${tick('Đã đối chiếu người liên hệ với thông tin đặt chỗ hoặc căn cứ được chủ đơn ủy quyền','assist-verified')}<p class="note">Tiếp nhận chưa thay đổi booking. Đổi tên/ngày, hủy hoặc thao tác có tiền cần khách đồng ý đúng nội dung ở bước thực hiện.</p><button class="primary" ${st.role!=='CS'?'disabled':''}>Tiếp nhận & mở xử lý</button></form>`;}
function assistResult(r){if(r.command&&r.kind==='name')return r.command.state==='Đã đồng bộ'?{ok:true,text:'Đã cập nhật '+assistKinds[r.kind]}:{ok:false,text:r.command.state};if(r.kind==='change')return {ok:!!ops().exchange?.done,text:ops().exchange?.status||'Chưa tạo phương án đổi'};if(r.kind==='cancel')return {ok:st.cancel?.status==='Đã hủy',text:st.cancel?.status||'Chưa gửi hủy'};if(r.kind==='refund')return {ok:st.refund?.status==='Khách đã nhận tiền'&&!!st.refund?.coins,text:st.refund?st.refund.status+' · xu '+(st.refund.coins?'đã xử lý':'chưa xử lý'):'Chưa có kết quả hoàn'};if(r.kind==='over')return {ok:!!ops().over?.closed,text:ops().over?.status||'Chưa có phương án'};if(r.kind==='invoice')return {ok:!!r.invoiceOutcome||ops().invoice?.status==='Đã xuất'&&!ops().invoice?.correction,text:r.invoiceOutcome||(ops().invoice?.correction?'Chờ xử lý điều chỉnh hóa đơn':ops().invoice?.status)||'Chưa có thông tin hóa đơn'};if(r.kind==='flight')return {ok:!!r.flightOutcome,text:r.flightOutcome||'Chưa đối chiếu kết quả thực hiện Hồng Ngọc Hà'};if(r.kind==='payment')return {ok:['success','failed'].includes(st.scenario),text:bookingState()+' · xem kết quả tra soát'};if(r.kind==='voucher')return {ok:!!r.voucher,text:r.voucher?'Đã có bản xác nhận để cung cấp khách':'Chưa lấy bản xác nhận'};if(r.kind==='special')return {ok:!!ops().specialConfirmed,text:ops().specialReply||'Chờ phản hồi yêu cầu đặc biệt'};return {ok:!!r.resolution,text:r.resolution||'Chưa có kết luận'};}
function assistGuide(r){const c=assistCatalog.find(c=>c.code===r.caseCode);return c?`<details class="ops-fold"><summary>Hướng xử lý case ${esc(c.code)} · ${esc(c.title)}</summary>${kv([['Kiểm tra',esc(c.condition)],['CS thực hiện',esc(c.cs)],['PS / NCC',esc(c.ps)],['Phí / hoàn',esc(c.fees)],['Kết quả cần báo',esc(c.result)]])}<p>Áp dụng quy tắc Bookese cập nhật: reconfirm tùy chọn, xu theo dịch vụ hoàn, vé làm Hồng Ngọc Hà. Không tự tạo cam kết ngoài chính sách.</p></details>`:'';}
function assistEditForm(r){const o=ops();let fields='';if(r.kind==='name')fields=kv([['Tên hiện tại',esc(o.guest)]])+field('Tên người lưu trú mới','assist-value','text',o.guest,'Chỉ thay người lưu trú, không đổi chủ tài khoản.',true);if(r.kind==='special')fields=kv([['Yêu cầu hiện tại',esc(o.special||'Chưa có')]])+textfield('Yêu cầu mới / giờ đến','assist-value',o.special||'',true);if(r.kind==='invoice')fields=`<div class="grid">${field('Tên xuất hóa đơn','assist-invoice-name','text',o.invoice?.name||'','',true)}${field('Mã số thuế','assist-invoice-tax','text',o.invoice?.tax||'')}${field('Địa chỉ','assist-invoice-address','text',o.invoice?.address||'','',true)}${field('Email nhận hóa đơn','assist-invoice-email','email',o.invoice?.email||'','',true)}</div><p>Xuất trong ngày thanh toán. Đã xuất → đề nghị điều chỉnh; quá ngày → Kế toán kiểm tra ngoại lệ.</p>`;
 const block=r.kind==='invoice'?'':selfEditBlock();return `${block?alert(block):''}<form id="assist-preview">${fields}${tick('Khách đã yêu cầu và đồng ý nội dung thay đổi này','assist-consent')}<button class="primary" ${block||st.role!=='CS'||r.command&&r.command.state!=='NCC từ chối'?'disabled':''}>Xem trước thay đổi</button></form>${r.draft?card('Xem trước · chưa cập nhật',`<p><b>Trước:</b> ${esc(r.draft.before)}</p><p><b>Sau:</b> ${esc(r.draft.summary)}</p><p>Căn cứ: ${esc(r.evidence)} · CS thực hiện theo yêu cầu ${esc(r.id)}.</p><details><summary>Kết quả NCC mô phỏng</summary>${select('Kết quả cập nhật','assist-mock',['Thành công','Đang xử lý','NCC từ chối'])}</details>${btn('Xác nhận thực hiện','assist-execute','primary',st.role!=='CS')}`):''}${r.command?card('Kết quả cập nhật',`<p>${badge(r.command.state,r.command.state==='Đã đồng bộ'?'good':'warn')} · ${esc(r.command.id)}</p><p>${r.command.state==='Đã đồng bộ'?'Dữ liệu hiện tại đã cập nhật ở CS, phía khách và thông tin NCC.':'Chưa thay dữ liệu hiện tại. Không gửi lại lệnh khi chưa rõ kết quả.'}</p>${r.command.state==='Đang xử lý'?`<details open><summary>Tra cứu kết quả mô phỏng cùng mã lệnh</summary>${select('Kết quả tra cứu cập nhật','assist-query-result',['Đang xử lý','Thành công','NCC từ chối'])}${btn('Tra cứu lại cùng mã','assist-query')}</details>`:''}`):''}`;}

 const route=assistRoutes[r.kind];return `<p>${({change:'CS kiểm tra chỗ/giá, giữ mới → khách trả phát sinh → hủy miễn phí cũ → xuất mới. Không chuyển khách tự xử lý khi đã tiếp nhận hỗ trợ.',cancel:'CS kiểm thời điểm khách liên hệ, phạm vi, điều kiện và miễn giảm từ NCC; báo phí/tiền/xu rồi thực hiện sau khách đồng ý.',refund:'CS đối chiếu quyền lợi, theo dõi Kế toán và báo mã/trạng thái hoàn; không tự chuyển trạng thái đã nhận tiền.',payment:'CS kiểm giao dịch, làm rõ tiền hay NCC đang treo; Kế toán/Tech xác minh. Không yêu cầu khách trả lần hai khi chưa rõ tiền.',over:'CS ghi nhận ảnh hưởng. Ca gấp trong T+24h: CS làm NCC; ca thường/sau T+24h: PS tìm giải pháp. CS chốt với khách và theo dõi đến khi có phòng.',complaint:'Ghi rõ phần dịch vụ bị ảnh hưởng, điều đã mua, bằng chứng và mong muốn. Phối hợp NCC khắc phục/đổi phòng/phương án thay; tiền hoàn đi theo luồng có căn cứ.',flight:'CS trực tiếp Hồng Ngọc Hà: kiểm điều kiện, báo giá, khách đồng ý, NCC thực hiện rồi đối chiếu vé mới/hoàn. Không dùng thao tác đổi tên lưu trú cho vé.',advice:'Đối chiếu cùng ngày, hạng, thuế/phụ thu, điều kiện và ưu đãi; hướng dẫn phương thức thanh toán đang hỗ trợ. Không tự hứa khớp giá hoặc thu tiền mặt.'})[r.kind]}</p>${route?`<a class="ops-button" href="#${route}">Mở nghiệp vụ: ${esc(assistKinds[r.kind])} →</a>`:''}<p><b>Kết quả nghiệp vụ:</b> ${esc(assistResult(r).text)}</p>${['change','cancel','refund','over'].includes(r.kind)?btn('Cập nhật kết quả về yêu cầu','assist-refresh'):''}${r.kind==='flight'?`<form id="assist-flight-outcome"><h3>Đối chiếu kết quả thực hiện từ Hồng Ngọc Hà</h3>${textfield('Kết quả vé / hành trình / dịch vụ thực tế','assist-flight-result','',true)}${field('Mã vé mới / PNR / chứng từ kết quả','assist-flight-proof','text','','',true)}${tick('Đã đối chiếu khách đồng ý, báo giá và kết quả NCC thực hiện','assist-flight-checked')}<p>Ghi kết quả nghiệp vụ không xác nhận tiền đã hoàn. Khoản hoàn theo S12/S09 và Kế toán; phí chưa chốt không tự lập hoàn cuối cùng.< function assistCoordination(r){return `${r.kind==='invoice'?`<form id="assist-invoice-outcome"><h3>Kế toán ghi kết quả xử lý hóa đơn</h3>${textfield('Kết quả điều chỉnh / xử lý ngoại lệ thực tế','assist-invoice-outcome-note','',true)}${field('Tham chiếu chứng từ / hóa đơn điều chỉnh','assist-invoice-outcome-proof','text','','',true)}<p>Giữ hóa đơn gốc, không tự xuất lùi ngày. Chỉ ghi nhận kết quả đã thực hiện có chứng từ.</p><button ${st.role!=='Kế toán'?'disabled':''}>Ghi nhận kết quả Kế toán</button></form>`:''}<form id="assist-handoff"><div class="grid">${select('Phối hợp với','assist-team',['PS','Kế toán','Tech','NCC / khách sạn','Hồng Ngọc Hà','Khách'],r.kind==='flight'?'Hồng Ngọc Hà':assistOwner(r))}${field('Hẹn có phản hồi','assist-follow-due','datetime-local',r.due,'',true)}${textfield('Cần kiểm tra / xử lý cụ thể','assist-follow-note','',true)}${field('Tham chiếu trao đổi đã thực hiện','assist-follow-ref','text','','Mã email/chat/cuộc gọi; demo không gửi tin.',true)}</div><button ${st.role!=='CS'?'disabled':''}>Lưu nội dung đã phối hợp</button></form><form id="assist-response"><h3>Ghi nhận phản hồi ${r.team?esc(r.team):'bên liên quan'}</h3>${textfield('Nội dung phản hồi / phương án','assist-response-note','',true)}${field('Bằng chứng / mã phản hồi','assist-response-ref','text','','',true)}<button ${!['CS',r.owner].includes(st.role)?'disabled':''}>Lưu phản hồi để CS xử lý tiếp</button></form>${r.response?alert(esc(r.response.note)+' · '+esc(r.response.ref),'info'):''}`;}
function assistFinish(r){const result=assistResult(r);return `<form id="assist-report">${select('Kết quả trao đổi với khách','assist-report-stage',['Cập nhật tiến độ · còn chờ','Khách cần bổ sung / cân nhắc','Khách đồng ý phương án','Khách không đồng ý · tiếp tục xử lý','Đã giải quyết và đã báo khách'])}${textfield('Nội dung đã báo khách','assist-public-note','',true)}${field('Tham chiếu tin nhắn/email/cuộc gọi đã báo','assist-public-ref','text','','Không bao gồm ghi chú nội bộ.',true)}${field('Hẹn cập nhật tiếp (nếu còn chờ)','assist-next-due','datetime-local',r.due)}<p>Hiện tại: ${esc(result.text)}. Chỉ kết thúc khi có kết quả đủ căn cứ; khoản tiền/xu còn chờ vẫn theo dõi riêng.</p><button class="primary" ${st.role!=='CS'?'disabled':''}>Lưu kết quả trao đổi với khách</button></form>`;}
function assistWorkspace(){const a=assistStore(),r=assistCurrent();return `<div class="assist-top"><div><h2>CS hỗ trợ khách trên booking</h2><p>${esc(r?.booking||(a.kind==='flight'?'FL-DEMO-0001':st.activeBooking))} · Khách liên hệ → CS thực hiện → nhận kết quả → báo khách</p></div>${link('← Chi tiết đơn',r?.kind==='flight'?'S12':'S02')}</div><div class="assist-layout"><section class="card assist-requests"><h2>Yêu cầu trên đơn</h2>${btn('+ Tiếp nhận yêu cầu','assist-new','primary')}<p>Mỗi yêu cầu có tiến độ riêng.</p>${a.requests.length?a.requests.map(x=>`<button class="assist-request ${x.id===r?.id?'active':''}" data-assist-id="${x.id}"><b>${esc(x.id)} · ${esc(assistKinds[x.kind])}</b><span>${esc(x.status)}</span><small>${esc(x.channel)} · ${esc(x.caller)}<br>${x.status!=='Đã xong'?'Đang xử lý: '+esc(x.owner):'Đã kết thúc'} · ${esc(x.at)}</small></button>`).join(''):'<p>Chưa tiếp nhận yêu cầu. CS có thể làm thay khách ngay tại đây.</p>'}</section><div>${!r?card('Tiếp nhận khi khách gọi / nhắn / email',assistNewForm()):card(assistKinds[r.kind],`<div class="row spread">${badge(r.status,r.status==='Đã xong'?'good':'warn')}<span>${esc(r.id)} · ${esc(r.channel)}</span></div><p>${esc(r.note)}</p>${kv([['Người liên hệ',esc(r.caller)],['Xác minh / căn cứ',esc(r.evidence)],['Đầu mối hiện tại',esc(r.owner)],['Hẹn khách',esc(r.due).replace('T',' ')],['Mức độ',r.urgent?'Gấp · T+24h':'Thông thường']])}${assistGuide(r)}`)+(r.status==='Đã xong'?card('Kết quả đã xử lý',`<p>${esc(r.resolution||assistResult(r).text)}</p>${btn('Mở lại để tiếp tục hỗ trợ','assist-reopen')}`):card('Thực hiện nghiệp vụ',assistRoutePanel(r))+`<details class="card"><summary>Phối hợp PS / Kế toán / NCC và nhận phản hồi</summary>${assistCoordination(r)}</details>`+card('Báo khách & cập nhật tiến độ',assistFinish(r)))+(r?card('Lịch sử yêu cầu',table(['Lúc','Người','Nội dung'],r.events.map(e=>[esc(e.at),esc(e.by),esc(e.text)]))):'')}</div></div>`;}
function assistIntake(v){if(!allowed(['CS']))return false;if(!v['assist-verified']||!v['assist-caller']?.trim()||!v['assist-evidence']?.trim()||!v['assist-note']?.trim())return toast('Cần xác minh người liên hệ, nội dung và căn cứ yêu cầu.');if(new Date(v['assist-due'])<=new Date()||new Date(v['assist-detected'])>new Date())return toast('Kiểm tra thời điểm phát hiện và hẹn phản hồi tương lai.');const a=assistStore(),kind=Object.keys(assistKinds).find(k=>assistKinds[k]===v['assist-kind']);if(!kind)return;const r={id:'YC-'+String(a.requests.length+1).padStart(3,'0'),booking:kind==='flight'?'FL-DEMO-0001':st.activeBooking,kind,caseCode:(v['assist-case']||'').split(' · ')[0],channel:v['assist-channel'],caller:v['assist-caller'],evidence:v['assist-evidence'],note:v['assist-note'],due:v['assist-due'],detected:v['assist-detected'],urgent:v['assist-urgent'].startsWith('Gấp'),owner:'CS',status:'Mới tiếp nhận',at:stamp(),events:[],publicUpdates:[]};a.requests.push(r);a.active=r.id;if(kind==='over'&&!ops().over)ops().over={need:r.note,urgent:r.urgent,detected:r.detected,status:'Cần xác minh NCC / tìm phương án',options:[],selected:null,events:[]};assistEvent(r,'CS tiếp nhận và xác minh yêu cầu qua '+r.channel);render();return true;}
function assistPreview(v){const r=assistCurrent();if(!r||!allowed(['CS'])||r.status==='Đã xong')return;if(r.command&&r.command.state!=='NCC từ chối')return toast('Đang có kết quả cập nhật; không gửi lặp.');if(r.kind!=='invoice'&&selfEditBlock())return toast(selfEditBlock());if(!v['assist-consent'])return toast('Cần xác nhận khách đồng ý đúng thay đổi.');let payload,summary,before;if(r.kind==='invoice'){payload={name:v['assist-invoice-name'],tax:v['assist-invoice-tax'],address:v['assist-invoice-address'],email:v['assist-invoice-email']};if(!payload.name?.trim()||!payload.address?.trim()||!/^\S+@\S+\.\S+$/.test(payload.email||''))return toast('Kiểm tra tên, địa chỉ và email hóa đơn.');summary=payload.name+' · '+payload.address+' · '+payload.email;before=ops().invoice?.name||'Chưa bổ sung';}else{payload=(v['assist-value']||'').trim();if(!payload)return toast('Vui lòng nhập nội dung mới.');summary=payload;before=r.kind==='name'?ops().guest:ops().special||'Chưa có';}r.draft={payload,summary,before,version:JSON.stringify(r.kind==='invoice'?ops().invoice:r.kind==='name'?ops().guest:ops().special)};save();render();}
function assistExecute(result,query=false){const r=assistCurrent();if(!r||!allowed(['CS'])||!r.draft||r.status==='Đã xong')return false;if(query&&r.command?.state!=='Đang xử lý'||!query&&r.command&&r.command.state!=='NCC từ chối')return false;if(r.kind!=='invoice'&&selfEditBlock()){toast(selfEditBlock());return false;}const current=JSON.stringify(r.kind==='invoice'?ops().invoice:r.kind==='name'?ops().guest:ops().special);if(current!==r.draft.version){toast('Dữ liệu đã được cập nhật ở nơi khác. Xem lại trước khi thực hiện.');r.draft=null;save();return false;}r.command={id:query?r.command.id:'UPDATE-'+r.id+'-'+(r.attempt=(r.attempt||0)+1),state:result==='Thành công'?'Đã đồng bộ':result};if(result==='Thành công'){const o=ops();if(r.kind==='name')o.guest=r.draft.payload;if(r.kind==='special'){o.special=r.draft.payload;o.specialReply='';o.specialConfirmed=false;}if(r.kind==='invoice'){if(o.invoice?.status==='Đã xuất'){o.invoice.correction=true;o.invoice.correctionRequest=r.draft.payload;}else o.invoice={...r.draft.payload,at:stamp(),late:invoiceLate(),status:invoiceLate()?'Gửi sau ngày thanh toán · Kế toán kiểm tra':'Chờ xuất trong ngày thanh toán 24/09/2026'};}r.status=r.kind==='special'?'Chờ NCC':r.kind==='invoice'?'Chờ Kế toán':'Chờ báo khách';r.owner=r.kind==='invoice'?'Kế toán':r.kind==='special'?assistOwner(r):'CS';integration('CS hỗ trợ: '+assistKinds[r.kind],r.draft.summary+' · '+r.id,r.kind==='special'?'Đã gửi · chờ KS phản hồi':'Đã đồng bộ');}else{r.status=result==='Đang xử lý'?'Chờ NCC':'NCC từ chối · CS xử lý tiếp';r.owner='CS';}assistEvent(r,r.command.id+' · '+r.command.state);render();return true;}

 const overviewBefore=views.S02;views.S02=()=>card('Khách đang liên hệ cần hỗ trợ?',`<p>CS xử lý ngay trên đơn: đổi tên, yêu cầu đặc biệt, hóa đơn, xác nhận, đổi/hủy/hoàn hoặc sự cố.</p><a class="ops-button" href="#S22">CS hỗ trợ / thao tác cho khách →</a><p>${assistStore().requests.filter(r=>r.status!=='Đã xong').length} yêu cầu đang mở · ${link('Xem phía khách (kiểm tra hiển thị)','S14')}</p>`)+overviewBefore();
 const oldSupportView=views.S05;views.S05=()=>card('Tiếp nhận và xử lý yêu cầu',`<p>Dùng luồng CS hỗ trợ để theo dõi nhiều yêu cầu, thực hiện nghiệp vụ và báo kết quả.</p><a class="ops-button" href="#S22">Mở CS hỗ trợ khách →</a>`)+oldSupportView();
 const oldList=views.S01;views.S01=()=>card('Tiếp nhận khi khách liên hệ',`<p>Tìm đúng booking bên dưới, mở chi tiết rồi chọn <b>CS hỗ trợ / thao tác cho khách</b>. Chưa tìm thấy đơn hoặc khách chỉ có chứng từ trừ tiền: ${link('tra soát thanh toán →','S03')}</p>`)+oldList();
 const oldFlight=views.S12;views.S12=()=>card('Khách liên hệ về vé',`<p>CS tiếp nhận, xác minh và theo dõi phản hồi trực tiếp Hồng Ngọc Hà.</p>${btn('Tiếp nhận hỗ trợ vé','assist-flight','primary')}`)+oldFlight();
 for(const [s,team] of [['S17','PS'],['S18','Kế toán']]){const original=views[s];views[s]=()=>assistTasks(team)+original();}
 const oldCustomer=views.S14;views.S14=()=>oldCustomer()+assistCustomerUpdates();
 const oldWork=bookingWork;bookingWork=s=>oldWork(s).concat((s.assist?.requests||[]).filter(r=>r.status!=='Đã xong').map(r=>({group:'Yêu cầu cần xử lý',label:r.id+' · '+assistKinds[r.kind]+' · '+r.status,to:'S22'})));
 actions['assist-new']=()=>{assistStore().active=null;save();render();};actions['assist-flight']=()=>{assistStore().active=null;assistStore().kind='flight';save();go('S22');};
 submits['assist-flight-outcome']=v=>{const r=assistCurrent();if(!r||r.kind!=='flight'||!allowed(['CS'])||!v['assist-flight-checked']||!v['assist-flight-result']?.trim()||!v['assist-flight-proof']?.trim())return toast('Cần kết quả, chứng từ và đối chiếu khách đồng ý.');r.flightOutcome=v['assist-flight-result']+' · '+v['assist-flight-proof'];r.status='Chờ báo khách';assistEvent(r,'Đối chiếu Hồng Ngọc Hà: '+r.flightOutcome);render();};
 submits['assist-intake']=assistIntake;submits['assist-preview']=assistPreview;
 actions['assist-execute']=()=>assistExecute(document.querySelector('#assist-mock').value);actions['assist-query']=()=>assistExecute(document.querySelector('#assist-query-result').value,true);
 actions['assist-voucher']=()=>{const r=assistCurrent();if(!r||!allowed(['CS'])||st.scenario!=='success'||selfEditBlock())return;r.voucher=true;r.status='Chờ báo khách';assistEvent(r,'Lấy xác nhận hiện tại; chưa gửi email');render();};
 actions['assist-relocation']=()=>{const r=assistCurrent();if(!r||!allowed(['CS']))return;if(!ops().over)ops().over={need:r.note,urgent:r.urgent,detected:r.detected,status:'Cần xác minh NCC / tìm phương án',options:[],selected:null,events:[]};assistEvent(r,'Chuyển xử lý phương án phòng thay');go('S06');};
 actions['assist-refresh']=()=>{const r=assistCurrent();if(!r||!allowed(['CS']))return;const result=assistResult(r);r.status=result.ok?'Chờ báo khách':'Đang xử lý nghiệp vụ';r.owner='CS';assistEvent(r,'Đối chiếu tiến độ: '+result.text);render();};
 actions['assist-reopen']=()=>{const r=assistCurrent();if(!r||!allowed(['CS']))return;r.status='Đang xử lý';r.owner='CS';assistEvent(r,'Mở lại theo phản hồi khách');render();};
 submits['assist-handoff']=v=>{const r=assistCurrent();if(!r||!allowed(['CS']))return;if(!v['assist-follow-note']?.trim()||!v['assist-follow-ref']?.trim()||new Date(v['assist-follow-due'])<=new Date())return toast('Cần nội dung, tham chiếu và hẹn phản hồi tương lai.');const team=v['assist-team'];if(team==='PS'&&r.urgent&&assistOwner(r)==='CS')return toast('Ca gấp trong T+24h: CS trực tiếp xử lý với NCC và giữ đầu mối khách; ghi kết quả trao đổi NCC tại đây.');if(r.kind==='flight'&&team==='PS')return toast('Nghiệp vụ vé: CS làm trực tiếp Hồng Ngọc Hà.');r.team=team;r.owner=['PS','Kế toán'].includes(team)?team:'CS';r.status='Chờ '+team;r.due=v['assist-follow-due'];r.handoff={note:v['assist-follow-note'],ref:v['assist-follow-ref']};assistEvent(r,'Đã trao đổi với '+team+': '+r.handoff.note+' · '+r.handoff.ref);render();};
 submits['assist-invoice-outcome']=v=>{const r=assistCurrent();if(!r||r.kind!=='invoice'||!allowed(['Kế toán'])||!v['assist-invoice-outcome-note']?.trim()||!v['assist-invoice-outcome-proof']?.trim())return;r.invoiceOutcome=v['assist-invoice-outcome-note']+' · '+v['assist-invoice-outcome-proof'];if(ops().invoice)ops().invoice.correctionResult=r.invoiceOutcome;r.status='Có phản hồi · CS kiểm tra';r.owner='CS';assistEvent(r,'Kế toán: '+r.invoiceOutcome);render();};
 submits['assist-response']=v=>{const r=assistCurrent();if(!r||!allowed(['CS',r.owner])||!v['assist-response-note']?.trim()||!v['assist-response-ref']?.trim())return;const note=v['assist-response-note'];r.response={note,ref:v['assist-response-ref'],at:stamp()};if(r.kind==='special'){ops().specialReply=note;ops().specialConfirmed=true;integration('Phản hồi yêu cầu đặc biệt qua CS',note);}r.status='Có phản hồi · CS kiểm tra';r.owner='CS';assistEvent(r,'Nhận phản hồi: '+note+' · '+r.response.ref);render();};
 submits['assist-report']=v=>{const r=assistCurrent();if(!r||!allowed(['CS']))return;const stage=v['assist-report-stage'],text=v['assist-public-note']?.trim(),ref=v['assist-public-ref']?.trim(),done=stage==='Đã giải quyết và đã báo khách';if(!text||!ref)return toast('Cần nội dung đã báo và tham chiếu trao đổi.');if(done&&!assistResult(r).ok){if(['complaint','advice'].includes(r.kind)&&r.response)r.resolution=r.response.note;else return toast('Chưa có kết quả đủ căn cứ. Tiếp tục xử lý hoặc ghi phản hồi trước khi kết thúc.');}if(!done&&new Date(v['assist-next-due'])<=new Date())return toast('Cần hẹn cập nhật tiếp trong tương lai.');r.publicUpdates.unshift({at:stamp(),text,ref,channel:r.channel});r.status=done?'Đã xong':stage.startsWith('Khách cần')?'Chờ khách':stage.startsWith('Khách không')?'Khách chưa đồng ý · tiếp tục xử lý':stage.startsWith('Khách đồng')?'Khách đồng ý · chờ thực hiện':r.status;r.due=done?r.due:v['assist-next-due'];if(done)r.resolution=r.resolution||assistResult(r).text;assistEvent(r,'Đã báo khách qua '+r.channel+': '+text+' · '+ref);render();};
 const oldBind=bindOps;bindOps=()=>{oldBind();const kind=document.getElementById('assist-kind');if(kind)kind.onchange=()=>{assistStore().kind=Object.keys(assistKinds).find(k=>assistKinds[k]===kind.value);save();render();};document.querySelectorAll('[data-assist-id]').forEach(el=>el.onclick=()=>{assistStore().active=el.dataset.assistId;save();go('S22');});};
}

initAssistedService();
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});actions['flight-service']=()=>document.getElementById('flight-service')?.scrollIntoView({behavior:'smooth',block:'start'});
render();
</script></body></html>
