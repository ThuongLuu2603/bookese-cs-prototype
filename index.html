<body><div id="app"></div><dialog id="flow" aria-labelledby="flow-title"></dialog><div id="toast" role="status" aria-live="polite"></div><script>'use strict';

const KEY='bookese-order-first-20261005-v1';
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>Number(v||0).toLocaleString('vi-VN')+' đ';
const stamp=()=>new Date().toLocaleString('vi-VN');
const demoDay='2026-10-05';
function seed(){
 const base={customer:'Nguyễn An',email:'an.demo@example.com',phone:'0900 000 001',created:demoDay,paidDate:demoDay,booking:'Thành công',payment:'Đã thu',service:'Có hiệu lực',requests:[],history:[],refunds:[],extras:[],invoice:null,reconfirmed:'',special:'',reward:'Đang chờ',source:'Extranet',paid:4200000,gross:4400000,voucher:0,coins:200000,member:'',name:'Nguyễn An',ttl:true};
 const hotel=(id,title)=>({...structuredClone(base),id,type:'hotel',title,start:'2026-10-12',end:'2026-10-14',room:'2 phòng Deluxe · 4 người lớn · Bữa sáng',contact:'Khách sạn Biển Xanh',hotelPhone:'0236 000 0123',hotelEmail:'reservation@example.com',supplierId:'KS-DEMO-2409',free:true});
 const flight=(id)=>({...structuredClone(base),id,type:'flight',title:'Hồ Chí Minh → Hà Nội',start:'2026-10-15',end:'2026-10-15',name:'NGUYEN AN',paid:990000,gross:1050000,voucher:50000,coins:10000,contact:'Hồng Ngọc Hà',source:'API',pnr:'DEMO26',ticket:'738-DEMO-00001',airline:'Vietnam Airlines',flight:'VN-DEMO',departure:'09:00',arrival:'11:10',baggage:'Xách tay 7 kg · Ký gửi 23 kg',seat:'Chưa chọn',supplierId:'DEMO26',free:false});
 const a=hotel('BK-2409','Khách sạn Biển Xanh'),b=flight('FL-0001'),c=hotel('BK-2410','Khách sạn Biển Xanh'),d=hotel('BK-2411','Khách sạn Biển Xanh'),e=flight('FL-0002');
 a.requests=[{id:'YC-101',kind:'change',stage:'new',note:'Khách muốn dời sang 15–17/10, giữ 2 phòng.',origin:'Khách hàng',at:stamp()}];
 b.requests=[{id:'YC-102',kind:'refund',stage:'new',note:'Khách cần hủy chuyến đi; xin kiểm tra điều kiện hoàn.',origin:'Khách hàng',at:stamp()}];
 c.requests=[{id:'YC-103',kind:'over',stage:'new',note:'Khách sạn báo hết phòng, cần tìm chỗ thay thế cho khách.',origin:'CS',at:stamp()}];
 d.booking='Đang xử lý';d.payment='Chưa xác minh';d.service='Đang giữ chỗ';d.requests=[{id:'YC-104',kind:'payment',stage:'new',note:'Khách báo đã bị trừ tiền nhưng booking chưa thành công.',origin:'Khách hàng',at:stamp()}];
 e.booking='Đang xử lý';e.service='Chưa xuất vé';e.requests=[{id:'YC-105',kind:'issue',stage:'new',note:'Đã thu tiền; chưa nhận số vé từ NCC.',origin:'Hệ thống',at:stamp()}];e.ticket='Chưa xuất';
 for(const o of [a,b,c,d,e])o.history=[{at:stamp(),actor:'Hệ thống',text:'Tạo dữ liệu booking minh họa; chưa kết nối hệ thống thật.'}];
 return {orders:[a,b,c,d,e],seq:110,mode:'cs',filter:'all',serviceFilter:'all'};
}
let state;try{state=JSON.parse(localStorage.getItem(KEY))||seed()}catch{state=seed()}
let route=location.hash.slice(1)||'list',query='',panel=null;
let filters={code:'',hotel:'',guest:'',phone:''};
if(!['all','processing','success','failed'].includes(state.filter))state.filter='all';
const statusTabs=[['all','Tất cả'],['processing','Đang xử lý'],['success','Thành công'],['failed','Thất bại']];
const normalize=v=>String(v||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,'d').toLowerCase().trim();
const phoneKey=v=>String(v||'').replace(/\D/g,'').replace(/^84/,'0');
const matchStatus=(o,v)=>v==='all'||o.booking===Object.fromEntries(statusTabs)[v];
function filteredOrders(){return state.orders.filter(o=>(state.serviceFilter==='all'||o.type===state.serviceFilter)&&normalize(o.id).includes(normalize(filters.code))&&(!filters.hotel||o.type==='hotel'&&normalize(o.title).includes(normalize(filters.hotel)))&&normalize([o.customer,o.name].join(' ')).includes(normalize(filters.guest))&&phoneKey(o.phone).includes(phoneKey(filters.phone)));}

if(!state.orders.some(o=>o.id===route)&&route!=='list')route=/S12|S11/.test(route)?'FL-0001':'list';
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function current(){return state.orders.find(o=>o.id===route)||state.orders[0]}
function log(o,text){o.history.unshift({at:stamp(),actor:state.mode==='customer'?'Khách hàng':'CS · Minh Anh',text});save()}
function toast(text){$('#toast').textContent=text;$('#toast').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('#toast').style.display='none',3500)}
const customer=()=>state.mode==='customer';
const names={rename:'Đổi tên người lưu trú',cancel:'Hủy phòng',refund:'Hoàn theo điều kiện vé',change:'Đổi giai đoạn / nâng hạng phòng',surcharge:'Phụ thu trên booking',additional:'Đặt thêm phòng / gia hạn',over:'Tìm phòng thay thế',special:'Yêu cầu đặc biệt',invoice:'Thông tin hóa đơn',name:'Sửa / đổi tên hành khách',services:'Mua thêm dịch vụ',seat:'Chọn chỗ ngồi',exchange:'Đổi chuyến bay',member:'Bổ sung thẻ thành viên',void:'Void vé',split:'Tách PNR',ssr:'Hỗ trợ đặc biệt (SSR)',involuntary:'Hãng đổi / hủy chuyến',reroute:'Đổi hành trình / nâng hạng',partial:'Hoàn một phần',double:'Thanh toán trùng',chargeback:'Tra soát chargeback',issue:'Kiểm tra xuất dịch vụ',payment:'Tra soát thanh toán',complaint:'Sự cố trong / sau lưu trú',reconfirm:'Ghi chú xác nhận lại',note:'Ghi chú nội bộ'};
const titleKind=(k,o)=>k==='refund'&&o.type==='hotel'?'Kiểm tra / hoàn tiền':names[k]||k;
const btn=(text,action,cls='',more='')=>`<button type="button" class="${cls}" data-action="${action}" ${more}>${text}</button>`;
const tag=(text,tone='')=>`<span class="badge ${tone}">${esc(text)}</span>`;
const kv=(label,value)=>`<div class="kv"><span>${label}</span><span>${value}</span></div>`;
const card=(title,body)=>`<section class="card"><h2>${title}</h2>${body}</section>`;
const field=(label,name,value='',type='text',extra='')=>`<label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}>`;
const area=(label,name,value='',extra='')=>`<label for="f-${name}">${label}</label><textarea id="f-${name}" name="${name}" ${extra}>${esc(value)}</textarea>`;
const select=(label,name,options,value)=>`<label for="f-${name}">${label}</label><select id="f-${name}" name="${name}">${options.map(x=>{const [v,t]=Array.isArray(x)?x:[x,x];return `<option value="${esc(v)}" ${v===value?'selected':''}>${esc(t)}</option>`}).join('')}</select>`;
const check=text=>`<label class="check"><input type="checkbox" name="consent" required>${text}</label>`;
const info=(text,warn=false)=>`<div class="info ${warn?'warn':''}">${text}</div>`;
const stageLabel=r=>({new:'Cần xử lý',supplier:'Chờ NCC phản hồi',quoted:'Chờ khách đồng ý',payment:'Chờ khách thanh toán',ready:'Cần thực hiện',unknown:'Chưa rõ kết quả · cần tra cứu',refund:'Chờ trả tiền',done:'Đã xong',rejected:'Đã đóng'})[r.stage]||r.stage;
const openRequests=o=>o.requests.filter(r=>!['done','rejected'].includes(r.stage));
const needsCS=o=>openRequests(o).some(r=>['new','ready','unknown','refund'].includes(r.stage));
function goto(id){route=id;location.hash=id;render();window.scrollTo(0,0)}
function shell(body){return `<div class="demo"><div><b>PROTOTYPE · DỮ LIỆU MẪU</b><span>Không kết nối booking hoặc thanh toán thật</span></div><div>${btn(customer()?'Về Intranet CS':'Xem phía khách','mode')} ${btn('Đặt lại demo','reset')}</div></div>${customer()?`<div class="customer"><header class="topbar"><b class="logo">bookese</b><span class="muted">Lưu trú &nbsp;&nbsp;&nbsp; Vé máy bay &nbsp;&nbsp;&nbsp; Trải nghiệm</span><span>Nguyễn An (demo)</span></header><main class="main">${body}</main></div>`:`<div class="shell"><aside class="nav"><div class="logo">bookese</div><p>Quản lý booking</p>${btn('▤ &nbsp; Tất cả booking','all',state.serviceFilter==='all'?'active':'')}${btn('▣ &nbsp; Đặt phòng khách sạn','hotel',state.serviceFilter==='hotel'?'active':'')}${btn('✈ &nbsp; Đặt vé máy bay','flight',state.serviceFilter==='flight'?'active':'')}<div class="note">CS xử lý trực tiếp trên đơn.<br>Trường hợp khó: trao đổi với PS ngoài hệ thống, rồi cập nhật kết quả tại đây.</div></aside><div class="workspace"><header class="topbar"><span>Quản lý đặt chỗ</span><span><span class="avatar">MA</span>Minh Anh · CS</span></header><main class="main">${body}</main></div></div>`}`}
function list(){const base=filteredOrders(),orders=base.filter(o=>matchStatus(o,state.filter));
 return `<div class="pagehead"><div><div class="eyebrow">${customer()?'Tài khoản / Lịch sử đặt chỗ':'Bookese / Quản lý booking'}</div><h1>${customer()?'Đặt chỗ của tôi':'Danh sách booking'}</h1><p class="muted">${customer()?'Xem thông tin, thay đổi hoặc yêu cầu hỗ trợ trên đơn của bạn.':'Mở đơn để xử lý. Thông tin và kết quả được cập nhật tại cùng một nơi.'}</p></div></div><section class="card"><div class="booking-filters">${[['code','Mã booking','VD: BK-2409'],['hotel','Tên khách sạn','Nhập tên khách sạn'],['guest','Tên khách hàng','Tên người đặt / người sử dụng'],['phone','SĐT khách hàng','Nhập số điện thoại']].filter(([k])=>k!=='hotel'||state.serviceFilter!=='flight').map(([k,t,p])=>`<div><label for="filter-${k}">${t}</label><input id="filter-${k}" data-filter="${k}" value="${esc(filters[k])}" placeholder="${p}" ${k==='phone'?'inputmode="tel"':''}></div>`).join('')}<div><label for="service-filter">Loại dịch vụ</label><select id="service-filter"><option value="all">Tất cả dịch vụ</option><option value="hotel" ${state.serviceFilter==='hotel'?'selected':''}>Khách sạn</option><option value="flight" ${state.serviceFilter==='flight'?'selected':''}>Vé máy bay</option></select></div><div class="filter-reset">${btn('Xóa bộ lọc','clear-filters')}</div></div><div class="tabs" aria-label="Trạng thái booking">${statusTabs.map(([v,t])=>btn(t+' <span class="count">'+base.filter(o=>matchStatus(o,v)).length+'</span>','filter:'+v,state.filter===v?'active':'')).join('')}</div><div class="table-wrap"><table><thead><tr><th>Booking / Khách</th><th>Dịch vụ</th><th>Ngày sử dụng</th><th>Kết quả đặt / Tình trạng đơn</th><th>${customer()?'Tiến độ hỗ trợ':'Việc cần xử lý'}</th><th></th></tr></thead><tbody>${orders.map(o=>`<tr><td><b>${btn(o.id,'open:'+o.id,'link')}</b>${esc(o.name)}</td><td><b>${esc(o.title)}</b><small>${o.type==='hotel'?'Khách sạn · '+o.source:'Vé máy bay · '+o.pnr}</small></td><td>${esc(o.start)}${o.type==='hotel'?'<br><small>đến '+o.end+'</small>':''}</td><td>${tag(o.booking,o.booking==='Thành công'?'good':'warn')}<p><small>${esc(o.service)}</small></p></td><td>${openRequests(o).length?openRequests(o).slice(0,2).map(r=>`<b>${esc(titleKind(r.kind,o))}</b><small>${stageLabel(r)}</small>`).join('<br>'):'<small>Không có việc đang chờ</small>'}</td><td>${btn('Mở đơn →','open:'+o.id,'link')}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">Không có booking phù hợp.</td></tr>'}</tbody></table></div></section><p class="footnote">Kết quả đặt giữ ba trạng thái Thành công / Đang xử lý / Thất bại. Hủy, hoàn tiền, thay đổi và yêu cầu hỗ trợ được theo dõi riêng trên đơn.</p>`}
function actionsHTML(o){let main=o.type==='hotel'?[['rename','Đổi tên lưu trú'],['cancel','Hủy phòng'],['change',customer()?'Yêu cầu thay đổi':'Đổi giai đoạn / nâng hạng']]:[['services','Mua dịch vụ / chọn chỗ'],['exchange','Đổi chuyến bay'],['refund',customer()?'Yêu cầu hoàn vé':'Hoàn vé']];
 const extra=o.type==='hotel'?['surcharge','additional','special','over','refund','invoice','complaint','reconfirm','payment','note']:['name','member','void','split','ssr','involuntary','reroute','partial','double','chargeback','invoice','issue','payment','note'];
 const allowed=extra.filter(k=>!customer()||!['over','reconfirm','payment','note','issue','double','chargeback','void'].includes(k));
 if(o.service==='Đã hủy'||o.service==='Đã hoàn vé')main=[];
 return `<div class="actionbar">${main.map(([k,t],i)=>btn(t,'start:'+k,i===0?'primary':'')).join('')}<select id="other-action" aria-label="Thao tác khác"><option value="">${customer()?'Hỗ trợ khác…':'Thao tác khác…'}</option>${allowed.map(k=>`<option value="${k}">${esc(titleKind(k,o))}</option>`).join('')}</select></div>`}
function bookingInfo(o){if(o.type==='hotel')return card('Thông tin lưu trú',`<div class="trip"><b>${esc(o.title)}</b><p>${esc(o.room)}</p><div class="route"><div><small>Nhận phòng</small><b>${o.start.slice(8)}/${o.start.slice(5,7)}</b><small>Từ 14:00</small></div><div class="path">${Math.max(1,Math.round((new Date(o.end)-new Date(o.start))/86400000))} đêm</div><div><small>Trả phòng</small><b>${o.end.slice(8)}/${o.end.slice(5,7)}</b><small>Trước 12:00</small></div></div></div>${kv('Người nhận phòng','<b>'+esc(o.name)+'</b>')}${kv('Yêu cầu đặc biệt',esc(o.special||'Chưa có'))}${o.source==='Extranet'?kv('Xác nhận lại',esc(o.reconfirmed||'Chưa có ghi chú')+' <small>· Không bắt buộc</small>'):''}${o.replacedFrom?kv('Thay thế booking',btn(o.replacedFrom,'open:'+o.replacedFrom,'link')):''}${o.parentBooking?kv('Đặt thêm từ booking',btn(o.parentBooking,'open:'+o.parentBooking,'link')):''}${(o.linkedBookings||[]).map(x=>kv(x.relation==='replacement'?'Booking thay thế':'Booking đặt thêm',btn(x.id,'open:'+x.id,'link'))).join('')}${(o.supplements||[]).map(x=>kv(x.label,esc(x.detail)+'<br><small>'+money(x.amount)+' · Đã cập nhật NCC</small>')).join('')}`);
 return card('Chi tiết chuyến bay',`<div class="trip"><b>${esc(o.airline)}</b><p>${esc(o.title)} · ${esc(o.flight)}</p><div class="route"><div><small>${o.start}</small><b>${esc(o.departure)}</b><small>${esc(o.title.split(' → ')[0])}</small></div><div class="path">Bay thẳng · Phổ thông</div><div><small>${o.start}</small><b>${esc(o.arrival)}</b><small>${esc(o.title.split(' → ')[1])}</small></div></div></div>${kv('Hành khách','<b>'+esc(o.name)+'</b>')}${kv('PNR / Số vé',esc(o.pnr)+' / '+esc(o.ticket))}${kv('Hành lý',esc(o.baggage))}${kv('Chỗ ngồi',esc(o.seat))}${kv('Mua thêm',o.extras.map(esc).join(' · ')||'Chưa có')}${kv('Thẻ thành viên',esc(o.member||'Chưa bổ sung'))}${o.ssr?kv('Hỗ trợ đặc biệt',esc(o.ssr)):''}${o.split?kv('PNR sau tách',esc(o.split)):''}`)}
function tasks(o){const req=openRequests(o);return req.length?card(customer()?'Yêu cầu của bạn':'Cần xử lý trên đơn',req.map(r=>`<div class="task"><div class="line"><div><b>${esc(titleKind(r.kind,o))}</b><p>${esc(r.note||'Yêu cầu trên booking này')}</p><small>${r.id} · ${stageLabel(r)} · ${esc(r.origin)}</small></div>${btn(customer()?(r.stage==='quoted'?'Xem phương án':r.stage==='payment'?'Thanh toán':'Xem tiến độ'):'Tiếp tục →','request:'+r.id,needsCS(o)&&!customer()?'primary':'')}</div></div>`).join('')):''}
function detail(){const o=current();return `<div class="orderhead"><div class="eyebrow">${btn('← Danh sách booking','list','link')} &nbsp; / &nbsp; ${o.type==='hotel'?'Khách sạn':'Vé máy bay'}</div><div class="pagehead"><div><h1>${o.id} <span style="font-size:14px;font-weight:400;color:#73808e">${o.type==='flight'?'PNR '+esc(o.pnr):esc(o.title)}</span></h1><span class="muted">${esc(o.customer)} · ${esc(o.email)}</span></div>${!customer()?'<div class="buttons">'+(canResend(o)?btn('Gửi lại email xác nhận','resend-email'):'')+btn('Xem phía khách ↗','mode')+'</div>':''}</div><div class="statusline"><span><small>Kết quả đặt</small>${tag(o.booking,o.booking==='Thành công'?'good':'warn')}</span><span><small>Dịch vụ</small>${tag(o.service)}</span><span><small>Thanh toán</small>${tag(o.payment,o.payment==='Đã thu'?'good':'warn')}</span><span><small>Hoàn tiền</small>${tag(o.refunds.length?o.refunds.every(r=>r.status==='done')?'Đã hoàn':'Đang xử lý':'Chưa phát sinh',o.refunds.some(r=>r.status!=='done')?'warn':'')}</span></div></div>${!customer()?actionsHTML(o):''}<div class="detailgrid"><div>${tasks(o)}${bookingInfo(o)}${card(o.type==='flight'?'Điều kiện vé':'Điều kiện đặt phòng',o.type==='flight'?`<p>Đổi chuyến: kiểm tra phí và chênh lệch theo báo giá mới từ hãng.</p><p>Hoàn vé: Bookese kiểm tra điều kiện, báo phí và số tiền hoàn trước khi thực hiện.</p><p>Sửa tên: gửi yêu cầu cho Bookese; điều kiện và phí cần Hồng Ngọc Hà xác nhận.</p><small>Điều kiện minh họa. Bản thật sử dụng điều kiện đã mua và phản hồi API của từng vé.</small>`:`<p>${o.free?'Đơn mẫu đang trong điều kiện hủy miễn phí.':'Đơn mẫu áp dụng phí hủy; cần kiểm tra trước khi xác nhận.'}</p><p>Đổi phòng / ngày / khách sạn: gửi Bookese kiểm tra và báo phương án. Chỉ đổi cùng giá hoặc cao hơn theo chính sách Bookese.</p><small>Đổi giai đoạn / nâng hạng: giữ chỗ mới → thanh toán chênh lệch → hủy cũ miễn phí → tạo booking mới. Phụ thu: giữ và cập nhật đơn cũ. Thêm phòng / gia hạn: giữ đơn cũ, tạo booking bổ sung.</small>`)}<details><summary>Lịch sử đơn · ${o.history.length} cập nhật</summary><div class="card history">${o.history.map(h=>`<p>${esc(h.text)}<small>${esc(h.at)} · ${esc(h.actor)}</small></p>`).join('')}</div></details><details><summary>Yêu cầu đã hoàn tất · ${o.requests.filter(r=>['done','rejected'].includes(r.stage)).length}</summary><div>${o.requests.filter(r=>['done','rejected'].includes(r.stage)).map(r=>`<p>${esc(titleKind(r.kind,o))} · ${stageLabel(r)}<br><small>${esc(r.result||'')}</small></p>`).join('')||'<p>Chưa có yêu cầu đã hoàn tất.</p>'}</div></details></div><div>${customer()?card('Quản lý đặt chỗ',actionsHTML(o)+`<small>Sửa tên vé và hoàn vé là yêu cầu gửi Bookese. Vé chưa thay đổi khi gửi yêu cầu.</small>`):''}${moneyCard(o)}${benefitsCard(o)}${card(customer()?'Thông tin liên hệ':'Khách hàng & nhà cung cấp',`${kv('Tài khoản đặt',esc(o.customer)+'<br>'+esc(o.email))}${kv('Điện thoại',esc(o.phone))}${!customer()?btn('Xem thông tin tài khoản','account','link'):''}${o.type==='hotel'?kv('Khách sạn',esc(o.contact)+'<br>'+esc(o.hotelPhone)+'<br>'+esc(o.hotelEmail)):kv('NCC','Hồng Ngọc Hà · API / hỗ trợ nghiệp vụ')}`)}${card('Thông tin hóa đơn',o.invoice?`<p><b>${esc(o.invoice.company)}</b></p><p>${esc(o.invoice.tax)}</p><small>${esc(o.invoice.email)}<br>${esc(o.invoice.status)}</small>`:`<p class="muted">Chưa bổ sung</p>${btn('Bổ sung thông tin','start:invoice','link')}<p><small>Yêu cầu xuất trong ngày thanh toán: ${o.paidDate}.</small></p>`)}</div></div><p class="footnote">Dữ liệu mẫu lưu trong trình duyệt. Các kết quả API, đồng bộ khách sạn và thanh toán đều là mô phỏng.</p>`}
function moneyCard(o){const transferred=o.transferredTo;const refunded=o.refunds.filter(r=>r.status==='done').reduce((a,r)=>a+r.amount,0);return card('Thanh toán',`<div class="summaryrow"><span>Giá ${o.type==='flight'?'vé, thuế và phí xuất vé':'dịch vụ'}</span><span class="money">${money(o.gross)}</span></div><div class="summaryrow"><span>Voucher</span><span>− ${money(o.voucher)}</span></div><div class="summaryrow"><span>Xu đã sử dụng</span><span>${o.coins.toLocaleString('vi-VN')} xu</span></div><div class="summaryrow total"><span>Khách đã trả</span><span>${money(o.paid)}</span></div>${transferred?kv('Đã chuyển sang booking mới',btn(o.transferredTo,'open:'+o.transferredTo,'link')+' · '+money(o.transferAmount))+'<small>Tiền đã chuyển sang booking mới, không hoàn thêm trên đơn cũ.</small>':''}${o.extraPaid?`<div class="summaryrow"><span>Đã thu bổ sung</span><b>${money(o.extraPaid)}</b></div>`:''}${refunded?`<div class="summaryrow"><span>Đã trả lại khách</span><b>${money(refunded)}</b></div>`:''}${o.refunds.filter(r=>r.status!=='done').map(r=>`<div class="task"><b>Còn phải hoàn ${money(r.amount)}</b><p>${r.status==='pending'?'Đã gửi lệnh · chờ kết quả':'CS xác nhận và trả tiền'}</p>${customer()?tag('Bookese đang xử lý','warn'):btn('Xử lý hoàn tiền','money:'+r.id,'link')}</div>`).join('')}<details><summary>Xu thưởng & ưu đãi</summary><div><p>${esc(o.reward)}</p><small>Khách chủ động hủy có phí: không trả voucher / xu đã dùng. Hủy miễn phí: hoàn đủ tiền và khôi phục voucher / xu theo điều kiện cũ. Lỗi hệ thống / NCC / Bookese: khôi phục quyền lợi của phần hủy. Xu thưởng phần hủy được hủy / thu hồi, ví có thể âm; không trừ vào tiền hoàn.</small></div></details>`)}
function render(){ $('#app').innerHTML=shell(route==='list'?list():detail());$('#service-filter')?.addEventListener('change',e=>{state.serviceFilter=e.target.value;if(state.serviceFilter==='flight')filters.hotel='';save();render()});document.querySelectorAll('[data-filter]').forEach(el=>el.addEventListener('input',e=>{const k=e.target.dataset.filter,pos=e.target.selectionStart;filters[k]=e.target.value;render();const input=$('#filter-'+k);input.focus();input.setSelectionRange(pos,pos)}));$('#other-action')?.addEventListener('change',e=>{if(e.target.value)start(e.target.value)}); }
function show(title,body,formAction='',label='Tiếp tục'){const o=current();$('#flow').innerHTML=`<div class="modalhead"><div><h2 id="flow-title">${esc(title)}</h2><small>${esc(o.id)} · ${esc(o.name)}${o.type==='flight'?' · '+esc(o.ticket):''}</small></div>${btn('×','close','close','aria-label="Đóng"')}</div><div class="modalbody">${formAction?`<form id="flow-form" data-submit="${formAction}"><div id="form-error" role="alert"></div>${body}<div class="buttons">${btn('Quay lại','close')}<button class="primary" type="submit">${label}</button></div></form>`:body}</div>`;if(!$('#flow').open)$('#flow').showModal(); }
function error(text){const x=$('#form-error');if(x)x.innerHTML=`<div class="error">${esc(text)}</div>`;else toast(text);return false}
function close(){ $('#flow').close();panel=null;render() }
function canResend(o){return o.booking==='Thành công'&&!['Đã hủy','Đã hoàn vé'].includes(o.service)&&(o.type!=='flight'||(o.ticket&&o.ticket!=='Chưa xuất'));}
function resendEmail(recipient){const o=current();if(customer()||!canResend(o))return toast('Chỉ gửi xác nhận khi dịch vụ đã được xác nhận và còn hiệu lực.');panel={kind:'resend',orderId:o.id};show('Gửi lại email xác nhận',`${field('Email nhận','recipient',recipient??o.email,'email','required maxlength="254"') }<small>Email này chỉ dùng cho lần gửi; không thay email tài khoản hoặc liên hệ trên đơn.</small><h3>Xem trước email</h3>${kv('Tiêu đề',esc('Bookese · Xác nhận '+(o.type==='hotel'?'đặt phòng ':'vé máy bay ')+o.id))}<div class="card"><p>Xin chào ${esc(o.customer)},</p><p>Bookese gửi lại thông tin xác nhận hiện tại của đơn <b>${esc(o.id)}</b>.</p>${kv(o.type==='hotel'?'Khách sạn':'Hành trình',esc(o.title))}${kv(o.type==='hotel'?'Người lưu trú':'Hành khách',esc(o.name))}${kv('Ngày sử dụng',esc(o.start)+(o.type==='hotel'?' → '+esc(o.end):' · '+esc(o.departure)))}${o.type==='hotel'?kv('Phòng / quyền lợi',esc(o.room))+kv('Mã tại khách sạn',esc(o.supplierId))+kv('Yêu cầu đặc biệt',esc(o.special||'Chưa có')):kv('PNR / Số vé',esc(o.pnr)+' / '+esc(o.ticket))+kv('Hành lý / Chỗ ngồi',esc(o.baggage)+' / '+esc(o.seat))+kv('Dịch vụ mua thêm',esc(o.extras.join(', ')||'Chưa có'))}<p>Cảm ơn bạn đã đặt dịch vụ tại Bookese.</p></div><small>Prototype chỉ mô phỏng gửi email, không gửi thư thật.</small><details><summary>Thử kết quả mô phỏng</summary>${select('Kết quả gửi','outcome',[['ok','Gửi thành công'],['fail','Gửi lỗi']],'ok')}</details>`,'resend-email','Gửi email');}
function request(o,kind,data={}){const duplicate=openRequests(o).find(r=>r.kind===kind);if(duplicate)return duplicate;const r={id:'YC-'+(++state.seq),kind,stage:'new',origin:customer()?'Khách hàng':'CS',at:stamp(),...data};o.requests.unshift(r);log(o,'Tạo yêu cầu '+titleKind(kind,o)+' · '+r.id);return r}
function finish(o,r,text){r.stage='done';r.result=text;log(o,text);close();toast('Đã cập nhật đơn và lịch sử xử lý.')}
function start(kind){const o=current();if(['services','seat','exchange'].includes(kind)&&o.type==='flight'&&(o.booking!=='Thành công'||o.ticket==='Chưa xuất'))return toast('Vé chưa được xuất. Cần kiểm tra xuất vé trước khi mua thêm / đổi.');if(['Đã hủy','Đã hoàn vé'].includes(o.service)&&!['refund','invoice','note','complaint','payment','double','chargeback'].includes(kind))return toast('Dịch vụ này đã kết thúc; không thể thay đổi tiếp.');const existing=openRequests(o).find(r=>r.kind===kind);if(existing)return openRequest(existing.id);if(kind==='refund'&&o.refunds.some(x=>x.status!=='done'))return refundMoney(o.refunds.find(x=>x.status!=='done').id);panel={kind,step:'start'};
 if(customer()&&!(o.type==='hotel'&&['rename','cancel'].includes(kind))&&!['services','seat','exchange','invoice'].includes(kind))return customerRequest(kind);
 if(kind==='rename')return show('Đổi tên người lưu trú',field('Tên hiện tại','old',o.name,'text','readonly')+field('Tên người nhận phòng mới','name',o.name,'text','required')+info('Lưu thành công sẽ cập nhật trên đơn, đồng bộ sang Extranet và gửi thông tin đến khách sạn.')+check('Tôi đã kiểm tra tên người nhận phòng mới.'),'rename','Lưu & cập nhật khách sạn');
 if(kind==='invoice')return show('Thông tin xuất hóa đơn',field('Tên công ty / người mua','company',o.invoice?.company||'','text','required')+field('Mã số thuế','tax',o.invoice?.tax||'','text','required')+field('Địa chỉ','address',o.invoice?.address||'','text','required')+field('Email nhận hóa đơn','email',o.invoice?.email||o.email,'email','required')+info('Ngày thanh toán: '+o.paidDate+'. Thông tin gửi sau ngày này được chuyển kiểm tra, không tự xác nhận hóa đơn đã xuất.'),'invoice','Lưu thông tin hóa đơn');
 if(kind==='reconfirm'||kind==='note')return show(titleKind(kind,o),area(kind==='note'?'Nội dung ghi chú':'Ghi chú xác nhận lại (không bắt buộc)','note',kind==='reconfirm'?o.reconfirmed:'')+info(kind==='note'?'Có thể ghi kết quả trao đổi offline với PS tại đây. Không chuyển ca hoặc tạo bước chờ PS.':o.source==='Extranet'?'Khách sạn có thể nhập hoặc để trống cột xác nhận lại trên Extranet.':'Nguồn API: CS có thể ghi kết quả gọi kiểm tra với khách sạn.'),kind,'Lưu ghi chú');
 if(['change','over','surcharge','additional','exchange','services','seat'].includes(kind))return configure(kind);

 if(kind==='payment'||kind==='issue')return paymentStart(kind);
 return manualStart(kind);
}

}

 if(r.selection.scope==='hotel'||r.kind==='over')n.title=r.selection.option==='1'?'Khách sạn Biển Xanh':'Khách sạn Ánh Dương';n.contact=n.title;if(additional){n.rewardAmount=0;n.reward='Chờ tính theo booking bổ sung (mẫu)';}log(o,'Căn cứ thực hiện: '+(r.selection.cancelBasis|| (additional?'Đặt bổ sung, không hủy đơn cũ':'Hủy cũ miễn phí theo chính sách / phương án đã thống nhất')));
 (o.linkedBookings||(o.linkedBookings=[])).push({id,relation:additional?'additional':'replacement',requestId:r.id});state.orders.push(n);
 r.stage='done';r.result=(additional?'Giữ nguyên đơn cũ; tạo booking bổ sung ':'Đã hủy đơn cũ miễn phí; tạo booking thay thế ')+id;
 log(n,'Tạo từ '+o.id+' · '+r.id+' · '+(additional?'Thanh toán riêng: ':'Chuyển tiền đã thu: ')+money(n.paid)+'; đồng bộ NCC (mẫu).');log(o,r.result);close();
 show('Đã cập nhật booking',info(r.result)+kv('Booking cũ',btn(o.id,'open:'+o.id,'link')+' · '+esc(o.service))+kv('Booking mới',btn(id,'open:'+id,'link')+' · Thành công')+'<div class="buttons">'+btn('Về đơn cũ','close')+btn('Mở booking mới','open-linked:'+id,'primary')+'</div>');
