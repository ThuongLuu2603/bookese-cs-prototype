function orderInvoice(){const i=ops().invoice;return card('Thông tin hóa đơn',kv([['Tên đơn vị',esc(i?.name||'Chưa cung cấp')],['Mã số thuế',esc(i?.tax||i?.taxId||'—')],['Địa chỉ',esc(i?.address||'—')],['Email',esc(i?.email||'—')],['Tình trạng',esc(i?.status||'Chưa yêu cầu')]])+`<p class="note">Hóa đơn xuất trong ngày thanh toán. Yêu cầu gửi sau ngày thanh toán được Kế toán kiểm tra.</p>${orderFlight()?'':link(orderCustomer()?'Bổ sung thông tin':'Hỗ trợ thông tin hóa đơn',orderCustomer()?'S19':'S22')}`);}
function orderHotelDetails(){const h=journey().hotel,o=ops(),customer=orderCustomer();return card('',`<div class="order-property"><img src="${orderPhoto}" alt="Ảnh chỗ nghỉ minh họa"><div><small>KHÁCH SẠN · ĐÀ NẴNG</small><h2>${esc(h.hotel)}</h2><p>Thông tin chỗ nghỉ theo đơn đã đặt</p>${badge(h.active?bookingState():'Đã hủy','neutral')}<p>${customer?'':`<a href="tel:0236000000">0236 000 0000</a> · <a href="mailto:hotel.demo@example.com">hotel.demo@example.com</a>`}</p></div></div><div class="order-dates"><div><small>Nhận phòng</small><b>${h.from}</b><span>Từ 14:00</span></div><span>→</span><div><small>Trả phòng</small><b>${h.to}</b><span>Trước 12:00</span></div></div><details><summary>Hướng dẫn nhận phòng</summary><p>Cung cấp mã đặt phòng và giấy tờ của người lưu trú. Nếu đến muộn, cập nhật giờ đến để khách sạn sắp xếp.</p></details>`)+card('Thông tin phòng',`<div class="order-room"><div><b>${esc(h.room)} · Giường đôi</b><p>Không hút thuốc · Wi-Fi · Điều hòa</p></div><b>× ${h.rooms} phòng</b></div><p class="order-included">✓ Có bữa sáng</p><div class="actions">${link('Đổi phòng / ngày / khách sạn',customer?'S24':'S07')}${link('Cập nhật tên / yêu cầu đặc biệt',customer?'S19':'S22')}</div>`)+card('Thông tin khách',kv([['Người lưu trú',esc(o.guest)],['Tài khoản đặt',customer?'Nguyễn An (demo)':link('Nguyễn An · xem tài khoản','S21')],['Liên hệ','an.demo@example.com · 090•••0123'],['Số khách','4 người lớn (dữ liệu mẫu)'],['Yêu cầu đặc biệt',esc(o.special||'Chưa có')],['Phản hồi khách sạn',esc(o.specialReply||'Chưa có xác nhận')]]))+card('Chính sách của đơn',`<p><b>Hoàn hủy:</b> áp dụng điều kiện đã lưu khi đặt; xem phí và số hoàn trước khi xác nhận.</p><p><b>Thay đổi:</b> kiểm tra phòng và giá mới; chỉ đổi bằng hoặc cao giá. Đơn cũ giữ nguyên đến khi đủ điều kiện đổi.</p><details><summary>Xem lưu ý và hỗ trợ ngoại lệ</summary><p>Khách sạn không tự hủy đơn đã xác nhận. Miễn/giảm phí ngoại lệ cần xác nhận của nhà cung cấp; Bookese áp dụng theo quy tắc đã chốt.</p><p>Yêu cầu giường, tầng, giờ nhận phòng chưa được bảo đảm cho đến khi khách sạn xác nhận.</p></details>${link('Xem hủy / hoàn tiền',customer?'S26':'S09')}`)+orderInvoice()+(customer?assistCustomerUpdates():card('Việc đang xử lý trên đơn',bookingWork(st).length?table(['Nội dung','Thao tác'],bookingWork(st).map(w=>[esc(w.label),link('Mở xử lý',w.to)])):'<p>Chưa có việc chờ. Chọn mục Hỗ trợ khách khi khách liên hệ.</p>'))+(!customer?jHistory():'');}
function orderFlightInfo(){const f=journey().flight;return card('Chi tiết chuyến bay',`<div class="order-segment"><div><b>Vietnam Airlines</b><p>SGN → HAN · Phổ thông</p><small>Bay thẳng · Dữ liệu minh họa</small></div><div><b>${f.date}</b><div class="order-dates"><div><b>${esc(f.time)} · SGN</b><span>Tân Sơn Nhất</span></div><span>→</span><div><b>HAN</b><span>Nội Bài</span></div></div></div></div>`)+card('Thông tin hành khách',`<div class="order-room"><div><b>${esc(f.name)}</b><p>Người lớn · Số vé ${esc(f.ticket)}</p><p>Hành lý ${f.baggage} kg · Chỗ ${esc(f.seat)}</p></div>${badge(f.status,'neutral')}</div>`);}
function orderMoneyPanel(){const j=journey(),flight=orderFlight(),h=j.hotel,service=flight?'flight':'hotel',extra=j.orders.filter(o=>o.service===service&&o.payment==='Đã thu').reduce((n,o)=>n+o.amount,0),refunds=j.refunds.filter(r=>r.service===service),cash=flight?3200000:h.cash,coins=flight?0:h.coins;return `<div class="order-money">${card('Thông tin thanh toán',priceRows([['Phương thức','OnePay / chuyển khoản / ví (mẫu)'],[flight?'Giá vé gốc':'Giá dịch vụ còn lại',money(flight?3200000:h.price)],['Xu đã dùng',coins.toLocaleString('vi-VN')+' xu'],[flight?'Tiền vé gốc':'Tiền phân bổ dịch vụ',money(cash)],['Các khoản thu bổ sung',money(extra)],['Đã hoàn tiền',money(refunds.filter(r=>r.moneyDone).reduce((n,r)=>n+r.amount,0))]])+`<p class="note">Khoản bổ sung được liệt kê riêng để đối chiếu với giao dịch của đơn.</p>${!orderCustomer()&& !flight?link('Tra soát giao dịch của đơn','S03'):''}`)}${card('Xu của đơn',priceRows([['Xu sử dụng đã trả lại',refunds.filter(r=>r.coinDone).reduce((n,r)=>n+r.coins,0).toLocaleString('vi-VN')+' xu'],['Xu thưởng đã điều chỉnh',refunds.filter(r=>r.coinDone).reduce((n,r)=>n+r.reward,0).toLocaleString('vi-VN')+' xu']])+walletLink(orderCustomer()))}${refunds.length?card('Theo dõi hoàn tiền',refunds.map(r=>`<p><b>${esc(r.id)}</b> · ${money(r.amount)}<br>${esc(r.status)}</p>`).join('')):''}</div>`;}
const orderFlightActions=views.S12;views.S12=()=>orderFlightInfo()+orderFlightActions().replace(/^<div class="j-booking">[\s\S]*?(?=<section class="card">)/,'')+card('Điều kiện hoàn / đổi','<p>Áp dụng điều kiện vé đã mua và báo giá hiện tại của hãng. Mua thêm dịch vụ/đổi chuyến thực hiện trên Bookese; hoàn vé/sửa tên do CS hỗ trợ thủ công.</p>')+orderInvoice();
const orderGuestFlightActions=views.S23;views.S23=()=>orderFlightInfo()+orderGuestFlightActions().replace(/^<div class="j-booking">[\s\S]*?(?=<section class="card">)/,'')+card('Điều kiện hoàn / đổi','<p>Kiểm tra điều kiện hãng và giá trước khi xác nhận. Gửi yêu cầu hoàn vé hoặc sửa tên để Bookese hỗ trợ.</p>');

function ancState(){const j=journey();return j.anc||(j.anc={draft:{},purchased:{},leg:0});}
function ancPeople(){return journey().flight.passengers||[{id:'P1',name:journey().flight.name,type:'Người lớn'}];}
function ancLegs(){return journey().flight.legs||[{id:'L1',label:'SGN → HAN',date:journey().flight.date}];}
const ancPrices={bag:{none:0,b10:450000,b20:700000},meal:{none:0,hot:180000,veg:160000},priority:{none:0,fast:250000}};
const ancNames={b10:'Thêm 10 kg',b20:'Thêm 20 kg',hot:'Suất ăn nóng',veg:'Suất chay',fast:'Ưu tiên làm thủ tục'};
function ancKey(p,l){return l.id+'_'+p.id;}
function ancDraft(p,l){const a=ancState(),k=ancKey(p,l);return a.draft[k]||(a.draft[k]={bag:'none',meal:'none',priority:'none',seat:'',wheel:false});}
function ancItems(){const out=[];for(const l of ancLegs())for(const p of ancPeople()){const d=ancDraft(p,l);for(const kind of ['bag','meal','priority'])if(d[kind]!=='none')out.push({key:ancKey(p,l),pax:p.name,route:l.label,kind,code:d[kind],name:ancNames[d[kind]],price:ancPrices[kind][d[kind]]});if(d.seat)out.push({key:ancKey(p,l),pax:p.name,route:l.label,kind:'seat',code:d.seat,name:'Ghế '+d.seat,price:ancSeatPrice(d.seat)});}return out;}
function ancSeatPrice(s){return s.startsWith('1')?250000:150000;}
function ancTotal(k,l){return ancItems().filter(x=>(!k||k.includes(x.kind))&&(!l||x.route===l.label)).reduce((n,x)=>n+x.price,0);}
function ancSelect(kind,p,l){const d=ancDraft(p,l),inf=p.type==='Em bé';if(inf&&(kind==='bag'||kind==='meal'))return '<span class="muted">Không áp dụng<br><small>Theo điều kiện hành khách của vé mẫu</small></span>';return `<select aria-label="${kind==='bag'?'Hành lý':kind==='meal'?'Suất ăn':'Ưu tiên'} ${esc(p.name)} ${l.label}" data-anc-kind="${kind}" data-anc-key="${ancKey(p,l)}">${Object.entries(ancPrices[kind]).map(([k,v])=>`<option value="${k}" ${d[kind]===k?'selected':''}>${k==='none'?'Không mua thêm':ancNames[k]+' · '+money(v)}</option>`).join('')}</select>`;}
function ancTabs(){return `<div class="anc-tabs">${ancLegs().map((l,i)=>`<button data-anc-leg="${i}" class="${ancState().leg===i?'active':''}">${l.label}</button>`).join('')}</div>`;}
function ancTotals(k,title){return `<div class="anc-totals">${ancLegs().map(l=>`<div><span>${title} · ${l.label}</span><b>${money(ancTotal(k,l))}</b></div>`).join('')}</div>`;}
function ancSection(title,sub,body){return `<details class="card anc-section" open><summary><b>${title}</b><small>${sub}</small></summary><div class="anc-body">${body}</div></details>`;}
function ancView(customer){const a=ancState(),people=ancPeople(),l=ancLegs()[a.leg]||ancLegs()[0],pending=jPending('flight');return ancSection('Dịch vụ thêm','Chọn cho đúng hành khách và chặng bay',`<b>ĐÃ CÓ SẴN TRONG VÉ — không phải mua thêm</b><div class="anc-included">${ancLegs().map(x=>`<p>${x.label} · ${x.date}<br>Ký gửi: ${journey().flight.baggage} kg · Xách tay: xem điều kiện vé</p>`).join('')}</div><small>Gói và giá bên dưới là dữ liệu mẫu. Khi triển khai, chỉ hiển thị dịch vụ NCC cho phép.</small>`)+ancSection('Hành lý ký gửi mua thêm','Chọn gói theo từng hành khách',ancTabs()+table(['Hành khách','Đã có','Mua thêm'],people.map(p=>[`<b>${esc(p.name)}</b><small class="anc-type">${p.type}</small>`,p.type==='Em bé'?'Theo vé':`${journey().flight.baggage} kg`,ancSelect('bag',p,l)]))+`<button class="anc-copy" data-action="anc-copy-bag">Áp dụng lựa chọn hành khách đầu cho các khách đủ điều kiện</button>`+ancTotals(['bag'],'Tổng hành lý mua thêm'))+ancSection('Chỗ ngồi','Chọn trước để ngồi cạnh người thân',people.map(p=>`<p><b>${esc(p.name)}</b> <small>${p.type}</small><br>${ancLegs().map(x=>x.label+': '+esc(ancDraft(p,x).seat||a.purchased[ancKey(p,x)]?.seat||journey().flight.seat||'Chưa chọn')).join(' · ')}</p>`).join('')+btn('Chọn chỗ ngồi','anc-seat-open')+ancTotals(['seat'],'Tổng phí chọn chỗ'))+ancSection('Suất ăn và dịch vụ khác','Suất ăn · ưu tiên làm thủ tục · yêu cầu hỗ trợ',ancTabs()+table(['Hành khách','Suất ăn','Ưu tiên','Xe lăn'],people.map(p=>[`<b>${esc(p.name)}</b><small class="anc-type">${p.type}</small>`,ancSelect('meal',p,l),ancSelect('priority',p,l),`<label><input type="checkbox" data-anc-wheel="${ancKey(p,l)}" ${ancDraft(p,l).wheel?'checked':''}> Cần hỗ trợ</label>`]))+`<p class="note">Xe lăn là yêu cầu hỗ trợ; chưa được bảo đảm cho đến khi NCC xác nhận.</p><button class="anc-copy" data-action="anc-copy-service">Áp dụng lựa chọn hành khách đầu cho các khách đủ điều kiện</button>`+ancTotals(['meal','priority'],'Tổng suất ăn và dịch vụ'))+card('Kiểm tra lựa chọn',ancItems().length?table(['Hành khách / chặng','Dịch vụ','Thành tiền'],ancItems().map(x=>[esc(x.pax)+'<br>'+x.route,esc(x.name),money(x.price)]))+`<div class="anc-grand"><b>Tổng cần thanh toán</b><strong>${money(ancTotal())}</strong></div>${btn('Kiểm tra giá và tiếp tục','anc-review','primary',!!pending)}`:'<p>Chưa chọn dịch vụ trả phí.</p>')+ (pending?jPayment(pending):'')+(Object.values(a.draft).some(d=>d.wheel)?card('Yêu cầu hỗ trợ xe lăn',`<p>Gửi riêng yêu cầu hỗ trợ cho NCC, không tạo phí mua dịch vụ.</p>${btn('Gửi yêu cầu hỗ trợ','anc-wheel-send')}<p>${esc(a.wheelStatus||'Chưa gửi')}</p>`):'');}
const ancDetailBase=flightDetailV2;flightDetailV2=c=>flightSection==='services'?ancView(c):ancDetailBase(c);
let ancSeatDraft={},ancSeatPax=0,ancSeatLeg=0;
function ancSeatModal(){const p=ancPeople()[ancSeatPax],l=ancLegs()[ancSeatLeg];dialog('Chọn chỗ ngồi',`<div class="anc-seat-toolbar"><label>Chặng <select id="anc-seat-leg">${ancLegs().map((x,i)=>`<option value="${i}" ${i===ancSeatLeg?'selected':''}>${x.label}</option>`).join('')}</select></label><label>Hành khách <select id="anc-seat-pax">${ancPeople().map((x,i)=>`<option value="${i}" ${i===ancSeatPax?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label></div><div class="anc-seat-layout"><div><h3>Sơ đồ ghế minh họa · Phổ thông</h3><div class="anc-seat-grid"><span>A</span><span>B</span><span>C</span><i></i><span>D</span><span>E</span><span>F</span>${Array.from({length:9},(_,n)=>n+1).map(r=>['A','B','C','aisle','D','E','F'].map(c=>{if(c==='aisle')return '<i>'+r+'</i>';const s=r+c,k=ancKey(p,l),occupied=['2A','3B','5D','7F'].includes(s),chosen=ancSeatDraft[k]===s,other=Object.entries(ancSeatDraft).some(([key,v])=>key!==k&&key.startsWith(l.id+'_')&&v===s),restricted=p.type==='Em bé'||(p.type==='Trẻ em'&&r===1);return `<button type="button" class="anc-seat ${occupied||restricted?'unavailable':chosen?'selected':other?'reserved':r===1?'extra':''}" data-seat="${s}" title="${s} · ${occupied?'Đã có người chọn':restricted?'Không đủ điều kiện':money(ancSeatPrice(s))}" ${occupied||other||restricted?'disabled':''}>${s}</button>`;}).join('')).join('')}</div></div><div class="anc-seat-legend"><h3>Ghế đang chọn</h3>${ancPeople().map(x=>`<p>${esc(x.name)}<br><b>${ancSeatDraft[ancKey(x,l)]||'Chưa chọn'}</b></p>`).join('')}<p>□ Ghế tiêu chuẩn · 150.000 đ</p><p>🟨 Hàng đầu · 250.000 đ</p><p>🟦 Đang chọn</p><p>▧ Không thể chọn</p><small>Sơ đồ thực tế lấy từ NCC theo chuyến; không áp sơ đồ mẫu cho mọi máy bay.</small></div></div>`,'Xác nhận chọn ghế',()=>{for(const x of ancLegs())for(const person of ancPeople())ancDraft(person,x).seat=ancSeatDraft[ancKey(person,x)]||'';save();render();});const d=document.querySelector('#dialog');d.classList.add('anc-seat-dialog');d.querySelec n. Vé hiện tại chưa thay đổi.</p>${btn('Kiểm tra giá đổi vé','flight-reprice','primary')}`}<p>${btn('Chọn chuyến khác','ce-choice-back')}</p>`)}${j.flightBlock?alert(esc(j.flightBlock)+'. Vui lòng thử lại hoặc liên hệ Bookese.'):''}`;}

function customerAncillaryCheckout(items,version){const j=journey();if(!items.length||jPending('flight')||j.flight.status!=='Đã xuất vé'||j.flight.version!==version){toast('Kiểm tra lại vé hoặc khoản thanh toán đang chờ.');return false;}const o={id:'FL-'+(j.orders.length+1),service:'flight',kind:'ancillary-bundle',items,version,amount:items.reduce((n,x)=>n+x.price,0),until:Date.now()+900000,payment:'Chưa thu',status:'Chờ thanh toán',mock:'Thành công',command:'ANC-'+Date.now(),actor:'Khách',offer:{name:items.every(x=>x.kind==='seat')?'Đổi chỗ ngồi':'Mua thêm dịch vụ'},scope:{passenger:items.map(x=>x.pax).join(', '),route:items.map(x=>x.route).join(', ')}};j.orders.push(o);j.selected=o.id;jLog('Tạo thanh toán dịch vụ; vé chưa cập nhật','Khách');save();go('S20');return true;}
function customerServicesModal(){const version=journey().flight.version,selected=new Map(),catalog=[];for(const l of ancLegs())for(const p of ancPeople())for(const kind of ['bag','meal','priority'])for(const [code,price] of Object.entries(ancPrices[kind]))if(code!=='none')catalog.push({key:ancKey(p,l),pax:p.name,paxId:p.id,route:l.label,kind,code,price,name:ancNames[code],infant:p.type==='Em bé'});
 dialog('Mua thêm dịch vụ',`<div class="cs-service-body"><p>Chọn cho từng khách, áp dụng cho ${ancLegs().map(l=>l.label).join(', ')}. Em bé không mua dịch vụ.</p>${ancPeople().map(p=>`<section class="cs-service-person"><b>${esc(p.name)}</b>${['bag','meal','priority'].map(kind=>`<h4>${{bag:'Hành lý ký gửi',meal:'Suất ăn',priority:'Dịch vụ khác'}[kind]}</h4>${kind==='bag'?`<p class="muted">Theo vé: ${journey().flight.baggage} kg · Đã có</p>`:''}${catalog.map((x,i)=>x.paxId===p.id&&x.kind===kind?`<label class="cs-service-option"><span><input type="checkbox" data-cservice="${i}" ${x.infant||ancState().purchased[x.key]?.[kind]===x.code?'disabled':''}> ${esc(x.name)}${ancState().purchased[x.key]?.[kind]===x.code?' · Đã có':''}</span><b>${money(x.price)}</b></label>`:'').join('')}`).join('')}</section>`).join('')}</div><div class="cs-service-total">Tổng phí dịch vụ<br><b id="cs-service-amount">${money(0)}</b></div>`,'Thanh toán',()=>customerAncillaryCheckout([...selected.values()],version));const d=document.querySelector('#dialog');d.className='customer-service-dialog';d.querySelector('#dialog-back').textContent='Đóng';d.querySelector('#dialog-confirm').disabled=true;d.querySelectorAll('[data-cservice]').forEach(el=>el.onchange=()=>{const x=catalog[+el.dataset.cservice];if(el.checked){for(const [id,y]of selected)if(y.key===x.key&&y.kind===x.kind){selected.delete(id);d.querySelector('[data-cservice="'+id+'"]').checked=false;}selected.set(el.dataset.cservice,x);}else selected.delete(el.dataset.cservice);d.querySelector('#cs-service-amount').textContent=money([...selected.values()].reduce((n,x)=>n+x.price,0));d.querySelector('#dialog-confirm').disabled=!selected.size;});
}

function customerExchangeQuote(){const j=journey(),c=j.flightChoice,q=j.flightQuote,valid=q&&q.choice===c.name&&q.version===j.flight.version&&q.until>Date.now();return card('Báo giá đổi vé',`<p>Chuyến mới</p><div class="customer-flight-ticket"><div class="customer-flight-route">Hồ Chí Minh → Hà Nội</div><div class="customer-flight-inner"><b>Vietnam Airlines · VN-DEMO</b><p>${esc(j.flightOptions.date)} · Phổ thông (${c.fareLabel||'Tiêu chuẩn'})</p><p><b>${c.time} SGN → ${c.time==='18:00'?'20:10':'16:10'} HAN</b> · Bay thẳng</p></div></div><h3>Chi tiết theo vé</h3><div class="ce-quote-person"><p>${esc(j.flight.name)} · Vé ${esc(j.flight.ticket)}</p><div class="ce-quote-grid">${[['Giá cũ',3200000],['Giá mới',3200000+c.fare],['Chênh lệch',c.fare],['Phí đổi',c.fee],['Hoàn lại',q?.refund||0]].map(([k,v])=>`<div><small>${k}</small><b>${money(v)}</b></div>`).join('')}</div></div>${j.flight.seat||j.flight.services.length?'<p class="ce-info">Ghế và dịch vụ đã mua cần được kiểm tra lại theo báo giá đổi vé; điều kiện giữ, hủy và hoàn phải hiển thị theo kết quả hãng.</p>':''}<div class="ce-payment-summary">${priceRows([['Số tiền cần thanh toán',money(c.price)],['Số tiền được hoàn',money(q?.refund||0)]])}<p>Bookese hoàn số tiền được hoàn sau khi đổi vé xong (nếu có).</p><p>Vé chỉ đổi sau khi thanh toán xong và hãng xác nhận.</p><p>${valid?'Báo giá còn hiệu lực đến '+jTime(q.until):'Báo giá hết hạn. Vui lòng kiểm tra lại giá.'}</p></div><div class="actions">${btn(valid?'Xác nhận và thanh toán':'Kiểm tra lại báo giá',valid?'ce-pay':'flight-reprice','primary')}${btn('Chọn chuyến khác','ce-choice-back')}</div>`);}

 const footer=d.querySelector('.actions');

function flightOpsState(){const j=journey();return j.opsRequests||(j.opsRequests=[]);}
function flightOpsSelected(){return flightOpsState()[st.flightOpsSelected??-1]||null;}
function flightOpsStatusTone(s){return s==='Hoàn tất'?'good':s.includes('Từ chối')?'bad':'warn';}
function flightOpsCreate(type,note,proof='',urgent=false,actor=jActor()){
 const c=flightOpsCatalog[type];if(!c||!note?.trim())return false;
 const list=flightOpsState();list.push({id:'AIR-'+String(list.length+1).padStart(3,'0'),type,note:note.trim(),proof:proof.trim(),urgent:urgent||['void','failedTicket'].includes(type),owner:c.owner,status:'Mới tiếp nhận',created:stamp(),actor,events:[stamp()+' · '+actor+' tạo yêu cầu']});
 st.flightOpsSelected=list.length-1;jLog(list.at(-1).id+': '+c.label+' · mới tiếp nhận',actor);save();return true;
}
function flightOpsList(){const list=flightOpsState();return list.length?`<div class="flight-ops-list">${list.map((r,i)=>{const c=flightOpsCatalog[r.type];return `<button type="button" data-action="flight-ops-open-${i}" class="flight-ops-item ${st.flightOpsSelected===i?'active':''}"><span>${badge(c.tag,r.urgent?'bad':'neutral')} <b>${esc(r.id)} · ${esc(c.label)}</b></span><small>${esc(r.status)} · ${esc(r.owner)}</small></button>`;}).join('')}</div>`:'<p class="muted">Chưa có yêu cầu nghiệp vụ bổ sung.</p>';}
function flightOpsIntake(){return card('Tiếp nhận nghiệp vụ trên vé',`<p>Tạo yêu cầu trên đúng đơn và đúng hành khách/chặng. Các nghiệp vụ thủ công được CS gửi Hồng Ngọc Hà; tiền do Kế toán xác nhận.</p><form id="flight-ops-intake"><div class="grid">${select('Nghiệp vụ','fo-type',Object.values(flightOpsCatalog).map(v=>v.label))}${field('PNR / số vé / giao dịch liên quan','fo-proof','text',journey().flight.pnr+' / '+journey().flight.ticket,'',true)}${field('Hạn cần phản hồi','fo-due','datetime-local','2026-10-01T12:00','',true)}${textfield('Khách / chặng / nội dung yêu cầu','fo-note','',true)}</div>${tick('Đã xác minh người yêu cầu và phạm vi vé cần xử lý','fo-consent')}<button class="primary">Tạo yêu cầu xử lý</button></form>`);}
function flightOpsDetail(){const r=flightOpsSelected();if(!r)return flightOpsIntake();const c=flightOpsCatalog[r.type];return card(r.id+' · '+c.label,`<div class="flight-ops-head">${badge(c.tag,r.urgent?'bad':'neutral')}${badge(r.status,flightOpsStatusTone(r.status))}</div>${kv([['Khách / phạm vi',esc(r.note)],['Tham chiếu đầu vào',esc(r.proof||'Chưa có')],['Đầu mối',esc(r.owner)],['Tạo bởi',esc(r.actor)+' · '+esc(r.created)]])}${alert('<b>Quy tắc:</b> '+esc(c.rule),'info')}<p><b>Việc tiếp theo:</b> ${esc(c.next)}</p><form id="flight-ops-result"><div class="grid">${select('Kết quả / bước tiếp theo','fo-status',['Đã gửi Hồng Ngọc Hà','Chờ khách bổ sung hồ sơ','Chờ báo giá / waiver','Chờ khách đồng ý','Chờ thanh toán','Chờ Kế toán xử lý','Đang đối chiếu hệ thống','Hoàn tất','Từ chối / không đủ điều kiện'],r.status)}${field('Mã phản hồi / PNR mới / SCT / chứng từ','fo-result-proof','text','','',true)}${field('Số tiền phí hoặc hoàn xác nhận (đ)','fo-amount','number',r.amount||0)}${textfield('Kết quả kiểm tra và nội dung cần báo khách','fo-result-note',r.result||'',true)}</div>${tick('Đã đối chiếu đúng đơn, hành khách, chặng và nguồn kết quả','fo-result-consent')}<button class="primary">Lưu tiến độ xử lý</button></form><details><summary>Lịch sử yêu cầu</summary><p>${r.events.map(esc).join('<br>')}</p></details>`)+`<p>${btn('Tạo yêu cầu khác','flight-ops-new')}</p>`;}
function flightOpsCenter(){const pendingManual=journey().manual.filter(r=>!r.done);return `<div class="flight-ops-title"><div><h1>CS xử lý nghiệp vụ vé</h1><p>FL-DEMO-0001 · PNR ${esc(journey().flight.pnr)} · ${esc(journey().flight.name)}</p></div>${btn('Về chi tiết vé','flight-section-info')}</div><div class="flight-ops-layout"><div class="flight-ops-queue">${card('Yêu cầu trên đơn',`${pendingManual.length?`<p><b>${pendingManual.length}</b> yêu cầu sửa tên/hoàn tiêu chuẩn đang ở mục Hoàn vé & sửa tên.</p>`:''}${flightOpsList()}${btn('＋ Tạo yêu cầu','flight-ops-new','primary')}`)}</div><div class="flight-ops-work">${flightOpsDetail()}${card('Ranh giới xử lý',table(['Nhóm','Hệ thống / CS'],[['Đổi giờ cùng tuyến, ghế, hành lý','API đủ điều kiện → khách hoặc CS thao tác trên Bookese'],['Hoàn tiêu chuẩn, sửa tên','Khách gửi request → CS kiểm chính sách và làm với HNH'],['Void, reroute, split PNR, waiver, SSR','CS xử lý thủ công với HNH'],['Hoàn một phần, thanh toán trùng, chargeback','CS thu thập/đối chiếu → Kế toán xử lý tiền'],['Drop Ticket','CS kiểm tiền + TTL → HNH/Tech xuất lại, rebook hoặc hoàn']]))}</div></div>`;}

function customerFlightInvoice(){const i=ops().invoice;return `<div class="customer-request-summary"><b>FL-DEMO-0001</b><span>Thanh toán: 24/09/2026</span><span>${i?esc(i.status):'Chưa yêu cầu hóa đơn'}</span></div><p>Bookese áp dụng hạn xuất hóa đơn trong ngày thanh toán. Nếu gửi sau hạn, Kế toán kiểm tra ngoại lệ; hệ thống không tự xuất lùi ngày.</p><div class="customer-request-grid">${field('Tên đơn vị / cá nhân','cfi-name','text',i?.name||'','',true)}${field('Mã số thuế (nếu có)','cfi-tax','text',i?.tax||'')}${field('Địa chỉ hóa đơn','cfi-address','text',i?.address||'','',true)}${field('Email nhận hóa đơn','cfi-email','email',i?.email||'','',true)}</div>${tick('Tôi xác nhận thông tin hóa đơn','cfi-consent')}`;}

function auditLocalTime(ms=Date.now()+2*3600000){return new Date(ms+7*3600000).toISOString().slice(0,16);}
function auditDay(ms){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Ho_Chi_Minh',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(ms));}
function auditFlightInvoice(){return journey().flight.invoice||null;}
function auditPaidAt(){return journey().flight.paidAt||'2026-09-24T10:00:00+07:00';}
function auditInvoiceLate(now=Date.now()){return auditDay(now)!==auditDay(auditPaidAt());}
const auditInvoiceBase=orderInvoice;
orderInvoice=()=>!orderFlight()?auditInvoiceBase():card('Thông tin hóa đơn',kv([['Ngày thanh toán',new Date(auditPaidAt()).toLocaleDateString('vi-VN',{timeZone:'Asia/Ho_Chi_Minh'})],['Tên đơn vị',esc(auditFlightInvoice()?.name||'Chưa cung cấp')],['Mã số thuế',esc(auditFlightInvoice()?.tax||'—')],['Địa chỉ',esc(auditFlightInvoice()?.address||'—')],['Email',esc(auditFlightInvoice()?.email||'—')],['Tình trạng',esc(auditFlightInvoice()?.status||'Chưa yêu cầu')],['Số hóa đơn',esc(auditFlightInvoice()?.number||'—')]])+`<p class="note">Xuất trong ngày thanh toán (giờ Việt Nam). Yêu cầu trễ được Kế toán kiểm tra.</p>${btn(auditFlightInvoice()?.number?'Xem / yêu cầu điều chỉnh':'Bổ sung thông tin hóa đơn','customer-flight-invoice')}`);
customerFlightInvoice=()=>{const i=auditFlightInvoice();return `<div class="customer-request-summary"><b>FL-DEMO-0001</b><span>Ngày thanh toán: ${new Date(auditPaidAt()).toLocaleDateString('vi-VN')}</span><span>${esc(i?.status||'Chưa yêu cầu')}</span></div><p>${i?.number?'Hóa đơn đã xuất. Thông tin bạn gửi được lưu thành yêu cầu điều chỉnh; hóa đơn cũ được giữ lại.':'Hóa đơn xuất trong ngày thanh toán. Gửi sau hạn sẽ chuyển Kế toán kiểm tra.'}</p><div class="customer-request-grid">${field('Tên đơn vị / cá nhân','cfi-name','text',i?.name||'','',true)}${field('Mã số thuế (nếu có)','cfi-tax','text',i?.tax||'')}${field('Địa chỉ hóa đơn','cfi-address','text',i?.address||'','',true)}${field('Email nhận hóa đơn','cfi-email','email',i?.email||'','',true)}</div>${tick('Tôi xác nhận thông tin hóa đơn','cfi-consent')}`;};
function auditSaveInvoice(v){if(!v['cfi-name']?.trim()||!v['cfi-address']?.trim()||!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v['cfi-email']||'')||!v['cfi-consent'])return false;const previous=auditFlightInvoice();const data={name:v['cfi-name'].trim(),tax:(v['cfi-tax']||'').trim(),address:v['cfi-address'].trim(),email:v['cfi-email'].trim(),at:stamp(),late:auditInvoiceLate(),actor:jActor()};if(previous?.number){previous.adjustment=data;previous.status='Chờ Kế toán kiểm tra điều chỉnh';}else journey().flight.invoice={...data,status:data.late?'Gửi sau hạn · Kế toán kiểm tra':'Chờ xuất trong ngày thanh toán'};jLog('FL-DEMO-0001: lưu yêu cầu hóa đơn vé',jActor());save();return true;}

const auditCreateBase=flightOpsCreate;
flightOpsCreate=(type,note,proof='',urgent=false,actor=jActor(),due=auditLocalTime(),scope='')=>{if(flightOpsState().some(r=>r.type===type&&r.note===note?.trim()&&!r.closed)){toast('Yêu cầu này đang được xử lý trên đơn.');return false;}if(!auditCreateBase(type,note,proof,urgent,actor))return false;const r=flightOpsState().at(-1);Object.assign(r,{due,scope:scope||journey().flight.name+' · '+journey().flight.ticket+' · SGN → HAN',step:'intake',inputRef:proof,publicStatus:'Bookese đã tiếp nhận'});save();return true;};
function auditStage(r){return r.closed?'done':r.step||'intake';}
function auditEvent(r,status){r.status=status;r.events.push(stamp()+' · '+st.role+' · '+status);jLog(r.id+': '+status,st.role);save();}
function auditRefundKind(r){return ['fareRefund','partialRefund','void','involuntary','doubleCharge'].includes(r.type);}
function auditQuoteKind(r){return auditRefundKind(r)||r.type==='reroute';}
function auditAmount(v,k){const n=Number(v[k]);return v[k]!==undefined&&String(v[k]).trim()!==''&&Number.isFinite(n)&&n>=0?n:null;}

function auditForm(title,id,body,button){return `<form id="${id}" class="audit-form"><h3>${title}</h3>${body}<div class="actions"><button class="primary">${button}</button></div></form>`;}
function auditProof(){return field('Mã phản hồi / chứng từ HNH hoặc cổng thanh toán','fa-proof','text','','',true);}
function auditResults(r){let body='';if(r.type==='split')body=field('PNR còn lại sau tách','fa-old','text',journey().flight.pnr,'',true)+field('PNR mới','fa-new','text','','',true)+textfield('Mapping hành khách và số vé sang PNR mới','fa-map','',true);else if(r.type==='ssr')body=field('Mã SSR và chặng được hãng xác nhận','fa-value','text','','',true);else if(r.type==='mileage')body=field('Chương trình và mã thẻ đã bổ sung vào PNR','fa-value','text','','',true);else if(r.type==='reroute')body=field('PNR sau đổi','fa-new','text',journey().flight.pnr,'',true)+field('Số vé mới','fa-ticket','text','','',true)+field('Hành trình / hạng vé mới đã xác nhận','fa-value','text','','',true);else if(r.type==='chargeback')body=select('Kết quả ngân hàng','fa-value',['Chấp nhận hồ sơ của Bookese','Bồi hoàn cho chủ thẻ','Đang chờ ngân hàng']);else body=field('Phạm vi vé / dịch vụ đã hoàn tại NCC','fa-value','text',r.scope||r.note,'',true);return auditForm('Ghi kết quả đã xác nhận','audit-provider-result',`<div class="grid">${body}${auditProof()}</div>${textfield('Nội dung kết quả gửi khách','fa-public','',true)}${tick('Đã đối chiếu đúng vé và kết quả thực hiện của nguồn','fa-confirm')}`,auditRefundKind(r)?'Lưu kết quả & lập khoản hoàn':'Lưu kết quả và cập nhật đơn');}
function auditDrop(r){return auditForm('Kiểm tra tiền và kết quả xuất vé','audit-drop-check',`<div class="grid">${select('Kết quả đối chiếu tiền','fa-paid',['Chưa xác minh','Đã nhận tiền'])}${field('SCT / giao dịch cổng đã đối chiếu','fa-payment','text',r.paymentRef||'')}${select('Kết quả lấy booking mới nhất','fa-provider',['Chưa rõ kết quả','Đã xuất vé','Chưa xuất · còn giữ chỗ','Đã hết hạn giữ'])}${field('Hạn xuất vé / TTL NCC','fa-ttl','datetime-local',auditLocalTime())}${field('Số vé nếu NCC đã xuất','fa-ticket','text')}${auditProof()}</div>${tick('Đã đối chiếu kết quả lệnh cũ, không còn lệnh xuất chưa rõ','fa-confirm')}`,'Lưu kết quả kiểm tra')+(r.canIssue?auditForm('Xuất vé trong hạn giữ','audit-drop-issue',`${jMock('fi-issue',['Đã xuất vé','Chưa rõ kết quả','NCC từ chối'])}${field('Số vé NCC trả về khi thành công (mẫu)','fi-ticket','text','738-DEMO-RECOVERED')}${field('Tham chiếu lệnh xuất','fi-proof','text','','',true)}`,'Gửi lệnh xuất vé (mô phỏng)'):'')+(r.expired?alert('Chỗ đã hết hạn. CS cần tìm phương án mới, báo giá và lấy đồng ý của khách; không xuất lại trên PNR hết hạn.','warn')+btn('Mở yêu cầu phương án mới / hoàn','flight-ops-new'):'');}
function auditWork(r){const step=auditStage(r);if(step==='done')return alert('Đã lưu kết quả trên đơn. '+(r.refundId?'Khoản '+esc(r.refundId)+' tiếp tục được CS xác nhận và Kế toán trả tiền.':''),'good')+(r.refundId?btn('Mở tiến độ hoàn tiền','audit-open-refunds','primary'):'');if(r.type==='failedTicket')return auditDrop(r);if(step==='intake')return auditForm('Liên hệ nguồn xử lý','audit-send',`${auditProof()}${textfield('Nội dung gửi HNH / Kế toán / ngân hàng','fa-note',r.note,true)}`,'Ghi nhận đã gửi · chờ phản hồi');if(step==='sent'&&auditQuoteKind(r))return auditForm('Phương án từ HNH / nguồn tiền','audit-quote',`<div class="grid">${field('Khoản trả thêm theo NCC (đ)','fa-collect','number','0','',true)}${field('Khoản tiền trả lại khách (đ)','fa-refund','number','0','',true)}${field('Phí Bookese giữ lại (đ)','fa-fee','number','0','',true)}${field('Phí xử lý Bookese (đ)','fa-processing','number','0','',true)}${field('Hạn báo giá / cut-off được xác nhận','fa-until','datetime-local',auditLocalTime(),'',true)}${auditProof()}</div>${textfield('Điều kiện / phạm vi / phí hãng và ảnh hưởng dịch vụ','fa-note','',true)}<p class="note">Phí xử lý Bookese thu thêm riêng, cộng vào khoản trả thêm theo NCC để tạo QR; không trừ tự động vào tiền hoàn và không gộp với phí Bookese giữ lại. Nhập số tiền nguồn xác nhận. Không tính hoàn một phần bằng cách chia đều giá vé; không mặc định Void miễn phí.</p>`,'Lưu phương án · chờ khách đồng ý');if(step==='quoted')return auditForm('Ghi nhận quyết định của khách','audit-consent',`${kv([['Trả thêm theo NCC',money(r.quote.supplierCollect??r.quote.collect)],['Phí xử lý Bookese',money(r.quote.processingFee||0)],['Tổng khách thanh toán thêm',money(r.quote.collect)],['Tiền hoàn',money(r.quote.refund)],['Phí Bookese giữ lại',money(r.quote.fee)],['Hạn phương án',esc(r.quote.until)]])}${field('Tham chiếu đồng ý của khách','fa-proof','text','','',true)}${tick('Khách đồng ý đúng phương án và khoản thu / hoàn này','fa-confirm')}`,'Xác nhận đồng ý');if(step==='payment')return auditForm('Xác minh khoản thanh toán bổ sung','audit-extra-paid',`<p>Chỉ thực hiện với HNH sau khi nhận đủ <b>${money(r.quote.collect)}</b>. Kế toán đối chiếu giao dịch gắn yêu cầu ${esc(r.id)}.</p>${field('Tham chiếu giao dịch đã đối chiếu','fa-proof','text','','',true)}${field('Số tiền đã nhận (đ)','fa-amount','number','','',true)}${tick('Đã đối chiếu tiền thực nhận','fa-confirm')}`,'Kế toán xác nhận tiền');return auditResults(r);}
flightOpsDetail=()=>{const r=flightOpsSelected();if(!r)return flightOpsIntake();const c=flightOpsCatalog[r.type];return card(r.id+' · '+c.label,`<div class="flight-ops-head">${badge(r.status,flightOpsStatusTone(r.status))}${badge(r.owner,'neutral')}</div><ol class="audit-steps"><li class="done">Tiếp nhận</li><li class="${auditStage(r)!=='intake'?'done':''}">Nguồn xác nhận</li><li class="${['ready','done'].includes(auditStage(r))?'done':''}">Khách / tiền</li><li class="${r.closed?'done':''}">Cập nhật đơn</li></ol>${kv([['Phạm vi',esc(r.scope||r.note)],['Yêu cầu',esc(r.note)],['Tham chiếu đầu vào',esc(r.inputRef||r.proof||'—')],['Hạn phản hồi',esc(r.due?.replace('T',' ')||'Chưa đặt')]])}<details><summary>Điều kiện xử lý cần chú ý</summary><p>${esc(c.rule)}</p></details>${auditWork(r)}<details><summary>Lịch sử xử lý (${r.events.length})</summary><p>${r.events.map(esc).join('<br>')}</p></details>`);};
const auditListBase=flightOpsList;
flightOpsList=()=>{flightOpsState().forEach((_,i)=>actions['flight-ops-open-'+i]=()=>{st.flightOpsSelected=i;save();render();});return auditListBase();};
flightOpsCenter=()=>`<div class="flight-ops-title"><div><h2>Yêu cầu & xử lý trên đơn vé</h2><p>CS làm trực tiếp Hồng Ngọc Hà · Kế toán xác nhận tiền</p></div>${btn('＋ Tiếp nhận yêu cầu','flight-ops-new','primary')}</div><div class="flight-ops-layout"><div class="flight-ops-queue">${card('Yêu cầu trên đơn',`${flightOpsList()}<hr><p>${journey().manual.filter(r=>!r.done).length} yêu cầu hoàn / sửa tên đang chờ</p>${btn('Mở hoàn vé / sửa tên','flight-section-manual')}${btn('Theo dõi tiền hoàn','audit-open-refunds')}`)}</div><div class="flight-ops-work">${flightOpsDetail()}</div></div>`;
if(!flightSections.some(x=>x[0]==='ops'))flightSections.splice(4,0,['ops','Yêu cầu & xử lý']);
actions['flight-section-ops']=actions['flight-ops-center'];
actions['audit-open-refunds']=()=>go('S09');
const auditWorkspaceBase=orderWorkspace;
orderWorkspace=()=>{const html=auditWorkspaceBase();return orderFlight()&&!orderCustomer()&&['ops','manual','services','exchange','history'].includes(flightSection)?html.replace('class="order-layout"','class="order-layout audit-wide"'):html;};
function auditSelected(){const r=flightOpsSelected();if(!r||r.closed||!allowed(['CS','Trưởng CS']))return null;return r;}
submits['audit-send']=v=>{const r=auditSelected();if(!r||!v['fa-proof']?.trim()||!v['fa-note']?.trim())return toast('Nhập tham chiếu và nội dung đã gửi.');r.sentRef=v['fa-proof'].trim();r.step='sent';r.publicStatus='Bookese đang kiểm tra với nhà cung cấp';auditEvent(r,'Đã gửi nguồn · chờ phản hồi');render();};
submits['audit-quote']=v=>{const r=auditSelected();const supplierCollect=auditAmount(v,'fa-collect'),processingFee=auditAmount({...v,'fa-processing':v['fa-processing']??'0'},'fa-processing'),collect=supplierCollect===null||processingFee===null?null:supplierCollect+processingFee,refund=auditAmount(v,'fa-refund'),fee=auditAmount(v,'fa-fee');if(!r||auditStage(r)!=='sent'||[collect,refund,fee].includes(null)||!v['fa-proof']?.trim()||!v['fa-note']?.trim()||!(Date.parse(v['fa-until']+'+07:00')>Date.now()))return toast('Kiểm tra tiền, căn cứ và thời hạn phương án.');r.quote={collect,supplierCollect,processingFee,refund,fee,until:v['fa-until'],proof:v['fa-proof'].trim(),note:v['fa-note'].trim()};r.step='quoted';r.publicStatus='Chờ khách xác nhận phương án';auditEvent(r,'Đã có phương án · chờ khách đồng ý');render();};
submits['audit-consent']=v=>{const r=auditSelected();if(!r||auditStage(r)!=='quoted'||!v['fa-confirm']||!v['fa-proof']?.trim())return toast('Cần căn cứ khách đồng ý.');if(Date.parse(r.quote.until+'+07:00')<=Date.now()){r.step='sent';auditEvent(r,'Phương án hết hạn · cần báo giá lại');render();return;}r.consent=v['fa-proof'].trim();r.step=r.quote.collect>0?'payment':'ready';r.publicStatus=r.step==='payment'?'Chờ thanh toán bổ sung':'Chờ nhà cung cấp thực hiện';auditEvent(r,r.step==='payment'?'Chờ tiền bổ sung':'Khách đồng ý · chờ nguồn thực hiện');render();};
submits['audit-extra-paid']=v=>{const r=flightOpsSelected();if(!r||r.closed||r.step!=='payment'||!allowed(['Kế toán'])||!v['fa-confirm']||!v['fa-proof']?.trim()||auditAmount(v,'fa-amount')!==r.quote.collect)return toast('Kế toán cần đối chiếu đúng số tiền và giao dịch.');r.paymentRef=v['fa-proof'].trim();r.step='ready';auditEvent(r,'Đã nhận tiền · chờ HNH thực hiện');render();};
function auditCreateRefund(r){if(r.refundId)return;const amount=r.quote.refund;const rf={id:'RF-'+(journey().refunds.length+1),service:'flight',opsRequest:r.id,amount,fee:r.quote.fee,coins:0,reward:0,coinDone:true,moneyDone:amount===0,status:'Chờ CS xác nhận hoàn',scope:r.scope||r.note,basis:r.resultRef,source:'CS / HNH'};journey().refunds.push(rf);r.refundId=rf.id;}
submits['audit-provider-result']=v=>{const r=auditSelected();if(!r||!v['fa-confirm']||!v['fa-proof']?.trim()||!v['fa-public']?.trim())return toast('Cần chứng từ nguồn, kết quả báo khách và xác nhận đối chiếu.');if(auditQuoteKind(r)&&r.step!=='ready')return toast('Cần phương án còn hiệu lực, khách đồng ý và đủ tiền trước khi cập nhật.');if(auditQuoteKind(r)&&Date.parse(r.quote.until+'+07:00')<=Date.now())return toast('Phương án đã quá hạn: kiểm tra lại với HNH trước khi cập nhật.');if(r.type==='split'){if(!v['fa-old']?.trim()||!v['fa-new']?.trim()||v['fa-old'].trim()===v['fa-new'].trim()||!v['fa-map']?.trim())return toast('Nhập hai PNR khác nhau và mapping hành khách / vé.');journey().flight.pnrSplits=(journey().flight.pnrSplits||[]).concat({old:v['fa-old'].trim(),next:v['fa-new'].trim(),mapping:v['fa-map'].trim(),proof:v['fa-proof'].trim()});}else if(!v['fa-value']?.trim())return toast('Nhập kết quả nghiệp vụ.');if(r.type==='reroute'){if(!v['fa-ticket']?.trim()||!v['fa-new']?.trim())return toast('Nhập PNR và số vé mới.');const f=journey().flight;f.previousTickets=(f.previousTickets||[]).concat({ticket:f.ticket,pnr:f.pnr,at:stamp()});f.ticket=v['fa-ticket'].trim();f.pnr=v['fa-new'].trim();f.confirmedItinerary=v['fa-value'].trim();f.version++;}if(r.type==='ssr')journey().flight.ssr={value:v['fa-value'].trim(),scope:r.scope,proof:v['fa-proof'].trim()};if(r.type==='mileage')journey().flight.mileage={value:v['fa-value'].trim(),proof:v['fa-proof'].trim()};r.resultRef=v['fa-proof'].trim();r.publicStatus=v['fa-public'].trim();if(r.type==='chargeback'&&v['fa-value']==='Đang chờ ngân hàng'){auditEvent(r,'Chờ kết quả ngân hàng');render();return;}if(auditRefundKind(r)){auditCreateRefund(r);if(['fareRefund','void'].includes(r.type))journey().flight.status='NCC đã hủy / hoàn · chờ trả tiền';}r.closed=true;r.step='done';auditEvent(r,'Hoàn tất');render();};
submits['audit-drop-check']=v=>{const r=auditSelected();if(!r||r.type!=='failedTicket'||!v['fa-proof']?.trim())return toast('Nhập tham chiếu kiểm tra mới nhất.');r.canIssue=false;r.expired=false;r.resultRef=v['fa-proof'].trim();const result=v['fa-provider'];if(result==='Đã xuất vé'){if(!v['fa-ticket']?.trim())return toast('NCC báo đã xuất: cần số vé để đồng bộ, không xuất lại.');journey().flight.ticket=v['fa-ticket'].trim();journey().flight.status='Đã xuất vé';r.closed=true;r.step='done';r.publicStatus='Vé đã được cập nhật';auditEvent(r,'Hoàn tất');}else if(result==='Chưa rõ kết quả'){r.publicStatus='Đang đối chiếu kết quả xuất vé';auditEvent(r,'Chưa rõ kết quả · không gửi lại lệnh');}else if(v['fa-paid']!=='Đã nhận tiền'||!v['fa-payment']?.trim()){auditEvent(r,'Chờ xác minh tiền · chưa được xuất vé');}else{r.paymentRef=v['fa-payment'].trim();r.ttl=Date.parse(v['fa-ttl']+'+07:00');r.canIssue=result==='Chưa xuất · còn giữ chỗ'&&v['fa-confirm']&&r.ttl>Date.now();r.expired=result==='Đã hết hạn giữ'||!(r.ttl>Date.now());auditEvent(r,r.canIssue?'Đủ điều kiện xuất trong hạn giữ':r.expired?'Hết hạn giữ · cần phương án mới':'Chờ đối chiếu lệnh cũ');}save();render();};
submits['audit-drop-issue']=v=>{const r=auditSelected();if(!r||!r.canIssue||!(r.ttl>Date.now())||!r.paymentRef||!v['fi-proof']?.trim())return toast('Kiểm tra lại tiền, thời hạn và lệnh xuất trước khi thực hiện.');const outcome=v['fi-issue']||'Chưa rõ kết quả';if(outcome==='Đã xuất vé'&&!v['fi-ticket']?.trim())return toast('Thiếu số vé nguồn xác nhận.');r.canIssue=false;r.resultRef=v['fi-proof'].trim();if(outcome==='Đã xuất vé'){journey().flight.ticket=v['fi-ticket'].trim();journey().flight.status='Đã xuất vé';journey().flight.version++;r.closed=true;r.step='done';r.publicStatus='Đã xuất vé, bạn có thể mở vé điện tử';auditEvent(r,'Hoàn tất');}else auditEvent(r,outcome==='Chưa rõ kết quả'?'Chưa rõ kết quả · tra cứu trước khi thử lại':'NCC từ chối · cần kiểm tra phương án mới');save();render();};
// Keep old saved requests readable; forbid the previous free-text completion shortcut.
submits['flight-ops-result']=v=>{const r=auditSelected();if(!r||v['fo-status']==='Hoàn tất')return toast('Mở bước nghiệp vụ để nhập đủ kết quả trước khi hoàn tất.');if(!v['fo-result-proof']?.trim()||!v['fo-result-note']?.trim())return false;r.resultRef=v['fo-result-proof'].trim();r.result=v['fo-result-note'].trim();auditEvent(r,v['fo-status']);render();};
const auditOverviewBase=flightOverviewV2;
flightOverviewV2=()=>{const f=journey().flight;let html=auditOverviewBase();if(f.confirmedItinerary)html=card('Hành trình sau thay đổi',`<b>${esc(f.confirmedItinerary)}</b><p>PNR ${esc(f.pnr)} · vé ${esc(f.ticket)}</p>`)+html;return html+(f.pnrSplits?.length?card('PNR sau tách',table(['PNR giữ lại','PNR mới','Hành khách / vé'],f.pnrSplits.map(x=>[esc(x.old),esc(x.next),esc(x.mapping)]))):'')+(f.ssr?card('Hỗ trợ đặc biệt đã xác nhận',esc(f.ssr.value)+' · '+esc(f.ssr.scope||'')):'')+(f.mileage?card('Thẻ thành viên đã bổ sung',esc(f.mileage.value)):'');};
const auditCustomerBase=currentCustomerFlight;
currentCustomerFlight=()=>auditCustomerBase()+(flightOpsState().filter(r=>r.actor==='Khách').length?card('Theo dõi yêu cầu hỗ trợ',table(['Yêu cầu','Tiến độ'],flightOpsState().filter(r=>r.actor==='Khách').map(r=>[esc(r.id+' · '+flightOpsCatalog[r.type].label),esc(r.publicStatus||'Bookese đã tiếp nhận')]))):'');
const auditFinanceBase=views.S18;
views.S18=()=>card('Hóa đơn vé máy bay · FL-DEMO-0001',auditFlightInvoice()?kv([['Đơn vị',esc(auditFlightInvoice().name)],['Email',esc(auditFlightInvoice().email)],['Trạng thái',esc(auditFlightInvoice().status)]])+auditForm('Ghi kết quả Kế toán','audit-invoice-result',`${field('Số hóa đơn / tham chiếu phản hồi','ai-number','text','','',true)}${textfield('Kết quả thông báo khách','ai-note','',true)}${select('Kết quả','ai-result',['Đã xuất hóa đơn','Cần bổ sung thông tin','Không thể xuất theo yêu cầu'])}`,'Lưu kết quả hóa đơn'):'<p>Chưa có yêu cầu hóa đơn vé.</p>')+auditFinanceBase();
submits['audit-invoice-result']=v=>{const i=auditFlightInvoice();if(!i||!allowed(['Kế toán'])||!v['ai-number']?.trim()||!v['ai-note']?.trim())return toast('Kế toán nhập tham chiếu và nội dung phản hồi.');if(v['ai-result']==='Đã xuất hóa đơn'){if(i.adjustment){i.history=(i.history||[]).concat({number:i.number,name:i.name,tax:i.tax,address:i.address,email:i.email});Object.assign(i,i.adjustment);delete i.adjustment;}i.number=v['ai-number'].trim();}i.status=v['ai-result'];i.result=v['ai-note'].trim();jLog('FL-DEMO-0001: '+i.status,'Kế toán');save();render();};
const auditDetailWithSteps=flightOpsDetail;
flightOpsDetail=()=>{const r=flightOpsSelected();return auditDetailWithSteps()+(r&&!r.closed?`<details class="card"><summary>Chờ thêm thông tin / không thể thực hiện</summary>${auditForm('Cập nhật cho khách','audit-wait',`${select('Kết quả','aw-result',['Chờ khách bổ sung','Chờ HNH phản hồi','Nguồn từ chối / không đủ điều kiện','Khách không tiếp tục'])}${field('Hẹn cập nhật tiếp theo (giờ Việt Nam)','aw-due','datetime-local',r.due||auditLocalTime())}${field('Tham chiếu phản hồi','aw-proof','text','','',true)}${textfield('Nội dung khách được xem','aw-note','',true)}`,'Lưu phản hồi')}</details>`:'');};

const auditFinanceWithInvoice=views.S18;

function csCan(){return allowed(['CS','Trưởng CS','Kế toán']);}
function csTicketCan(){return allowed(['CS','Trưởng CS']);}
function csRefRecords(){return [...journey().manual.map((r,i)=>({r,ref:'M'+i})).filter(x=>x.r.type==='Hoàn vé'),...flightOpsState().map((r,i)=>({r,ref:'A'+i})).filter(x=>['fareRefund','partialRefund'].includes(x.r.type))];}
function csRefRecord(ref){return csRefRecords().find(x=>x.ref===ref)?.r;}
function csRefundState(r){return r.flightRefund||(r.flightRefund={phase:r.done||r.closed?'legacy':'new'});}
function csRefundLimit(){return Math.max(0,(journey().flight.cashPaid??3200000)-journey().refunds.filter(x=>x.service==='flight'&&!x.order).reduce((n,x)=>n+x.amount,0));}
function csRefundLog(r,text){r.status=text;r.publicStatus=text;if(r.events)r.events.push(stamp()+' · '+jActor()+' · '+text);jLog(r.id+': '+text,jActor());save();}
function csRefundPanel(r,ref,customer=false){const f=csRefundState(r),q=f.quote;let body=`<p>${esc(r.note||r.scope)}</p>${badge(r.status||'Mới tiếp nhận','warn')}<p class="note">Hoàn vé và trả tiền là hai bước riêng. ${customer?'Bookese kiểm điều kiện và xử lý yêu cầu của bạn.':'CS thao tác trên Bookese qua API; không cần chuyển HNH thực hiện hoàn theo điều kiện.'}</p>`;
 if(f.phase==='legacy')body+=alert('Yêu cầu đã có kết quả từ bản trước. Giữ nguyên chứng từ và đối chiếu khoản tiền; không gửi lại lệnh hoàn vé.','info');
 if(!customer&&['new','blocked','failed','quoted'].includes(f.phase))body+=`<form id="cs-quote-${ref}"><div class="grid">${select('Phạm vi cần kiểm tra','cr-scope',['Toàn bộ booking chưa sử dụng','Vé cụ thể / phần còn lại','EMD / dịch vụ'],f.scope||'Toàn bộ booking chưa sử dụng')}${field('Vé / hành khách / chặng hoặc EMD','cr-target','text',f.target||journey().flight.ticket+' · '+journey().flight.name+' · SGN → HAN','',true)}</div>${jMock('cr-result',['Đủ điều kiện','Không được hoàn','Không hỗ trợ phạm vi','API chưa rõ'])}<button class="primary">Kiểm tra điều kiện & tính số hoàn</button></form>`;
 if(q){body+=`<div class="summary"><b>Phương án hoàn đã tính</b>${kv([['Phạm vi được hoàn',esc(q.target)],['Phí hoàn hãng đã khấu trừ',money(q.penalty)],['Phí Bookese giữ lại',money(q.bookeseFee)],['Tiền trả khách',money(q.amount)],['Xu đã dùng trả lại / xu thưởng điều chỉnh','Theo phần dịch vụ được hoàn; đơn vé mẫu không dùng xu'],['Hạn phương án (mẫu)',jTime(q.until)]])}</div>`;if(f.phase==='quoted')body+=`<form id="cs-consent-${ref}">${!customer?field('Tham chiếu khách đồng ý phương án','cr-proof','text','','',true):''}${tick(customer?'Tôi đồng ý phạm vi, phí và số tiền hoàn':'Đã nhận đồng ý của khách đúng phương án này','cr-consent')}<button class="primary">${customer?'Đồng ý phương án':'Ghi nhận khách đồng ý'}</button></form>`;}
 if(!customer&&f.phase==='consented')body+=`<form id="cs-api-${ref}">${tick('Đối chiếu đúng vé, phạm vi và đồng ý của khách trước khi hoàn','cr-confirm')}${jMock('cr-api-result',['Hoàn vé thành công','Chưa rõ kết quả','API từ chối'])}<button class="danger">CS xác nhận hoàn vé qua API</button></form>`;
 if(f.phase==='pending')body+=alert('Lệnh hoàn vé đang chờ kết quả. Vé chưa được xác nhận đã hoàn; không gửi lệnh mới.')+(!customer?`<form id="cs-query-${ref}">${jMock('cr-query',['Vẫn chưa rõ','Đã hoàn thành công','Xác nhận chưa thực hiện'])}<button class="primary">Tra cứu kết quả lệnh hoàn</button></form>`:'');
 if(f.refundId){const rf=journey().refunds.find(x=>x.id===f.refundId);body+=kv([['Kết quả vé','API xác nhận đã hoàn đúng phạm vi'],['Tiền trả khách',esc(rf?.status||'Chờ xử lý')],['Đã trả / phải trả',money(rf?.moneyPaid||(rf?.moneyDone?rf.amount:0))+' / '+money(rf?.amount||0)]])+(customer?'':btn('CS hoàn tiền qua OnePay / thủ công','cs-open-money','primary'));}
 return card(r.id+' · Hoàn vé theo điều kiện',body);}
function csCalculate(ref,v){const r=csRefRecord(ref);if(!r||!csTicketCan()||!v['cr-target']?.trim())return false;const f=csRefundState(r);if(['pending','done','legacy'].includes(f.phase))return false;f.quote=null;f.consent=null;f.scope=v['cr-scope'];f.target=v['cr-target'].trim();const result=v['cr-result'];if(result!=='Đủ điều kiện'){f.phase='blocked';csRefundLog(r,result||'Chưa có kết quả tính hoàn');return false;}const full=f.scope==='Toàn bộ booking chưa sử dụng',emd=f.scope==='EMD / dịch vụ',amount=full?2800000:emd?200000:1250000;if(amount>csRefundLimit()){f.phase='blocked';csRefundLog(r,'Số hoàn vượt khoản còn lại · cần đối chiếu');return false;}f.quote={target:f.target,scope:f.scope,all:full,isEMD:emd,amount,penalty:full?350000:emd?0:150000,bookeseFee:emd?0:50000,refundValue:'DEMO-RFV-'+Date.now()+'-'+ref,version:journey().flight.version,until:Date.now()+900000};f.phase='quoted';csRefundLog(r,'Chờ khách đồng ý phương án hoàn');return true;}
function csConsent(ref,v,customer=false){const r=csRefRecord(ref);if(!r)return false;const f=csRefundState(r);if(!f.quote||f.phase!=='quoted'||!v['cr-consent']||(!customer&&(!csTicketCan()||!v['cr-proof']?.trim())))return false;if(f.quote.until<=Date.now()||f.quote.version!==journey().flight.version){f.phase='new';f.quote=null;csRefundLog(r,'Phương án thay đổi / hết hạn · cần tính lại');return false;}f.consent=customer?'Khách xác nhận trên Bookese':v['cr-proof'].trim();f.phase='consented';csRefundLog(r,'Khách đồng ý · chờ CS hoàn vé qua API');return true;}
function csFinishTicket(r,ref){const f=csRefundState(r);if(f.refundId)return false;const q=f.quote;const rf={id:'RF-'+(journey().refunds.length+1),service:'flight',requestId:r.id,amount:q.amount,fee:q.bookeseFee,airlineFee:q.penalty,coins:0,reward:0,coinDone:true,moneyDone:false,moneyPaid:0,status:'Chờ CS xác nhận hoàn',scope:q.target,basis:f.command,source:'API hoàn vé',sourceTxn:'ONEPAY-DEMO-ORIGINAL',payouts:[]};journey().refunds.push(rf);f.refundId=rf.id;f.phase='done';r.done=f.command;r.closed=true;r.step='done';const flight=journey().flight;flight.refundedScopes=(flight.refundedScopes||[]).concat({request:r.id,scope:q.target,amount:q.amount,command:f.command,at:stamp()});flight.status=q.all?'Đã hoàn vé · chờ trả tiền':q.isEMD?'Đã xuất vé · đã hoàn dịch vụ':'Đã hoàn một phần vé';flight.version++;csRefundLog(r,'API đã hoàn vé · CS tiếp tục trả tiền');return true;}
function csExecute(ref,v){const r=csRefRecord(ref);if(!r||!csTicketCan())return false;const f=csRefundState(r);if(f.phase!=='consented'||!f.consent||!f.quote||!v['cr-confirm'])return false;if(f.quote.until<=Date.now()||f.quote.version!==journey().flight.version){f.phase='new';f.quote=null;csRefundLog(r,'Cần tính lại phương án trước khi hoàn');return false;}if(csRefRecords().some(x=>x.r!==r&&csRefundState(x.r).phase==='pending'))return toast('Đơn có lệnh hoàn chưa rõ kết quả. Tra cứu lệnh đó trước.');f.command='DEMO-REFUND-'+ref+'-'+Date.now();f.phase='pending';const result=v['cr-api-result'];if(result==='Hoàn vé thành công')return csFinishTicket(r,ref);if(result==='API từ chối'){f.phase='failed';csRefundLog(r,'API từ chối · vé chưa được hoàn');return false;}csRefundLog(r,'Chờ kết quả hoàn vé từ API');return false;}
function csQuery(ref,v){const r=csRefRecord(ref);if(!r||!csTicketCan())return false;const f=csRefundState(r);if(f.phase!=='pending')return false;if(v['cr-query']==='Đã hoàn thành công')return csFinishTicket(r,ref);if(v['cr-query']==='Xác nhận chưa thực hiện'){f.phase='new';f.quote=null;csRefundLog(r,'Đã đối chiếu chưa hoàn · tính lại phương án');return false;}csRefundLog(r,'Vẫn chờ kết quả · không gửi lặp');return false;}
function csNamePanel(r,i,customer=false){return card(r.id+' · Sửa tên qua Hồng Ngọc Hà',`<p>${esc(r.note)}</p>${badge(r.status,'warn')}<p>CS tiếp nhận và gửi HNH thực hiện. Tên trên đơn chỉ thay đổi khi có kết quả xác nhận.</p>${r.quote?kv([['Tên được chấp nhận',esc(r.quote.name)],['Phí sửa tên',money(r.quote.fee)],['Căn cứ',esc(r.quote.proof)]]):!customer?`<form id="j-manual-quote-${i}">${field('Tên mới HNH chấp nhận','jm-name','text','','',true)}${field('Phí sửa tên được xác nhận','jm-fee','number',0,'',true)}<input type="hidden" name="jm-refund" value="0">${field('Tham chiếu phản hồi HNH','jm-proof','text','','',true)}<button class="primary">Lưu phương án HNH để báo khách</button></form>`:''}${r.quote&&!r.consent?`<form id="j-manual-consent-${i}">${tick(customer?'Tôi đồng ý phương án và phí':'Đã nhận đồng ý của khách','jm-consent')}<button class="primary">Xác nhận phương án</button></form>`:''}${r.consent&&!r.done?(!r.paid&&r.quote.fee>0?`<p>Chờ thanh toán phí qua QR; tiền được ghi nhận từ giao dịch cổng.</p>${btn('Mở QR thanh toán','cs-name-qr-'+i)}`:!customer?`<form id="j-manual-done-${i}">${field('Chứng từ HNH đã sửa tên','jm-done-proof','text','','',true)}<button class="primary">Cập nhật tên đã sửa lên đơn</button></form>`:'<p>Bookese đang phối hợp HNH thực hiện.</p>'):''}${r.done?alert('Tên đã sửa được cập nhật trên thông tin hành khách.','good'):''}`);}

flightDetailV2=customer=>!customer&&flightSection==='name-intake'?card('Tiếp nhận yêu cầu sửa tên',`<form id="j-manual-request"><input name="jm-type" value="Sửa tên hành khách" type="hidden">${textfield('Tên hiện tại / tên đề nghị / lý do','jm-note','',true)}<button class="primary">Tiếp nhận và theo dõi với HNH</button></form>`):!customer&&flightSection==='manual'?flightOpsCenter():csOldFlightDetail(customer);
function csMoneyPaid(r){return r.moneyPaid??(r.moneyDone?r.amount:0);}
function csMoneyCard(r,i,customer=false){const left=Math.max(0,r.amount-csMoneyPaid(r)),pending=(r.payouts||[]).find(x=>x.status==='pending');return card(r.id+' · Trả tiền cho khách',`${badge(r.status,r.moneyDone?'good':'warn')}${kv([['Phạm vi',esc(r.scope)],['Tổng tiền được trả',money(r.amount)],['Đã trả thành công',money(csMoneyPaid(r))],['Còn phải trả',money(left)],['Xu',r.coinDone?'Đã đối chiếu / không phát sinh trên đơn mẫu':'Chờ hoàn xu và điều chỉnh thưởng']])}${!customer&&!r.approved?`<form id="j-refund-approve-${i}">${field('Căn cứ CS xác nhận số tiền cuối cùng','jrf-proof','text',r.basis||'','',true)}<button class="primary">CS xác nhận khoản hoàn</button></form>`:''}${!customer&&r.approved&&left>0&&!pending?`<form id="cs-money-${i}"><div class="grid">${select('Cách trả tiền','cm-method',['OnePay · hoàn về giao dịch gốc','Hoàn thủ công'])}${field('Số tiền hoàn lần này (đ)','cm-amount','number',left,'Có thể hoàn toàn bộ số còn lại hoặc một phần.',true)}${field('Giao dịch gốc / tham chiếu phương thức nhận tiền','cm-target','text',r.sourceTxn||'PAY-DEMO-ORIGINAL','',true)}${field('SCT / chứng từ hoàn thủ công (bắt buộc khi chọn thủ công)','cm-proof','text')}</div>${tick('Đã kiểm tra người nhận, số tiền và không có lệnh hoàn đang chờ','cm-consent')}${jMock('cm-result',['Đang xử lý','Thành công','Thất bại'])}<button class="primary">CS thực hiện hoàn tiền</button><p class="note">OnePay lấy kết quả từ cổng. Hoàn thủ công cần chứng từ giao dịch thực tế; ảnh QR hoặc lệnh gửi chưa chứng minh đã trả tiền.</p></form>`:''}${!customer&&pending?`<form id="cs-money-query-${i}"><p>Lệnh ${esc(pending.id)} · ${money(pending.amount)} đang chờ. Không gửi lại hoặc chuyển phương thức khi chưa rõ kết quả.</p>${jMock('cm-query',['Vẫn đang xử lý','Thành công','Thất bại'])}<button>Tra cứu kết quả hoàn tiền</button></form>`:''}${r.payouts?.length?table(['Lần hoàn','Phương thức','Tiền','Kết quả / chứng từ'],r.payouts.map(x=>[esc(x.id),esc(x.method),money(x.amount),esc(({pending:'Đang xử lý',success:'Thành công',failed:'Thất bại'})[x.status])+' · '+esc(x.proof||'Chờ chứng từ')])):''}${r.approved&&!r.coinDone&&!customer?btn('Đối chiếu hoàn xu và điều chỉnh thưởng','j-refund-coins-'+i):''}`);}
const csOldRefund=jRefund;
jRefund=customer=>orderFlight()?card('Hoàn tiền toàn bộ hoặc một phần',`<p>CS xác nhận số hoàn cuối cùng và trực tiếp hoàn qua OnePay hoặc ghi nhận hoàn thủ công. Kế toán theo dõi, hỗ trợ đối soát.</p>`)+journey().refunds.map((r,i)=>r.service==='flight'?csMoneyCard(r,i,customer):'').join(''):csOldRefund(customer);
function csSettleMoney(r,p,status){if(p.status!=='pending')return false;p.status=status;if(status==='success'){p.proof=p.proof||'ONEPAY-REFUND-'+p.id;r.moneyPaid=csMoneyPaid(r)+p.amount;r.moneyDone=r.moneyPaid===r.amount;}r.status=r.moneyDone?'Tiền đã trả đủ':status==='failed'?'Lần hoàn thất bại · có thể kiểm tra và thử lại':'Đã hoàn một phần';jRefundComplete(r);jLog(r.id+': '+r.status);save();return true;}
function csPay(i,v){const r=journey().refunds[i];if(!r||r.service!=='flight'||!r.approved||!csCan()||!v['cm-consent'])return false;const amount=Number(v['cm-amount']),left=r.amount-csMoneyPaid(r);if(!Number.isFinite(amount)||amount<=0||amount>left||(r.payouts||[]).some(p=>p.status==='pending')||!v['cm-target']?.trim())return false;const manual=v['cm-method']==='Hoàn thủ công';if(manual&&!v['cm-proof']?.trim())return toast('Hoàn thủ công cần SCT hoặc chứng từ giao dịch đã thực hiện.');r.moneyPaid=csMoneyPaid(r);const p={id:r.id+'-P'+((r.payouts||[]).length+1),amount,method:v['cm-method'],target:v['cm-target'].trim(),proof:manual?v['cm-proof'].trim():'',status:'pending',at:stamp(),actor:st.role};(r.payouts||(r.payouts=[])).push(p);r.transfer=p.id;r.status='Đang hoàn tiền';if(manual)csSettleMoney(r,p,'success');else if(v['cm-result']==='Thành công')csSettleMoney(r,p,'success');else if(v['cm-result']==='Thất bại')csSettleMoney(r,p,'failed');jLog(r.id+': '+p.method+' · '+money(amount));save();return true;}
function csMoneyQuery(i,v){const r=journey().refunds[i],p=r?.payouts?.find(x=>x.status==='pending');if(!r||!p||!csCan())return false;if(v['cm-query']==='Thành công')return csSettleMoney(r,p,'success');if(v['cm-query']==='Thất bại')return csSettleMoney(r,p,'failed');return false;}
const csPreviousResults=auditResults;
auditResults=r=>r.type!=='mileage'?csPreviousResults(r):auditForm('Cập nhật thông tin thành viên đã xác nhận','cs-member-result',`<div class="grid">${field('Chương trình thành viên','mb-program','text','Lotusmiles','',true)}${field('Số thẻ thành viên','mb-number','text','','',true)}${field('Hạng thành viên (nếu có)','mb-tier','text','','Ví dụ: Silver / Gold; để trống nếu chưa được xác nhận.')}${field('Hành khách / số vé áp dụng','mb-scope','text',r.scope||journey().flight.name+' · '+journey().flight.ticket,'',true)}${field('Tham chiếu xác nhận cập nhật','mb-proof','text','','',true)}</div>${tick('Thông tin đã được xác nhận cho đúng hành khách','mb-confirm')}`,'Hoàn tất & cập nhật lên đơn');
submits['cs-member-result']=v=>{const r=flightOpsSelected();if(!r||r.type!=='mileage'||r.closed||!csTicketCan()||!v['mb-confirm']||!['mb-program','mb-number','mb-scope','mb-proof'].every(k=>v[k]?.trim()))return toast('Nhập chương trình, số thẻ, phạm vi và căn cứ xác nhận.');const f=journey().flight;f.mileage={program:v['mb-program'].trim(),number:v['mb-number'].trim(),tier:(v['mb-tier']||'').trim(),scope:v['mb-scope'].trim(),proof:v['mb-proof'].trim(),value:v['mb-program'].trim()+' · '+v['mb-number'].trim()+(v['mb-tier']?' · '+v['mb-tier'].trim():''),at:stamp()};r.closed=true;r.step='done';r.resultRef=f.mileage.proof;r.publicStatus='Đã cập nhật thông tin thành viên vào đơn';auditEvent(r,'Hoàn tất');save();render();};
function csMemberCard(){const m=journey().flight.mileage;if(!m)return '';return card('Thông tin thành viên của hành khách',m.program?kv([['Hành khách / vé',esc(m.scope)],['Chương trình',esc(m.program)],['Số thẻ',esc(m.number)],['Hạng thành viên',esc(m.tier||'Chưa xác nhận')]]):`<p>${esc(m.value)}</p>`) ;}
const csOverviewBase=flightOverviewV2;
flightOverviewV2=()=>csOverviewBase().replace(/<section class="card"><h2>Thẻ thành viên đã bổ sung<\/h2>[\s\S]*?<\/section>/,'')+csMemberCard();
const csCustomerBase=currentCustomerFlight;
currentCustomerFlight=()=>csCustomerBase()+csMemberCard()+journey().refunds.filter(r=>r.service==='flight').map(r=>card('Tiến độ hoàn tiền '+r.id,kv([['Phạm vi',esc(r.scope)],['Tình trạng',esc(r.status)],['Đã trả / tổng tiền hoàn',money(csMoneyPaid(r))+' / '+money(r.amount)]]))).join('');
const csOldBind=bindOps;
bindOps=()=>{csOldBind();flightOpsState().forEach((r,i)=>{actions['flight-ops-open-'+i]=()=>csOpenOps(i);});journey().manual.forEach((r,i)=>{actions['cs-manual-'+i]=()=>csOpenManual(i);actions['cs-name-qr-'+i]=()=>{const o=journey().orders.find(x=>x.manualId===r.id);if(o){journey().selected=o.id;if(orderCustomer()){go('S20');}else{flightSection='payment';render();}}};if(r.type==='Hoàn vé'){submits['j-manual-quote-'+i]=()=>toast('Dùng bước tính hoàn qua API trong Yêu cầu & xử lý.');submits['j-manual-done-'+i]=()=>toast('Dùng CS xác nhận hoàn vé qua API.');}});csRefRecords().forEach(({r,ref})=>{submits['cs-quote-'+ref]=v=>{csCalculate(ref,v);render();};submits['cs-consent-'+ref]=v=>{csConsent(ref,v,orderCustomer());render();};submits['cs-api-'+ref]=v=>{csExecute(ref,v);render();};submits['cs-query-'+ref]=v=>{csQuery(ref,v);render();};});journey().refunds.forEach((r,i)=>{if(r.service!=='flight')return;submits['cs-money-'+i]=v=>{if(!csPay(i,v))toast('Kiểm tra quyền, số tiền còn lại, giao dịch và chứng từ.');render();};submits['cs-money-query-'+i]=v=>{csMoneyQuery(i,v);render();};actions['j-refund-send-'+i]=()=>toast('Chọn OnePay hoặc hoàn thủ công trên khoản hoàn.');submits['j-refund-settle-'+i]=()=>toast('Đối chiếu từng lần hoàn tiền để cập nhật đúng số tiền đã trả.');});};
const csOldProviderSubmit=submits['audit-provider-result'];
submits['audit-provider-result']=v=>{if(['fareRefund','partialRefund','mileage'].includes(flightOpsSelected()?.type))return toast('Dùng biểu mẫu nghiệp vụ hiện tại để cập nhật đúng dữ liệu lên đơn.');return csOldProviderSubmit(v);};
const csOldReceive=jReceivePayment;
jReceivePayment=outcome=>{const ok=csOldReceive(outcome),o=jOrder();if(o?.payment==='Đã thu'&&!o.paymentEvidence){o.paymentEvidence={reference:o.receipt||'PAY-'+o.id,amount:o.amount,at:stamp(),source:'Kết quả cổng thanh toán (mô phỏng)'};save();}return ok;};
const csOldPayment=jPayment;
jPayment=o=>{o=o||jOrder();return csOldPayment(o)+(o?.paymentEvidence?card('Chứng từ thanh toán bổ sung',kv([['Mã khoản thu',esc(o.id)],['Mã giao dịch',esc(o.paymentEvidence.reference)],['Số tiền đã ghi nhận',money(o.paymentEvidence.amount)],['Thời điểm',esc(o.paymentEvidence.at)],['Nguồn xác nhận',esc(o.paymentEvidence.source)]])):'');};
const csOverviewClean=flightOverviewV2;
flightOverviewV2=()=>csOverviewClean().replace(/<section class="card"><h2>Trung tâm nghiệp vụ vé<\/h2>[\s\S]*?<\/section>/,card('CS thao tác trên đơn',`<p><b>Hoàn theo điều kiện:</b> CS tính và hoàn vé qua API, trả tiền qua OnePay hoặc thủ công.</p><p><b>Sửa tên:</b> CS gửi HNH thực hiện, nhận kết quả rồi cập nhật tên.</p>${btn('Mở yêu cầu & xử lý','flight-ops-center','primary')}`));
const csOldRequest=submits['j-manual-request'];
submits['j-manual-request']=v=>{const n=journey().manual.length;csOldRequest(v);if(!orderCustomer()&&journey().manual.length>n)csOpenManual(n);};
function csTicketChanges(){const data=journey().flight.refundedScopes||[];return data.length?card('Phạm vi vé / dịch vụ đã hoàn',table(['Yêu cầu','Phạm vi đã cập nhật','Tiền được trả'],data.map(x=>[esc(x.request),esc(x.scope),money(x.amount)]))):'';}
const csOverviewUpdated=flightOverviewV2;flightOverviewV2=()=>csOverviewUpdated()+csTicketChanges();
const csCustomerUpdated=currentCustomerFlight;currentCustomerFlight=()=>csCustomerUpdated()+csTicketChanges();

/* Customer action hierarchy: retain Bookese layout and reveal secondary tasks on demand. */
const compactCustomerFlightBase=currentCustomerFlight;
currentCustomerFlight=()=>{
 let html=compactCustomerFlightBase();
 const controls=`<div class="customer-compact-controls">
 <div class="customer-main-actions">${btn('Xem vé điện tử','j-face','primary')}${btn('Hành lý, chỗ ngồi & dịch vụ','flight-section-services')}${btn('Đổi vé','flight-section-exchange')}</div>
 <details class="customer-support-menu"><summary>Yêu cầu hỗ trợ</summary><p class="note">Gửi yêu cầu để Bookese kiểm tra và phản hồi.</p><div class="customer-support-options">${btn('Sửa / đổi tên hành khách','live-name-request')}${btn('Yêu cầu hoàn vé','customer-refund-request')}${btn('Bổ sung thẻ thành viên','customer-flight-mileage')}</div></details>
 <details class="customer-support-menu"><summary>Vé & email</summary>${btn('Gửi lại email vé','customer-resend-demo')}</details>
 </div>`;
 html=html.replace('Tất cả các thông tin có đều chính xác?','Quản lý vé').replace('<p>Bạn có thể xem vé, chọn chỗ ngồi, mua thêm dịch vụ hoặc đổi vé ngay trên đơn đặt chỗ.</p>','');
 html=html.replace(/<div class="customer-flight-action-list">[\s\S]*?<\/div><hr>/,controls+'<hr>');
 html=html.replace(/(<section class="card"><h2>Thông tin thanh toán<\/h2>[\s\S]*?)(<\/section>)/,'$1<div class="customer-invoice-action">'+btn('Thông tin hóa đơn VAT','customer-flight-invoice')+'</div>$2');
 return html;
};

const processingPaymentBase=jPayment;
jPayment=o=>{o=o||jOrder();return (o?.kind==='ops-fee'?card('Chi tiết khoản thu',kv([['Khoản trả thêm theo NCC',money(o.supplierCollect??o.amount)],['Phí xử lý Bookese',money(o.processingFee||0)],['Tổng thanh toán thêm',money(o.amount)]])):'')+processingPaymentBase(o);};

window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0)});actions['flight-service']=()=>document.getElementById('flight-service')?.scrollIntoView({behavior:'smooth',block:'start'});
render();
</script></body></html>
